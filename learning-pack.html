<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>原点智学 - 学习包</title>
<meta name="description" content="原点智学学习包，把作业、错题、笔记和 PPT 要点变成知识卡、小测验、复习计划和错因卡。">
<meta name="theme-color" content="#FDFBF6">
<meta name="ydzx-page" content="learning-pack">
<link rel="icon" href="/assets/miniapp-logo-kid.png">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  color:#1f2933;
  background:#f3f4f6;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button,textarea{font:inherit}
button{border:0;cursor:pointer}
textarea{border:0}
::-webkit-scrollbar{display:none}
.phone{
  position:relative;
  width:100%;
  max-width:375px;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:#fdfbf6;
}
.soft-shadow{
  box-shadow:0 8px 24px -6px rgba(0,0,0,.03),0 2px 8px -2px rgba(0,0,0,.02);
}
.header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 20px 16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.logo{
  position:relative;
  width:28px;
  height:28px;
  flex:0 0 auto;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#1d4e39;
  border-radius:50%;
}
.logo::before{
  content:"";
  position:absolute;
  top:-4px;
  right:-4px;
  width:16px;
  height:16px;
  background:#f8d879;
  border-radius:50%;
  opacity:.92;
}
.logo::after{
  content:"";
  position:relative;
  z-index:1;
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
}
.brand-copy{
  display:flex;
  align-items:baseline;
  gap:7px;
  min-width:0;
}
.brand-name{
  color:#111827;
  font-size:17px;
  font-weight:800;
  line-height:1;
  letter-spacing:-.02em;
  white-space:nowrap;
}
.brand-divider{
  width:1px;
  height:12px;
  background:#d1d5db;
  border-radius:999px;
}
.brand-sub{
  color:#6b7280;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.page-pill{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 12px;
  color:#1d4e39;
  background:#fff;
  border:1px solid #f3f4f6;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}
.page-pill::before{
  content:"";
  width:6px;
  height:6px;
  background:#1d4e39;
  border-radius:50%;
}
.main{
  flex:1;
  overflow-y:auto;
  padding:0 20px 104px;
}
.hero{
  position:relative;
  padding:8px 0 20px;
}
.spark{
  position:absolute;
  top:-8px;
  right:16px;
  width:48px;
  height:48px;
  color:#f8d879;
  opacity:.42;
  pointer-events:none;
}
.hero h1{
  position:relative;
  z-index:1;
  max-width:300px;
  margin:0 0 8px;
  color:#111827;
  font-size:26px;
  font-weight:900;
  line-height:1.16;
  letter-spacing:-.02em;
}
.hero p{
  position:relative;
  z-index:1;
  max-width:300px;
  margin:0;
  color:#6b7280;
  font-size:13px;
  font-weight:500;
  line-height:1.75;
}
.segmented{
  position:relative;
  display:flex;
  gap:4px;
  margin-bottom:20px;
  padding:4px;
  background:rgba(243,244,246,.62);
  border:1px solid rgba(243,244,246,.58);
  border-radius:999px;
}
.segmented button{
  position:relative;
  z-index:1;
  flex:1;
  min-height:38px;
  color:#6b7280;
  background:transparent;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;
}
.segmented button.active{
  color:#111827;
  background:#fff;
  box-shadow:0 8px 24px -6px rgba(0,0,0,.04),0 2px 8px -2px rgba(0,0,0,.03);
}
.factory-card{
  position:relative;
  overflow:hidden;
  padding:20px;
  background:#fff;
  border:1px solid rgba(249,250,251,.9);
  border-radius:28px;
}
.factory-card::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:128px;
  height:128px;
  background:linear-gradient(225deg,rgba(234,243,241,.52),rgba(234,243,241,0));
  pointer-events:none;
}
.input-card{
  position:relative;
  z-index:1;
  min-height:154px;
  padding:16px;
  background:#f0f7f5;
  border:1px solid #eaf3f1;
  border-radius:16px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.02);
  transition:background .18s ease,border-color .18s ease;
}
.input-card:focus-within{
  background:#e8f3f1;
  border-color:#d8ebe6;
}
.pack-textarea{
  width:100%;
  height:120px;
  resize:none;
  outline:none;
  color:#374151;
  background:transparent;
  font-size:14px;
  font-weight:500;
  line-height:1.72;
}
.pack-textarea::placeholder{color:rgba(107,114,128,.72)}
.input-icon{
  position:absolute;
  right:12px;
  bottom:11px;
  color:#a8c5bd;
}
.upload-drop{
  position:relative;
  z-index:1;
  display:none;
  min-height:154px;
  padding:20px;
  align-items:center;
  gap:16px;
  background:#f0f7f5;
  border:1.5px dashed #c9ddd7;
  border-radius:16px;
}
.upload-icon{
  width:48px;
  height:48px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#fff;
  background:#1d4e39;
  border-radius:16px;
  font-size:26px;
  font-weight:700;
}
.upload-title{
  color:#111827;
  font-size:14px;
  font-weight:800;
}
.upload-desc{
  margin-top:5px;
  color:#6b7280;
  font-size:12px;
  font-weight:500;
  line-height:1.55;
}
.factory-card.upload-mode .input-card{display:none}
.factory-card.upload-mode .upload-drop{display:flex}
.contains{
  position:relative;
  z-index:1;
  margin-top:20px;
}
.contains-label{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:10px;
  color:#9ca3af;
  font-size:11px;
  font-weight:700;
}
.contains-label svg{width:12px;height:12px}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.chip{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  color:#4b5563;
  background:#f9fafb;
  border:1px solid #f3f4f6;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
}
.chip i{
  width:6px;
  height:6px;
  background:rgba(29,78,57,.4);
  border-radius:50%;
}
.chip.cause i{background:#f8d879}
.primary-btn{
  position:relative;
  z-index:1;
  width:100%;
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:28px;
  color:#fff;
  background:#1d4e39;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(29,78,57,.2);
  font-size:15px;
  font-weight:700;
  transition:transform .16s ease,background .16s ease;
}
.primary-btn:active{transform:scale(.98)}
.primary-btn:hover{background:#173f30}
.text-link{
  position:relative;
  z-index:1;
  display:block;
  margin:18px auto 0;
  padding:0;
  color:#9ca3af;
  background:transparent;
  border-bottom:1px solid #d1d5db;
  font-size:12px;
  font-weight:600;
  line-height:1.7;
  transition:color .18s ease,border-color .18s ease;
}
.text-link:hover{color:#4b5563;border-color:#9ca3af}
.preview{
  margin-top:30px;
  margin-bottom:8px;
}
.generated-pack{
  display:none;
  margin-top:18px;
  padding:18px;
  background:#fff;
  border:1px solid #edf2ef;
  border-radius:18px;
}
.generated-pack.show{display:block}
.generated-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.generated-kicker{
  color:#1d4e39;
  font-size:11px;
  font-weight:900;
}
.generated-title{
  margin-top:3px;
  color:#111827;
  font-size:15px;
  font-weight:900;
  line-height:1.35;
}
.generated-status{
  flex:0 0 auto;
  padding:5px 9px;
  color:#9e7a3d;
  background:#f8f2df;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}
.generated-list{
  display:grid;
  gap:9px;
}
.generated-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 0;
  border-top:1px solid #f3f4f6;
}
.generated-index{
  width:24px;
  height:24px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#1d4e39;
  background:#eaf3f1;
  border-radius:8px;
  font-size:11px;
  font-weight:900;
}
.generated-row b{
  display:block;
  color:#1f2937;
  font-size:13px;
}
.generated-row span{
  display:block;
  margin-top:2px;
  color:#6b7280;
  font-size:12px;
  line-height:1.45;
}
.generated-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.generated-actions a{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  font-size:13px;
  font-weight:900;
}
.generated-actions .solid{color:#fff;background:#1d4e39}
.generated-actions .soft{color:#1d4e39;background:#eaf3f1}
.section-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
  padding:0 4px;
}
.section-mark{
  width:4px;
  height:14px;
  background:#1d4e39;
  border-radius:999px;
}
.section-head h2{
  margin:0;
  color:#1f2937;
  font-size:14px;
  font-weight:900;
}
.preview-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.preview-card{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:74px;
  padding:16px;
  background:#fff;
  border:1px solid #f9fafb;
  border-radius:16px;
}
.preview-icon{
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:12px;
}
.preview-icon.green{color:#2b6d51;background:#eaf3f1}
.preview-icon.gold{color:#9e7a3d;background:#f4f1eb}
.preview-icon.warn{color:#d97706;background:#fff8eb}
.preview-title{
  color:#1f2937;
  font-size:13px;
  font-weight:800;
  line-height:1.35;
}
.preview-desc{
  margin-top:3px;
  color:#9ca3af;
  font-size:11px;
  font-weight:500;
  line-height:1.35;
}
.bottom-nav{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 24px 28px;
  background:#fff;
  border-top:1px solid #f3f4f6;
}
.nav-item{
  width:64px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:#9ca3af;
  background:transparent;
  font-size:10px;
  font-weight:600;
  transition:color .18s ease;
}
.nav-item:hover{color:#4b5563}
.nav-item.active{color:#1d4e39;font-weight:800}
.nav-icon{position:relative;width:24px;height:24px;display:grid;place-items:center}
.nav-icon svg{width:24px;height:24px}
.active-dot{
  position:absolute;
  top:-4px;
  right:-4px;
  width:10px;
  height:10px;
  background:#f8d879;
  border:2px solid #fff;
  border-radius:50%;
}
.toast{
  position:absolute;
  left:20px;
  right:20px;
  bottom:94px;
  z-index:30;
  padding:12px 14px;
  color:#fff;
  background:#1d4e39;
  border-radius:14px;
  font-size:13px;
  font-weight:700;
  text-align:center;
  box-shadow:0 12px 28px rgba(29,78,57,.22);
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
}
.toast.show{opacity:1;transform:translateY(0)}
@media (min-width:640px){
  body{align-items:flex-start}
  .phone{
    height:812px;
    margin:32px 0;
    border:8px solid #111827;
    border-radius:40px;
    box-shadow:0 26px 70px rgba(0,0,0,.28);
  }
  .bottom-nav{border-radius:0 0 32px 32px;padding-bottom:24px}
}
@media (max-width:430px){
  body{background:#fdfbf6}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<main class="phone" aria-label="原点智学学习包页面">
  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="brand-copy">
        <div class="brand-name">原点智学</div>
        <div class="brand-divider" aria-hidden="true"></div>
        <div class="brand-sub">材料入口</div>
      </div>
    </div>
    <div class="page-pill">学习包</div>
  </header>

  <section class="main">
    <div class="hero">
      <svg class="spark" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
        <path d="M50 0C50 27.6142 72.3858 50 100 50C72.3858 50 50 72.3858 50 100C50 72.3858 27.6142 50 0 50C27.6142 50 50 27.6142 50 0Z"></path>
      </svg>
      <h1>把材料变成学习包</h1>
      <p>作业、错题、笔记、PPT 要点都可以先粘贴一段。</p>
    </div>

    <div class="segmented" role="tablist" aria-label="学习包输入方式">
      <button class="active" type="button" role="tab" aria-selected="true" data-mode="text">粘贴文本</button>
      <button type="button" role="tab" aria-selected="false" data-mode="upload">上传材料</button>
    </div>

    <section class="factory-card soft-shadow" id="factory-card">
      <div class="input-card">
        <textarea id="material-input" class="pack-textarea" placeholder="粘贴作业 / 错题 / 笔记。写不完整也可以先生成。"></textarea>
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM176,88a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,88Zm0,40a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,128Zm-48,40a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h32A8,8,0,0,1,128,168Z"></path></svg>
      </div>

      <button class="upload-drop" type="button" id="upload-drop">
        <span class="upload-icon">+</span>
        <span>
          <span class="upload-title">拍照或选择学习材料</span>
          <span class="upload-desc">支持作业照片、笔记截图、PPT 要点截图。当前会先保存到本机。</span>
        </span>
      </button>

      <div class="contains">
        <div class="contains-label">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"></path></svg>
          包内将包含
        </div>
        <div class="chips">
          <span class="chip"><i></i>知识卡</span>
          <span class="chip"><i></i>小测验</span>
          <span class="chip"><i></i>复习计划</span>
          <span class="chip cause"><i></i>错因卡</span>
        </div>
      </div>

      <button class="primary-btn" type="button" id="generate-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216ZM154.56,151.78l-21.78,24V128a8,8,0,0,0-16,0v47.79l-21.78-24a8,8,0,1,0-11.85,10.7l35,38.56a8.07,8.07,0,0,0,11.86,0l35-38.56a8,8,0,1,0-10.45-11.7Z"></path></svg>
        生成学习包
      </button>
      <button class="text-link" type="button" id="sample-btn">不知道粘什么？填入样例</button>
    </section>

    <section class="preview">
      <div class="section-head">
        <span class="section-mark" aria-hidden="true"></span>
        <h2>包内结构预览</h2>
      </div>
      <div class="preview-grid">
        <div class="preview-card soft-shadow">
          <div class="preview-icon green">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM120,88v80a8,8,0,0,1-16,0V88a8,8,0,0,1,16,0Zm56,0v80a8,8,0,0,1-16,0V88a8,8,0,0,1,16,0ZM112,128a8,8,0,0,1-8,8H72a8,8,0,0,1,0-16h32A8,8,0,0,1,112,128Zm56,0a8,8,0,0,1-8,8H128a8,8,0,0,1,0-16h32A8,8,0,0,1,168,128Zm56,0a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16h32A8,8,0,0,1,224,128Z"></path></svg>
          </div>
          <div><div class="preview-title">知识点卡</div><div class="preview-desc">提炼核心概念</div></div>
        </div>
        <div class="preview-card soft-shadow">
          <div class="preview-icon gold">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM224,128a96,96,0,1,1-96-96A96.11,96.11,0,0,1,224,128Zm-16,0a80,80,0,1,0-80,80A80.09,80.09,0,0,0,208,128Z"></path></svg>
          </div>
          <div><div class="preview-title">5 道小测</div><div class="preview-desc">即时自测巩固</div></div>
        </div>

<script src="/src/track.js"></script>
<script>
  const factoryCard = document.getElementById('factory-card');
  const tabs = Array.from(document.querySelectorAll('[data-mode]'));
  const input = document.getElementById('material-input');
  const sampleBtn = document.getElementById('sample-btn');
  const generateBtn = document.getElementById('generate-btn');
  const uploadDrop = document.getElementById('upload-drop');
  const toast = document.getElementById('toast');
  const generatedPack = document.getElementById('generated-pack');
  const generatedTitle = document.getElementById('generated-title');
  const packKnowledge = document.getElementById('pack-knowledge');
  const packCause = document.getElementById('pack-cause');
  let toastTimer = null;

  function setMode(mode) {
    tabs.forEach((tab) => {
      const active = tab.dataset.mode === mode;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    factoryCard.classList.toggle('upload-mode', mode === 'upload');
    if (window.YDZX_TRACK) YDZX_TRACK.event('learning_pack_mode', { mode });
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function updateGeneratedPack(text) {
    const lines = text.split(/[\n。；;]+/).map((line) => line.trim()).filter(Boolean);
    const first = lines[0] || '先把材料拆成一个最容易开始的小步。';
    const cause = lines.find((line) => /错因|卡|混|忘|不会|陷阱/.test(line)) || '记录下次先检查什么，而不是只说粗心。';
    generatedTitle.textContent = first.slice(0, 24);
    packKnowledge.textContent = first.slice(0, 42);
    packCause.textContent = cause.slice(0, 46);
    generatedPack.classList.add('show');
    generatedPack.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  tabs.forEach((tab) => tab.addEventListener('click', () => setMode(tab.dataset.mode)));

  sampleBtn.addEventListener('click', () => {
    setMode('text');
    input.value = [
      '数学方程应用题：孩子经常把“总价”和“单价”看反。',
      '今天作业：基础题 8 道，应用题 4 道。',
      '错因：没有先圈已知、未知和目标量。',
      '希望生成知识卡、5 道小测和复习计划。'
    ].join('\\n');
    input.focus();
    showToast('已填入样例，可以直接生成学习包。');
  });

  generateBtn.addEventListener('click', () => {
    const mode = factoryCard.classList.contains('upload-mode') ? 'upload' : 'text';
    if (mode === 'text' && !input.value.trim()) {
      showToast('先粘贴一段作业、错题或笔记。');
      input.focus();
      return;
    }
    if (window.YDZX_TRACK) YDZX_TRACK.event('learning_pack_generate_click', { mode });
    updateGeneratedPack(mode === 'text' ? input.value.trim() : '已选择材料。先补一句主要知识点和孩子卡点，再进入复习闯关。');
    showToast('学习包已准备好，下一步可进入复习闯关。');
  });

  uploadDrop.addEventListener('click', () => {
    showToast('演示版先展示入口，真实小程序内会打开材料选择。');
  });

  if (window.YDZX_TRACK) YDZX_TRACK.event('learning_pack_view', { source: 'variant_ui' });
</script>

name: Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/mini/**'
      - 'miniprogram/**'
      - 'docs/MINIAPP-*.md'
      - 'scripts/observability-dry-run.cjs'
      - 'scripts/check-static-links.cjs'
      - 'scripts/miniapp-launch-assistant.cjs'
      - 'scripts/test-miniapp-production.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '*.html'
      - 'subjects/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/mini/**'
      - 'miniprogram/**'
      - 'docs/MINIAPP-*.md'
      - 'scripts/observability-dry-run.cjs'
      - 'scripts/check-static-links.cjs'
      - 'scripts/miniapp-launch-assistant.cjs'
      - 'scripts/test-miniapp-production.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '*.html'
      - 'subjects/**'
      - '.github/workflows/test.yml'

jobs:
  production-gates:
    name: Web and miniapp production gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run web tests
        run: npm test
      - name: Run miniapp production hardening checks
        run: npm run test:miniapp-prod
      - name: Run miniapp launch precheck
        run: npm run miniapp:check
      - name: Surface log on failure
        if: failure()
        run: |
          echo '::error title=Production gate failed::A required web or miniapp production check returned non-zero. See log above.'

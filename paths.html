<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学科教材 · 56 本人教/统编 · 原点智学</title>
<meta name="description" content="9 大学科 56 本教材按学段铺开，每章可读、可练、可冲关。全部本地状态驱动，不上传服务器。">
<meta name="ydzx-page" content="paths">
<meta name="theme-color" content="#0F4F3D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%231A1A1A' stroke-width='5'/><circle cx='50' cy='50' r='14' fill='%230F4F3D'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.cnpmjs.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.cnpmjs.org/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  /* v2 spec tokens */
  --bg-primary:#FAF7F0;--bg-secondary:#F2EEE3;--bg-elevated:#FFFFFF;
  --text-primary:#1A1A1A;--text-secondary:#4A4A47;--text-tertiary:#8A8780;--text-muted:#B8B5AC;
  --accent-primary:#0F4F3D;--accent-hover:#0A3D2E;--accent-light:#E8EFE9;
  --accent-warm:#B85C2E;--accent-warm-light:#F5E8DF;
  --border-subtle:rgba(26,26,26,0.06);--border-default:rgba(26,26,26,0.10);--border-strong:rgba(26,26,26,0.20);
  --font-serif-sc:"Noto Serif SC",ui-serif,Georgia,serif;
  --font-sans-sc:"Noto Sans SC",ui-sans-serif,system-ui,sans-serif;
  --font-en:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-serif-en:"Instrument Serif",ui-serif,Georgia,serif;
  /* legacy aliases for inline classes */
  --primary:var(--accent-primary);
  --ink:var(--text-primary);
  --ink-2:var(--text-secondary);
  --ink-3:var(--text-tertiary);
  --bg:var(--bg-primary);
  --bg-2:var(--bg-secondary);
  --border:var(--border-subtle);
  /* mastery 4 阶灰度 (kept) */
  --m-0:#EAE6DC;       /* 未碰 - 米色 */
  --m-1:#CFC9BB;       /* 读过 */
  --m-2:#7A776E;       /* 读+练 */
  --m-3:#1A1A1A;       /* 已掌握 */
  --m-err-bg:#F5E8DF;  /* 错题 - 砖红浅底 */
  --m-err-text:#8B3A1F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-sans-sc);
  font-size:15px;line-height:1.7;color:var(--text-primary);background:var(--bg-primary);
  -webkit-font-smoothing:antialiased;font-weight:400;font-feature-settings:"palt" 1;
}
a{color:inherit;text-decoration:none}

.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(250,247,240,0.92);backdrop-filter:blur(12px);border-bottom:0.5px solid var(--border-subtle);height:68px}
.nav-in{max-width:1200px;margin:0 auto;height:100%;padding:0 40px;display:flex;align-items:center;gap:32px}
@media(max-width:768px){.nav-in{padding:0 24px}.nav{height:60px}}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--text-primary);letter-spacing:0.04em}
.brand-dot{width:22px;height:22px;border:1.5px solid var(--text-primary);border-radius:50%;position:relative}
.brand-dot::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--accent-primary);border-radius:50%;transform:translate(-50%,-50%)}
.nav-links{display:flex;gap:28px;flex:1;justify-content:center}
.nav-links a{font-size:13px;color:var(--ink-2);transition:color .15s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.active{color:var(--ink);font-weight:500}
.nav-login{font-size:13px;color:var(--ink-2);transition:color .15s}
.nav-login:hover{color:var(--ink)}
@media (max-width:768px){
  .nav-in{padding:0 20px;gap:0;overflow-x:auto;white-space:nowrap}
  .nav-links{flex:0 0 auto;gap:20px;justify-content:flex-start}
  .nav-links a{font-size:12px}
  .nav-login{margin-left:auto}
}

.page{padding-top:68px}
@media(max-width:768px){.page{padding-top:60px}}
main{max-width:1200px;margin:0 auto;padding:120px 40px 96px}
@media (max-width:768px){main{padding:64px 24px 64px}}

.head{margin-bottom:48px}
.eyebrow{font-family:var(--font-serif-en);font-style:italic;font-size:14px;color:var(--accent-primary);margin-bottom:20px;letter-spacing:0.01em}
.eyebrow-en{font-family:var(--font-serif-en);font-style:italic;font-size:14px;color:var(--accent-primary);letter-spacing:0.01em;margin-bottom:20px}
.head h1{font-family:var(--font-serif-sc);font-weight:500;font-size:clamp(36px,5vw,56px);letter-spacing:0.02em;line-height:1.18;color:var(--text-primary);margin-bottom:24px}
.head .sub{font-size:15px;color:var(--text-secondary);max-width:640px;line-height:1.8}
.head .sub b{font-weight:500;color:var(--text-primary)}
@media (max-width:768px){.head h1{font-size:32px}}
.stage-row{margin-top:48px !important}
@media(max-width:768px){.stage-row{margin-top:32px !important}}

#streak-mount,#upnext-banner-mount{margin-bottom:14px}

.stage-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin:24px 0}
.stage-tabs{display:inline-flex;border:0.5px solid var(--border);border-radius:6px;overflow:hidden;height:32px}
.stage-tabs button{
  background:none;border:none;border-right:0.5px solid var(--border);
  padding:0 14px;font-family:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;
  transition:all .15s;height:100%;
}
.stage-tabs button:last-child{border-right:none}
.stage-tabs button:hover{background:var(--bg-2);color:var(--ink)}
.stage-tabs button.on{background:var(--ink);color:var(--bg)}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;border:0.5px solid var(--border)}
.legend i.lg-0{background:var(--m-0)}
.legend i.lg-1{background:var(--m-1)}
.legend i.lg-2{background:var(--m-2)}
.legend i.lg-3{background:var(--m-3);border-color:var(--m-3)}
.legend i.lg-err{background:var(--m-err-bg);border-color:#FCA5A5}
.legend i.lg-cleared{background:var(--m-3);box-shadow:0 0 0 1.5px var(--primary);border-color:var(--m-3)}

#path-mount{display:flex;flex-direction:column;gap:32px}
.subj-row{}
.subj-name{
  display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  padding-bottom:12px;margin-bottom:14px;
  border-bottom:0.5px solid var(--border);
}
.subj-name>span:first-child{font-size:16px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.subj-name small{font-size:12px;color:var(--ink-3);font-weight:400}
.subj-name .mastery-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:2px 8px;border-radius:4px;
  font-size:11px;color:var(--ink-2);background:var(--bg-2);
}
.subj-name .mastery-chip b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.subj-name .mastery-chip.err{background:var(--m-err-bg);color:var(--m-err-text)}
.subj-name .mastery-chip.cleared-chip{background:var(--bg);color:var(--primary);border:0.5px solid var(--primary)}

.grade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.grade-card{
  background:var(--bg);
  border:0.5px solid var(--border);border-radius:8px;
  padding:14px 16px;transition:border-color .15s;
}
.grade-card:hover{border-color:var(--border-strong)}
.gc-title{font-size:13px;color:var(--ink);font-weight:500;margin-bottom:2px}
.gc-meta{font-size:11px;color:var(--ink-3);margin-bottom:10px}
.gc-chs{display:flex;flex-wrap:wrap;gap:4px}
.gc-chs a{
  width:22px;height:22px;border-radius:4px;
  background:var(--m-0);border:0.5px solid var(--border);
  font-size:10px;line-height:21px;text-align:center;
  font-weight:400;color:var(--ink-3);
  transition:all .12s;font-variant-numeric:tabular-nums;
}
.gc-chs a:hover{transform:translateY(-1px);border-color:var(--border-strong)}
.gc-chs a.lvl-1{background:var(--m-1);color:var(--ink-2);border-color:var(--m-1)}
.gc-chs a.lvl-2{background:var(--m-2);color:#fff;border-color:var(--m-2)}
.gc-chs a.lvl-3{background:var(--m-3);color:#fff;border-color:var(--m-3)}
.gc-chs a.err{background:var(--m-err-bg);color:var(--m-err-text);border-color:#FCA5A5}
.gc-chs a.cleared{box-shadow:0 0 0 1.5px var(--primary);position:relative;z-index:1}

.empty{padding:48px 16px;text-align:center;color:var(--ink-3);font-size:13px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a href="/" class="brand">
      <span class="brand-dot"></span>
      <span>原点智学</span>
    </a>
    <div class="nav-links">
      <a href="/#tools">免费工具</a>
      <a href="/tutor" class="active">AI 私教</a>
      <a href="/#pricing">课程产品</a>
      <a href="/progress">成长档案</a>
    </div>
    <a href="/welcome" class="nav-login">登录</a>
  </div>
</nav>

<main class="page">

  <div class="head">
    <div class="eyebrow">[Subjects.]</div>
    <h1>56 本教材按学段铺开</h1>
    <div class="sub">人教 / 统编初高中 <b id="hd-books">56</b> 本 <b id="hd-ch">284</b> 章按<b>学段 → 学科 → 年级 → 教材 → 章节</b>五级展开。每个小方块就是一章，<b>点开</b>跳到原文阅读器。已读 / 错题 / 冲关在本地数据驱动下自动点亮——不上传服务器。</div>
  </div>

  <div id="streak-mount"></div>

  <div id="upnext-banner-mount"></div>

  <div class="stage-row">
    <div class="stage-tabs" id="stage-tabs"></div>
    <div class="legend">
      <span><i class="lg-0"></i>未碰</span>
      <span><i class="lg-1"></i>读过</span>
      <span><i class="lg-2"></i>读 + 练</span>
      <span><i class="lg-3"></i>已掌握</span>
      <span><i class="lg-err"></i>错题</span>
      <span><i class="lg-cleared"></i>冲关</span>
    </div>
  </div>

  <div id="path-mount"><div class="empty">manifest 加载中…</div></div>

</main>

<script src="/src/learning-store.js"></script>
<script src="/src/streak-bar.js"></script>
<script src="/src/today-recos.js"></script>
<script src="/src/track.js"></script>
<script src="/src/wechat-cta.js" defer></script>
<script>
try { if (window.STREAK_BAR) STREAK_BAR.mount('#streak-mount'); } catch(e){}
try { if (window.TodayRecos && TodayRecos.renderUpNextBanner) TodayRecos.renderUpNextBanner('#upnext-banner-mount'); } catch(e){}

const GRADE_ORDER = ['七年级','八年级','九年级','必修','必修1','必修2','必修3','必修4','必修第一册','第一册','第二册','选择性必修','选择性必修1','选择性必修2','选择性必修3'];

let MANIFEST = null;
function inferStage(){
  let g = '';
  try { g = localStorage.getItem('yd:my_grade') || ''; } catch(e){}
  if (g.indexOf('high') === 0) return '高中';
  if (g.indexOf('middle') === 0) return '初中';
  return '初中';
}
function urlStage(){
  try {
    const m = location.search.match(/[?&]stage=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  } catch(e){ return ''; }
}
let CUR_STAGE = urlStage() || inferStage();

function $(id){ return document.getElementById(id); }
function safeGet(k, dflt){ try { return JSON.parse(localStorage.getItem(k) || (dflt!=null?JSON.stringify(dflt):'null')); } catch(e){ return dflt; } }
function gradeOrder(g){ const i = GRADE_ORDER.indexOf(g); return i < 0 ? 99 : i; }

async function init(){
  try {
    const r = await fetch('/data/extracted/manifest.json', { cache: 'force-cache' });
    MANIFEST = await r.json();
  } catch(e){
    $('path-mount').innerHTML = '<div class="empty">manifest 加载失败 · ' + (e.message||e) + '</div>';
    return;
  }
  const books = MANIFEST.books || [];
  $('hd-books').textContent = books.length;
  $('hd-ch').textContent = books.reduce((a,b)=>a+((b.chapters||[]).length), 0);

  const stages = Array.from(new Set(books.map(b => b.stage))).filter(Boolean);
  const stageOrder = ['小学','初中','高中'];
  stages.sort((a,b) => (stageOrder.indexOf(a) - stageOrder.indexOf(b)));
  $('stage-tabs').innerHTML = stages.map(s => `<button data-stage="${s}" class="${s===CUR_STAGE?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('[data-stage]').forEach(b => {
    b.addEventListener('click', () => {
      CUR_STAGE = b.dataset.stage;
      if (window.YDZX_TRACK) YDZX_TRACK.event('paths_stage_switch', { stage: CUR_STAGE });
      renderStage();
    });
  });
  renderStage();
}

function renderStage(){
  document.querySelectorAll('.stage-tabs button').forEach(b => b.classList.toggle('on', b.dataset.stage === CUR_STAGE));
  const books = (MANIFEST.books || []).filter(b => b.stage === CUR_STAGE);
  const bySubject = {};
  books.forEach(b => {
    const s = b.subject || '?';
    if (!bySubject[s]) bySubject[s] = [];
    bySubject[s].push(b);
  });
  const subjects = Object.keys(bySubject).sort();
  const readSet = new Set(safeGet('ydzx_textbook_read', []) || []);
  const clearedSet = new Set(Object.keys(safeGet('ydzx_challenge_clears_v1', {}) || {}));
  let errActive = {}, errMastered = {};
  if (window.LearningStore && window.LearningStore.getErrors) {
    try {
      (window.LearningStore.getErrors() || []).forEach(e => {
        if (!e.textbookPath || e.textbookCh == null) return;
        const k = e.textbookPath + '::ch' + e.textbookCh;
        if ((e.reviewCount || 0) >= 3) errMastered[k] = (errMastered[k]||0) + 1;
        else errActive[k] = (errActive[k]||0) + 1;
      });
    } catch(_){}
  }
  const outcomes = safeGet('ydzx_quiz_outcome_v1', {}) || {};
  const chPracticed = {};
  const quizPracticedSubjects = new Set();
  Object.keys(outcomes).forEach(id => {
    const o = outcomes[id] || {};
    if (o.book && o.ch != null){
      const k = o.book + '::ch' + o.ch;
      if (!chPracticed[k]) chPracticed[k] = { good: 0, bad: 0 };
      if (o.r === 'good') chPracticed[k].good++; else chPracticed[k].bad++;
    }
    const m = (id || '').match(/^(?:gen|ai)-([a-z]+)-/);
    if (m) quizPracticedSubjects.add(m[1]);
    if (o.subj) quizPracticedSubjects.add(o.subj);
  });
  const SUBJ_ZH_TO_KEY = {'数学':'math','物理':'physics','化学':'chemistry','生物学':'biology','语文':'chinese','英语':'english','历史':'history','地理':'geography','思想政治':'politics'};

  function clsForCh(b, c){
    const sig = b.path + '::ch' + c.ch;
    const isRead = readSet.has(sig);
    const eA = errActive[sig] || 0;
    const eM = errMastered[sig] || 0;
    const chPx = chPracticed[sig];
    const chPracticedHere = !!chPx && (chPx.good + chPx.bad) > 0;
    const chMasteredHere = !!chPx && chPx.good >= 2 && chPx.good >= chPx.bad * 2;
    const subjKey = SUBJ_ZH_TO_KEY[b.subject] || '';
    const subjPracticed = quizPracticedSubjects.has(subjKey);
    if (eA > 0) return 'err';
    if (isRead && (eM > 0 || chMasteredHere)) return 'lvl-3';
    if (isRead && (chPracticedHere || subjPracticed)) return 'lvl-2';
    if (isRead) return 'lvl-1';
    return '';
  }

  let html = '';
  subjects.forEach(subj => {
    const bs = bySubject[subj].slice().sort((a,b) => gradeOrder(a.grade) - gradeOrder(b.grade));
    const totalCh = bs.reduce((a,b) => a + ((b.chapters||[]).length), 0);
    const stat = { read:0, lvl1:0, lvl2:0, lvl3:0, err:0, cleared:0 };
    bs.forEach(b => (b.chapters||[]).forEach(c => {
      const sig = b.path+'::ch'+c.ch;
      if (readSet.has(sig)) stat.read++;
      if (clearedSet.has(sig)) stat.cleared++;
      const cls = clsForCh(b, c);
      if (cls === 'lvl-1') stat.lvl1++;
      else if (cls === 'lvl-2') stat.lvl2++;
      else if (cls === 'lvl-3') stat.lvl3++;
      else if (cls === 'err') stat.err++;
    }));
    const masteredPct = totalCh ? Math.round(stat.lvl3 / totalCh * 100) : 0;
    html += '<div class="subj-row">';
    html += `<div class="subj-name">`;
    html += `<span>${subj}</span>`;
    html += `<small>${bs.length} 本 · ${totalCh} 章 · 已读 ${stat.read}</small>`;
    html += `<span class="mastery-chip" title="lvl-3 章节 ${stat.lvl3} / 总 ${totalCh}"><b>${masteredPct}%</b> 掌握</span>`;
    if (stat.err > 0){
      html += `<span class="mastery-chip err" title="待复习的活跃错题章节数"><b>${stat.err}</b> 章错题</span>`;
    }
    if (stat.cleared > 0){
      html += `<span class="mastery-chip cleared-chip" title="本学科已通过 5 题冲关的章节"><b>${stat.cleared}</b> 章冲关</span>`;
    }
    html += '</div>';
    html += '<div class="grade-grid">';
    bs.forEach(b => {
      const gradeLabel = (b.grade || '') + (b.volume ? ' · ' + b.volume : '');
      const chs = (b.chapters || []).sort((x,y) => x.ch - y.ch);
      let chsHtml = '';
      chs.forEach(c => {
        const sig = b.path + '::ch' + c.ch;
        const isRead = readSet.has(sig);
        const eA = errActive[sig] || 0;
        const eM = errMastered[sig] || 0;
        const chPx = chPracticed[sig];
        const isCleared = clearedSet.has(sig);
        const baseCls = clsForCh(b, c);
        const cls = baseCls + (isCleared ? ' cleared' : '');
        const tipParts = [`${b.path} · 第 ${c.ch} 章`, c.title || ''];
        if (isCleared) tipParts.push('已 5 题冲关通关');
        if (eA > 0) tipParts.push(`活跃错题 ${eA}`);
        if (eM > 0) tipParts.push(`已掌握错题 ${eM}`);
        if (chPx && (chPx.good + chPx.bad) > 0) tipParts.push(`本章答过 ${chPx.good + chPx.bad} 题（对 ${chPx.good}）`);
        if (isRead && !eA && !eM && !chPx) tipParts.push('已读');
        chsHtml += `<a href="/tools/textbook-browser?book=${encodeURIComponent(b.path)}&ch=${c.ch}" class="${cls}" title="${tipParts.filter(Boolean).join(' · ').replace(/"/g,'&quot;')}">${c.ch}</a>`;
      });
      html += '<div class="grade-card">';
      html += `<div class="gc-title">${gradeLabel}</div>`;
      html += `<div class="gc-meta">${chs.length} 章 · ${b.page_count || '?'} 页</div>`;
      html += `<div class="gc-chs">${chsHtml}</div>`;
      html += '</div>';
    });
    html += '</div></div>';
  });
  $('path-mount').innerHTML = html || '<div class="empty">本学段暂无教材</div>';
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

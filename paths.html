<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAFAF7;--card:#fff;--ink:#18181B;--ink2:#3F3F46;--ink3:#71717A;--ink4:#A1A1AA;
  --bdr:#E4E4E7;--bdr2:#D4D4D8;
  --amber:#F5A623;--amber-bg:#FFFBF0;--gold:#D97706;
  --emerald:#059669;--emerald-bg:#ECFDF5;
  --sky:#0EA5E9;--sky-bg:#F0F9FF;
  --red:#DC2626;--red-bg:#FEF2F2;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --font:'Noto Sans SC',system-ui,sans-serif;
  --r:12px;
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}

.nav{position:sticky;top:0;z-index:100;background:rgba(250,250,247,.86);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--bdr)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:52px;gap:8px}
.nav-brand{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;margin-right:auto}
.nav-brand svg{width:24px;height:24px}
.nav-a{padding:5px 10px;border-radius:7px;text-decoration:none;color:var(--ink3);font-size:13px;font-weight:500}
.nav-a:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.nav-a.on{color:var(--amber);background:var(--amber-bg)}

.wrap{max-width:1200px;margin:0 auto;padding:32px 20px 80px}
.head{margin-bottom:18px}
.head h1{font-size:clamp(22px,3.4vw,32px);font-weight:900;letter-spacing:-.5px;line-height:1.2}
.head .sub{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.7;max-width:760px}
.head .sub b{color:var(--ink);font-weight:700}

/* stage tabs */
.stage-tabs{display:inline-flex;background:#fff;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin:18px 0}
.stage-tabs button{background:transparent;border:none;padding:9px 18px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;border-right:1px solid var(--bdr)}
.stage-tabs button:last-child{border-right:none}
.stage-tabs button:hover{background:var(--amber-bg)}
.stage-tabs button.on{background:var(--amber);color:#fff}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.legend .lg-base{background:#F4F4F5;border:1px solid var(--bdr)}
.legend .lg-r1{background:#A7F3D0;border:1px solid #6EE7B7}
.legend .lg-r2{background:#34D399}
.legend .lg-r3{background:#047857}
.legend .lg-err{background:var(--red)}

/* path grid */
#path-mount{margin-top:6px}
.subj-row{display:grid;grid-template-columns:90px 1fr;gap:12px;margin-bottom:10px;align-items:start}
.subj-name{font-size:13px;font-weight:800;color:var(--ink);padding:6px 0;display:flex;align-items:center;gap:6px;line-height:1.4;flex-direction:column;align-items:flex-start}
.subj-name .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.subj-name small{font-size:10px;color:var(--ink4);font-weight:500;font-family:var(--mono)}
.mastery-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:100px;font-size:10px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.mastery-chip.t0{background:#F4F4F5;color:#A1A1AA}
.mastery-chip.t1{background:#A7F3D0;color:#065F46}
.mastery-chip.t2{background:#34D399;color:#fff}
.mastery-chip.t3{background:#047857;color:#fff}
.mastery-chip.err{background:var(--red-bg,#FEF2F2);color:#991B1B;border:1px solid #FCA5A5}
.mastery-bar{display:inline-block;width:36px;height:4px;background:#E4E4E7;border-radius:2px;overflow:hidden}
.mastery-bar i{display:block;height:100%;background:currentColor;border-radius:2px}
.grade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.grade-card{background:#fff;border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--ink2);line-height:1.5}
.grade-card .gc-title{font-weight:700;color:var(--ink);font-size:12px;margin-bottom:4px}
.grade-card .gc-meta{font-size:10px;color:var(--ink4);font-family:var(--mono);margin-bottom:6px}
.gc-chs{display:flex;flex-wrap:wrap;gap:3px}
.gc-chs a{display:inline-block;width:18px;height:18px;border-radius:3px;background:#F4F4F5;border:1px solid var(--bdr);font-size:9px;line-height:16px;text-align:center;font-weight:600;color:var(--ink3);text-decoration:none;font-family:var(--mono);transition:.12s}
.gc-chs a:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
/* KA 4 态色阶：从浅到深表示掌握程度 */
.gc-chs a.lvl-1{background:#A7F3D0;color:#065F46;border-color:#6EE7B7}        /* 已读基础 */
.gc-chs a.lvl-2{background:#34D399;color:#fff;border-color:#10B981}             /* 已读 + 答过 */
.gc-chs a.lvl-3{background:#047857;color:#fff;border-color:#065F46}             /* 已掌握(错题全 ≥3 阶) */
.gc-chs a.err{background:var(--red);color:#fff;border-color:var(--red)}         /* 有活跃错题（红色优先） */
.empty{padding:40px 20px;text-align:center;color:var(--ink4);font-size:13px;background:#fff;border:1px dashed var(--bdr2);border-radius:10px}

@media(max-width:600px){
  .subj-row{grid-template-columns:1fr;gap:6px}
  .grade-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
</style>
</head>

<div class="wrap">

  <div class="head">
    <h1>学习路径 · 56 本教材按年级铺开</h1>
    <div class="sub">
      可汗学院 mastery map 中文化版本：把人教 / 统编初高中 <b id="hd-books">56</b> 本 <b id="hd-ch">284</b> 章按<b>学段 → 学科 → 年级 → 教材 → 章节</b>五级展开。每个小方块就是一章，<b>点开</b>跳到原文阅读器。已读 / 错题在本地数据驱动下自动点亮——不上传服务器。
    </div>
  </div>

  <div id="streak-mount"></div>

  <div id="upnext-banner-mount"></div>

  <div class="stage-tabs" id="stage-tabs"></div>

  <div class="legend">
    <span><i class="lg-base"></i>未碰</span>
    <span><i class="lg-r1"></i>读过</span>
    <span><i class="lg-r2"></i>读 + 练</span>
    <span><i class="lg-r3"></i>已掌握</span>
    <span><i class="lg-err"></i>有活跃错题</span>
  </div>

  <div id="path-mount"><div class="empty">manifest 加载中...</div></div>

</div>

<script src="/src/learning-store.js"></script>
<script src="/src/streak-bar.js"></script>
<script src="/src/today-recos.js"></script>
<script>
try { if (window.STREAK_BAR) STREAK_BAR.mount('#streak-mount'); } catch(e){ console.warn('streak-bar mount fail', e); }
try { if (window.TodayRecos && TodayRecos.renderUpNextBanner) TodayRecos.renderUpNextBanner('#upnext-banner-mount'); } catch(e){ console.warn('upnext banner', e); }
const SUBJ_COLOR = { '数学':'#2563EB','物理':'#7C3AED','化学':'#059669','生物学':'#16A34A','语文':'#DC2626','英语':'#0891B2','历史':'#92400E','地理':'#0D9488','思想政治':'#EA580C','道德与法治':'#6B21A8' };
const GRADE_ORDER = ['七年级','八年级','九年级','必修','必修1','必修2','必修3','必修4','必修第一册','第一册','第二册','选择性必修','选择性必修1','选择性必修2','选择性必修3'];

let MANIFEST = null;
// 默认按 yd:my_grade 推断学段(welcome 页填的); fallback 初中
function inferStage(){
  let g = '';
  try { g = localStorage.getItem('yd:my_grade') || ''; } catch(e){}
  if (g.indexOf('high') === 0) return '高中';
  if (g.indexOf('middle') === 0) return '初中';
  // primary_* 暂无 manifest, 给个能看到东西的兜底
  return '初中';
}
// URL ?stage=高中 优先(分享场景 override)
function urlStage(){
  try {
    const m = location.search.match(/[?&]stage=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  } catch(e){ return ''; }
}
let CUR_STAGE = urlStage() || inferStage();

function $(id){ return document.getElementById(id); }
function safeGet(k, dflt){ try { return JSON.parse(localStorage.getItem(k) || (dflt!=null?JSON.stringify(dflt):'null')); } catch(e){ return dflt; } }
function gradeOrder(g){
  const i = GRADE_ORDER.indexOf(g);
  return i < 0 ? 99 : i;
}

async function init(){
  try {
    const r = await fetch('/data/extracted/manifest.json', { cache: 'force-cache' });
    MANIFEST = await r.json();
  } catch(e){
    $('path-mount').innerHTML = '<div class="empty">manifest 加载失败 · ' + (e.message||e) + '</div>';
    return;
  }
  const books = MANIFEST.books || [];
  $('hd-books').textContent = books.length;
  $('hd-ch').textContent = books.reduce((a,b)=>a+((b.chapters||[]).length), 0);

  const stages = Array.from(new Set(books.map(b => b.stage))).filter(Boolean);
  const stageOrder = ['小学','初中','高中'];
  stages.sort((a,b) => (stageOrder.indexOf(a) - stageOrder.indexOf(b)));
  $('stage-tabs').innerHTML = stages.map(s => `<button data-stage="${s}" class="${s===CUR_STAGE?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('[data-stage]').forEach(b => {
    b.addEventListener('click', () => { CUR_STAGE = b.dataset.stage; renderStage(); });
  });
  renderStage();
}

function renderStage(){
  document.querySelectorAll('.stage-tabs button').forEach(b => b.classList.toggle('on', b.dataset.stage === CUR_STAGE));
  const books = (MANIFEST.books || []).filter(b => b.stage === CUR_STAGE);
  const bySubject = {};
  books.forEach(b => {
    const s = b.subject || '?';
    if (!bySubject[s]) bySubject[s] = [];
    bySubject[s].push(b);
  });
  // 学科排序
  const subjects = Object.keys(bySubject).sort();
  // 拉用户本地状态
  const readSet = new Set(safeGet('ydzx_textbook_read', []) || []);
  let errActive = {}, errMastered = {}; // 'path::ch' → count
  if (window.LearningStore && window.LearningStore.getErrors) {
    try {
      (window.LearningStore.getErrors() || []).forEach(e => {
        if (!e.textbookPath || e.textbookCh == null) return;
        const k = e.textbookPath + '::ch' + e.textbookCh;
        if ((e.reviewCount || 0) >= 3) errMastered[k] = (errMastered[k]||0) + 1;
        else errActive[k] = (errActive[k]||0) + 1;
      });
    } catch(_){}
  }
  // quiz outcome → 章节级 mastery 信号
  // v2 schema: { id: { r, d, book, ch, subj } } — book/ch 是 quiz.html 评分时新写入的字段
  // v1 fallback: { id: { r, d } } — 用 id 前缀 gen-{subject}- 提取学科作为粗粒度
  const outcomes = safeGet('ydzx_quiz_outcome_v1', {}) || {};
  const chPracticed = {}; // 'path::ch' → {good, bad}
  const quizPracticedSubjects = new Set();
  Object.keys(outcomes).forEach(id => {
    const o = outcomes[id] || {};
    if (o.book && o.ch != null){
      const k = o.book + '::ch' + o.ch;
      if (!chPracticed[k]) chPracticed[k] = { good: 0, bad: 0 };
      if (o.r === 'good') chPracticed[k].good++; else chPracticed[k].bad++;
    }
    // 学科粒度兜底（老数据 + 防 book 字段缺失）
    const m = (id || '').match(/^(?:gen|ai)-([a-z]+)-/);
    if (m) quizPracticedSubjects.add(m[1]);
    if (o.subj) quizPracticedSubjects.add(o.subj);
  });
  const SUBJ_ZH_TO_KEY = {'数学':'math','物理':'physics','化学':'chemistry','生物学':'biology','语文':'chinese','英语':'english','历史':'history','地理':'geography','思想政治':'politics'};

  // 抽出每章 mastery class 计算逻辑，让预扫与渲染共用
  function clsForCh(b, c){
    const sig = b.path + '::ch' + c.ch;
    const isRead = readSet.has(sig);
    const eA = errActive[sig] || 0;
    const eM = errMastered[sig] || 0;
    const chPx = chPracticed[sig];
    const chPracticedHere = !!chPx && (chPx.good + chPx.bad) > 0;
    const chMasteredHere = !!chPx && chPx.good >= 2 && chPx.good >= chPx.bad * 2;
    const subjKey = SUBJ_ZH_TO_KEY[b.subject] || '';
    const subjPracticed = quizPracticedSubjects.has(subjKey);
    if (eA > 0) return 'err';
    if (isRead && (eM > 0 || chMasteredHere)) return 'lvl-3';
    if (isRead && (chPracticedHere || subjPracticed)) return 'lvl-2';
    if (isRead) return 'lvl-1';
    return '';
  }

  let html = '';
  subjects.forEach(subj => {
    const bs = bySubject[subj].slice().sort((a,b) => gradeOrder(a.grade) - gradeOrder(b.grade));
    const dotColor = SUBJ_COLOR[subj] || '#71717A';
    const totalCh = bs.reduce((a,b) => a + ((b.chapters||[]).length), 0);
    // 预扫：算各级章节数，得出 mastery 百分比
    const stat = { read:0, lvl1:0, lvl2:0, lvl3:0, err:0 };
    bs.forEach(b => (b.chapters||[]).forEach(c => {
      if (readSet.has(b.path+'::ch'+c.ch)) stat.read++;
      const cls = clsForCh(b, c);
      if (cls === 'lvl-1') stat.lvl1++;
      else if (cls === 'lvl-2') stat.lvl2++;
      else if (cls === 'lvl-3') stat.lvl3++;
      else if (cls === 'err') stat.err++;
    }));
    const masteredPct = totalCh ? Math.round(stat.lvl3 / totalCh * 100) : 0;
    const masteredTier = masteredPct >= 70 ? 't3' : masteredPct >= 40 ? 't2' : masteredPct >= 10 ? 't1' : 't0';
    html += '<div class="subj-row">';
    html += `<div class="subj-name"><span><span class="dot" style="background:${dotColor}"></span>${subj}</span>`;
    html += `<small>${bs.length} 本 · ${totalCh} 章 · 已读 ${stat.read}</small>`;
    html += `<span class="mastery-chip ${masteredTier}" title="lvl-3 章节 ${stat.lvl3} / 总 ${totalCh}"><span class="mastery-bar"><i style="width:${masteredPct}%"></i></span>${masteredPct}% 掌握</span>`;
    if (stat.err > 0){
      html += `<span class="mastery-chip err" title="待复习的活跃错题章节数">${stat.err} 章有错题</span>`;
    }
    html += '</div>';
    html += '<div class="grade-grid">';
    bs.forEach(b => {
      const gradeLabel = (b.grade || '') + (b.volume ? ' · ' + b.volume : '');
      const chs = (b.chapters || []).sort((x,y) => x.ch - y.ch);
      let chsHtml = '';
      chs.forEach(c => {
        const sig = b.path + '::ch' + c.ch;
        const isRead = readSet.has(sig);
        const eA = errActive[sig] || 0;
        const eM = errMastered[sig] || 0;
        const chPx = chPracticed[sig];
        const cls = clsForCh(b, c);  // 共用预扫的同一逻辑
        const tipParts = [`${b.path} · 第 ${c.ch} 章`, c.title || ''];
        if (eA > 0) tipParts.push(`活跃错题 ${eA}`);
        if (eM > 0) tipParts.push(`已掌握错题 ${eM}`);
        if (chPx && (chPx.good + chPx.bad) > 0) tipParts.push(`本章答过 ${chPx.good + chPx.bad} 题（对 ${chPx.good}）`);
        if (isRead && !eA && !eM && !chPx) tipParts.push('已读');
        chsHtml += `<a href="/tools/textbook-browser?book=${encodeURIComponent(b.path)}&ch=${c.ch}" class="${cls}" title="${tipParts.filter(Boolean).join(' · ').replace(/"/g,'&quot;')}">${c.ch}</a>`;
      });
      html += '<div class="grade-card">';
      html += `<div class="gc-title">${gradeLabel}</div>`;
      html += `<div class="gc-meta">${chs.length} 章 · ${b.page_count || '?'} 页</div>`;
      html += `<div class="gc-chs">${chsHtml}</div>`;
      html += '</div>';
    });
    html += '</div></div>';
  });
  $('path-mount').innerHTML = html || '<div class="empty">本学段暂无教材</div>';
}

window.addEventListener('DOMContentLoaded', init);
</script>

</body>

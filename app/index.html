<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ec" />
    <meta name="web-app-asset-base" content="/apps/web/assets/brand" />
    <title>原点智学 Web 体验</title>
    <link rel="stylesheet" href="/apps/web/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail" aria-label="主导航">
        <a class="brand-lockup" href="#home" aria-label="原点智学首页">
          <img class="brand-mark" src="/apps/web/assets/reference/brand-house.png" alt="" />
          <span>原点智学</span>
        </a>

        <section class="buddy-card">
          <img class="mascot-img mascot-side" src="/apps/web/assets/reference/hero-mascot.png" alt="咕点" />
          <strong>咕点</strong>
          <span>AI 学习伙伴</span>
        </section>

        <nav class="nav-list" id="sideNav"></nav>

        <a class="guide-button" href="#home">
          <span>开始</span>
          官网体验
        </a>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <label class="search-box">
            <span>搜</span>
            <input aria-label="搜索" placeholder="搜索上传、报告、AI 私教、短回访或家长证据" />
          </label>
          <div class="top-actions">
            <button class="student-pill" type="button" data-action="student-menu">
              <span class="avatar boy">明</span>
              小明（四年级）
            </button>
            <button class="bell" type="button" data-action="notifications" aria-label="通知"><span></span><em>3</em></button>
            <button class="family-pill" type="button" data-action="family-menu">
              <img class="family-face" src="/apps/web/assets/reference/entry-parent.png" alt="" />
              <span><b>小明家</b><small>家庭视角</small></span>
            </button>
          </div>
        </header>

        <div class="page-layout">
          <section class="content-panel" id="appContent" aria-live="polite"></section>
          <aside class="right-rail" id="rightRail"></aside>
        </div>
      </main>
    </div>

    <nav class="mobile-tabs" id="mobileNav" aria-label="移动端导航"></nav>
    <script type="module" src="/apps/web/src/app.js"></script>
  </body>
</html>

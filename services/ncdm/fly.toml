# Fly.io 部署配置
# 使用：fly launch --no-deploy → fly secrets set DATABASE_URL=... → fly deploy

app = "yuandian-ncdm"
primary_region = "hkg"  # 香港，离大陆用户近且不墙

[build]
  dockerfile = "Dockerfile"

[env]
  EPOCHS = "50"
  OUT_DIR = "/data/parquet"
  PORT = "8000"
  CORS_ORIGINS = "https://www.0dianxue.com,https://0dianxue.com,http://localhost:8080"

[mounts]
  source = "ncdm_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # NCDM cron 需要常驻
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048  # NCDM 训 100k logs 需要 ~1.5GB peak

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原点智学 - 开启你的高效之夜</title>
<meta name="description" content="原点智学欢迎页，帮助学生从今晚最容易的一步开始，规划任务、拆解作业并进入学习。">
<meta name="theme-color" content="#F8F7F2">
<meta name="ydzx-page" content="welcome">
<link rel="icon" href="/assets/miniapp-logo-kid.png">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:24px;
  color:#1a1a1a;
  background:#e5e5e5;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0}
.phone{
  position:relative;
  width:375px;
  height:812px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:#f8f7f2;
  border-radius:40px;
  box-shadow:0 28px 70px rgba(22,27,24,.24);
}
.content{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 32px 0;
}
.mascot-wrap{
  position:relative;
  width:192px;
  height:192px;
  margin-bottom:40px;
  animation:float 3s ease-in-out infinite;
}
.mascot{width:100%;height:100%;filter:drop-shadow(0 18px 18px rgba(27,43,36,.16))}
.copy{
  width:100%;
  margin-bottom:40px;
  text-align:center;
  animation:fadeIn .8s ease-out forwards;
}
.copy h1{
  margin:0 0 12px;
  color:#143a30;
  font-size:30px;
  font-weight:800;
  line-height:1.22;
  letter-spacing:0;
}
.copy p{
  max-width:300px;
  margin:0 auto;
  color:#666;
  font-size:15px;
  font-weight:500;
  line-height:1.72;
}
.steps{
  width:100%;
  display:grid;
  gap:24px;
  margin-bottom:48px;
  animation:fadeIn .8s ease-out .3s forwards;
  opacity:0;
}
.step{
  display:flex;
  align-items:flex-start;
  gap:16px;
}
.step-icon{
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#143a30;
  background:#e8f0eb;
  border-radius:16px;
}
.step-icon svg{width:21px;height:21px;stroke-width:2.6}
.step h3{
  margin:0 0 3px;
  color:#143a30;
  font-size:15px;
  font-weight:800;
  line-height:1.35;
}
.step p{
  margin:0;
  color:#666;
  font-size:14px;
  font-weight:500;
  line-height:1.48;
}
.cta-area{
  width:100%;
  padding:0 16px;
  animation:fadeIn .8s ease-out .5s forwards;
  opacity:0;
}
.primary-btn{
  width:100%;
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#fff;
  background:#143a30;
  border-radius:999px;
  box-shadow:0 16px 30px rgba(20,58,48,.2);
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.primary-btn:hover{background:#0f3028;box-shadow:0 18px 34px rgba(20,58,48,.24)}
.primary-btn:active{transform:scale(.95)}
.primary-btn svg{width:18px;height:18px;stroke-width:2.8}
.agreement{
  margin:14px 0 0;
  text-align:center;
  color:#666;
  font-size:12px;
  font-weight:500;
}
.agreement a{text-decoration:underline;text-underline-offset:3px}
.home-indicator{
  position:absolute;
  left:50%;
  bottom:6px;
  z-index:4;
  width:134px;
  height:5px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.10);
  border-radius:999px;
}
.blob-a,.blob-b{
  position:absolute;
  z-index:0;
  background:#e8f0eb;
  border-radius:50%;
  pointer-events:none;
}
.blob-a{
  top:-40px;
  left:-40px;
  width:160px;
  height:160px;
  opacity:.3;
}
.blob-b{
  right:-40px;
  bottom:-80px;
  width:240px;
  height:240px;
  opacity:.2;
}
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@media (max-width:430px){
  body{padding:0;background:#f8f7f2}
  .phone{width:100vw;height:100vh;min-height:760px;border-radius:0;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main class="phone" aria-label="原点智学欢迎页">
  <div class="blob-a"></div>
  <div class="blob-b"></div>

  <section class="content">
    <div class="mascot-wrap" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="mascot">
        <ellipse cx="50" cy="92" rx="35" ry="5" fill="#E8E6E1"></ellipse>
        <path d="M10 50C10 27.9086 27.9086 10 50 10C72.0914 10 90 27.9086 90 50C90 72.0914 72.0914 90 50 90C27.9086 90 10 72.0914 10 50Z" fill="#143A30"></path>
        <path d="M22 55C22 39.536 34.536 27 50 27C65.464 27 78 39.536 78 55C78 70.464 65.464 83 50 83C34.536 83 22 70.464 22 55Z" fill="#FCE9C5"></path>
        <circle cx="33" cy="58" r="5" fill="#F4A4A4" opacity="0.6"></circle>
        <circle cx="67" cy="58" r="5" fill="#F4A4A4" opacity="0.6"></circle>
        <circle cx="38" cy="48" r="3" fill="#143A30"></circle>
        <circle cx="62" cy="48" r="3" fill="#143A30"></circle>
        <path d="M42 62C42 62 45 67 50 67C55 67 58 62 58 62" stroke="#143A30" stroke-width="2.5" stroke-linecap="round"></path>
        <path d="M50 10C50 10 44 -2 56 -5C56 -5 62 3 50 10Z" fill="#5D8F5C"></path>
        <path d="M50 10C50 10 60 2 72 6C72 6 68 14 50 10Z" fill="#75A874"></path>
        <path d="M6 20L9 14L15 11L9 8L6 2L3 8L-3 11L3 14L6 20Z" fill="#F9D479"></path>
        <path d="M88 30L90 26L94 24L90 22L88 18L86 22L82 24L86 26L88 30Z" fill="#F9D479"></path>
      </svg>
    </div>

    <div class="copy">
      <h1>欢迎来到原点智学</h1>
      <p>我是你的学习小助手，陪你把每个漫漫长夜变成高效的学习时光。</p>
    </div>

    <div class="steps" aria-label="使用步骤">
      <div class="step">
        <div class="step-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </div>
        <div>
          <h3>输入任务或困惑</h3>
          <p>拍照或输入你今晚要做的所有事情。</p>
        </div>
      </div>

      <div class="step">
        <div class="step-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4V2"></path><path d="M15 16v-2"></path><path d="M8 9h2"></path><path d="M20 9h2"></path><path d="M17.8 11.8 19 13"></path><path d="M15 9h.01"></path><path d="M17.8 6.2 19 5"></path><path d="m3 21 9-9"></path><path d="M12.2 6.2 11 5"></path></svg>
        </div>
        <div>
          <h3>智能拆解与规划</h3>
          <p>我会帮你理清优先级，并拆解成简单的小步。</p>
        </div>
      </div>

      <div class="step">
        <div class="step-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><path d="m9 11 3 3L22 4"></path></svg>
        </div>
        <div>
          <h3>轻松开启第一步</h3>
          <p>从最容易的地方开始，告别拖延，逐渐上手。</p>
        </div>
      </div>
    </div>

    <div class="cta-area">
      <a class="primary-btn" href="/diagnose" aria-label="立即开启学习之夜，进入诊断">
        立即开启学习之夜
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </a>
      <p class="agreement">点击即表示同意<a href="/terms">《用户服务协议》</a></p>
    </div>
  </section>

  <div class="home-indicator" aria-hidden="true"></div>
</main>
<script src="/src/track.js"></script>
<script>
  if (window.YDZX_TRACK) {
    YDZX_TRACK.event('welcome_view', { source: 'variant_home_ui' });
  }
</script>
</body>
</html>

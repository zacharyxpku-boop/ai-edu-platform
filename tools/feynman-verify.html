        <style>

            --border-hover: #D1CCC3;
            
            --amber: #0F4F3D;
            --amber-light: #E8EFE9;
            --amber-glow: rgba(15, 79, 61,0.12);
            
            --success: #059669;
            --success-bg: #ECFDF5;
            --warning: #F59E0B;
            --warning-bg: #FEF3C7;
            --error: #DC2626;
            --error-bg: #FEE2E2;
            
            --font-body: 'Noto Sans SC', system-ui, sans-serif;
            --font-heading: 'Noto Sans SC', system-ui, sans-serif;
            
            --r-sm: 6px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 20px;
            
            --sp-xs: 4px;
            --sp-sm: 8px;
            --sp-md: 16px;
            --sp-lg: 24px;
            --sp-xl: 32px;
            --sp-2xl: 48px;
            --sp-section: 64px;
            
            --fs-caption: 12px;
            --fs-small: 13px;
            --fs-body: 15px;
            --fs-hero: clamp(28px, 4vw, 42px);
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            
            --grad-cta: linear-gradient(135deg, #0F4F3D 0%, #C2410C 100%);
            --grad-hero: linear-gradient(180deg, var(--bg) 0%, var(--amber-light) 100%);
            
            /* 兼容旧变量 */
            --c-warm-white: var(--text);
            --c-warm-gray: var(--text-3);
            --c-warm-dim: var(--text-4);
            --c-ink-border: var(--border);
            --c-origin: var(--amber);
            --c-origin-glow: var(--amber-glow);
            --c-success: var(--success);
            --c-warning: var(--warning);
            --c-error: var(--error);
        }
        
        html { scroll-behavior: smooth }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);

            font-weight: 500;

        .nav-cta {

        .chat-history { background: #FFFFFF; border: 1px solid var(--c-ink-border); border-radius: var(--r-lg); padding: var(--sp-lg); max-height: 600px; overflow-y: auto; margin-bottom: var(--sp-lg); }

        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--grad-cta); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.2rem; }

        .chat-bubble { max-width: 75%; background: var(--bg); border: 1px solid var(--c-ink-border); border-radius: var(--r-lg); padding: var(--sp-md); line-height: 1.7; }

        .btn-primary:hover { transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { padding: 12px 28px; background: var(--bg); color: var(--c-warm-white); border: 1px solid var(--c-ink-border); border-radius: var(--r-md); font-size: var(--fs-body); cursor: pointer; font-family: var(--font-body); transition: all 0.2s; }
        .btn-secondary:hover { border-color: var(--c-origin); }

        .badge-success { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FFFFFF; border: 2px solid var(--c-success); border-radius: var(--r-lg); padding: var(--sp-2xl); text-align: center; z-index: 1000; max-width: 500px; animation: bounceIn 0.6s; }
        .badge-success.visible { display: block; }
        .badge-icon { font-size: 5rem; margin-bottom: var(--sp-md); animation: rotate 2s ease-in-out; }

        .badge-subtitle { color: var(--c-warm-gray); margin-bottom: var(--sp-lg); }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }

    <script>
        function shareFeynman() {
            var topic = (document.getElementById('current-topic')||{}).textContent || '一个知识点';
            var turns = document.querySelectorAll('#chat-history .chat-msg').length || 0;
            YdzxShare.open({
                source: 'feynman-verify',
                title: '娃用费曼法把「'+topic+'」讲通了',
                subtitle: '原点智学 · 教给 AI 学生听 · 真懂才能过',
                metrics: [
                    { label:'对话轮次', value: String(turns) },
                    { label:'认证', value: '通过' },
                    { label:'方法', value: '费曼' }
                ],
                quote: '能讲明白才是真懂，讲不明白就是没懂透'
            });
        }
        let conversationHistory = [];
        let currentTopic = '';
        let currentLevel = '';
        let currentSubject = '';
        let questionCount = 0;
        let examStandards = null;
        let textbookIndex = null;
        let feynmanLib = null; // { four_steps, prompt_library, rubric }

        async function loadFeynmanLib() {
            if (feynmanLib) return feynmanLib;
            try {
                const r = await fetch('../src/curriculum/feynman-prompts.json');
                feynmanLib = await r.json();
            } catch (e) { console.warn('feynman 库加载失败', e); feynmanLib = null; }
            return feynmanLib;
        }

        // 按 subject + topic 关键词匹配最近的 library 条目
        function matchLibraryEntry(subject, topic) {
            if (!feynmanLib || !feynmanLib.prompt_library) return null;
            const subjectZh = { math: '数学', physics: '物理', chemistry: '化学', biology: '生物', history: '历史', geography: '地理', politics: '政治' }[subject] || '';
            const candidates = feynmanLib.prompt_library.filter(p => p.subject === subjectZh);
            if (!candidates.length) return null;
            // 取 topic 和候选 topic 的最长公共子串得分
            const lower = topic.toLowerCase();
            let best = null, bestScore = 0;
            candidates.forEach(c => {
                const ct = (c.topic || '').toLowerCase();
                let score = 0;
                for (let i = 0; i < ct.length; i++) {
                    for (let j = i + 1; j <= ct.length; j++) {
                        const sub = ct.slice(i, j);
                        if (sub.length >= 2 && lower.indexOf(sub) !== -1 && sub.length > score) score = sub.length;
                    }
                }
                if (score > bestScore) { bestScore = score; best = c; }
            });
            return bestScore >= 2 ? best : null;
        }

        // 根据对话轮次选四步中的哪一步
        function pickFeynmanStep(turn) {
            // 1-2 轮：讲给我听；3-4 轮：挑漏洞；5-6 轮：用类比；7+：再讲一遍
            if (turn <= 2) return 0;
            if (turn <= 4) return 1;
            if (turn <= 6) return 2;
            return 3;
        }

        var gradesByStage = {'小学': ['三年级', '四年级', '五年级', '六年级'], '初中': ['七年级', '八年级', '九年级'], '高中': ['高一', '高二', '高三']};
        var subjectNameMap = {'数学': '数学', '语文': '语文', '英语': '英语', '物理': '物理', '化学': '化学', '生物': '生物学', '历史': '历史', '地理': '地理', '政治': '道德与法治', '思想政治': '思想政治', '道德与法治': '道德与法治', '科学': '科学', '美术': '美术', '音乐': '音乐'};
        var subjectValueMap = {'数学': 'math', '物理': 'physics', '化学': 'chemistry', '生物': 'biology', '政治': 'politics', '历史': 'history', '地理': 'geography'};

        async function loadTextbookIndex() { if (textbookIndex) return; try { var r = await fetch('../src/curriculum/textbook-index.json'); textbookIndex = await r.json(); } catch (e) { console.error(e); } }

        function updateGradeOptions() { var s = document.getElementById('school-stage').value, g = document.getElementById('grade'); g.innerHTML = '<option value="">请选择年级</option>'; if (s && gradesByStage[s]) { gradesByStage[s].forEach(function(v) { var o = document.createElement('option'); o.value = v; o.textContent = v; g.appendChild(o); }); if (s === '初中') g.value = '七年级'; } updateSubjectOptions(); }

        function updateSubjectOptions() { var s = document.getElementById('school-stage').value, g = document.getElementById('grade').value, sub = document.getElementById('subject-select'); sub.innerHTML = '<option value="">请选择科目</option>'; if (!s || !g) return; var subjects = s === '初中' ? ['语文', '数学', '英语', '物理', '化学', '生物', '历史', '地理', '政治'] : s === '小学' ? ['语文', '数学', '英语', '道德与法治', '科学', '美术', '音乐'] : ['语文', '数学', '英语', '物理', '化学', '生物', '历史', '地理', '思想政治']; subjects.forEach(function(v) { var value = subjectValueMap[v] || ''; if (value) { var o = document.createElement('option'); o.value = value; o.textContent = v; sub.appendChild(o); } }); if (subjects.includes('数学')) sub.value = 'math'; updateVersionOptions(); }

        async function updateVersionOptions() { var s = document.getElementById('school-stage').value, sub = document.getElementById('subject-select').value, ver = document.getElementById('textbook-version'); ver.innerHTML = '<option value="">请选择版本</option>'; if (!s || !sub) return; await loadTextbookIndex(); if (!textbookIndex || !textbookIndex[s]) return; var subjectDisplayNames = {'math': '数学', 'physics': '物理', 'chemistry': '化学', 'biology': '生物学', 'politics': '道德与法治', 'history': '历史', 'geography': '地理'}; var subName = subjectDisplayNames[sub], subData = textbookIndex[s][subName]; if (!subData) return; Object.keys(subData).forEach(function(v) { var o = document.createElement('option'); o.value = v; o.textContent = v; ver.appendChild(o); }); if (Object.keys(subData).length > 0) ver.value = Object.keys(subData)[0]; }

        function startSession() {
            const topic = document.getElementById('topic-input').value.trim();
            const level = document.getElementById('level-select').value;
            const subject = document.getElementById('subject-select').value;

            if (!topic) {
                YdzxToast.show('请输入知识点名称', 'warn');
                return;
            }

            currentTopic = topic;
            currentLevel = level;
            currentSubject = subject;
            conversationHistory = [];
            questionCount = 0;

            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('chat-section').classList.add('visible');
            document.getElementById('current-topic').textContent = topic;

            // AI初始化问候
            const greeting = getGreeting(level);
            addMessage('ai', greeting);
        }

        function getGreeting(level) {
            const greetings = {
                beginner: `你好！我是个完全不懂${currentTopic}的小白，听说你要教我？能从最基础的开始讲吗？比如它到底是个啥？`,
                intermediate: `嗨！我听说过${currentTopic}这个词，但不太明白它怎么用。你能给我讲讲吗？`,
                advanced: `我想深入理解${currentTopic}。你能从原理层面给我讲透吗？我会追问细节的。`
            };
            return greetings[level] || greetings.intermediate;
        }

        function addMessage(role, content) {
            const historyDiv = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${role}`;

            const avatar = role === 'user' ? '👨‍🏫' : '🤔';
            messageDiv.innerHTML = `
                <div class="chat-avatar">${avatar}</div>
                <div class="chat-bubble">${content.replace(/\n/g, '<br>')}</div>
            `;

            historyDiv.appendChild(messageDiv);
            historyDiv.scrollTop = historyDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();

            if (!message) return;

            addMessage('user', message);
            input.value = '';

            conversationHistory.push({
                role: 'user',
                content: message
            });

            generateAIResponse();
        }

        async function generateAIResponse() {
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'AI思考中...';

            // Fetch exam standards if not already loaded
            if (!examStandards) {
                try {
                    const response = await fetch('../src/curriculum/exam-standards.json');
                    examStandards = await response.json();
                } catch (err) {
                    console.error('Failed to load exam standards:', err);
                }
            }
            await loadFeynmanLib();

            // 教材版本：装成该年级同学
            const _fv_stage = document.getElementById('school-stage') ? document.getElementById('school-stage').value : '';
            const _fv_grade = document.getElementById('grade') ? document.getElementById('grade').value : '';
            const _fv_ver = document.getElementById('textbook-version') ? document.getElementById('textbook-version').value : '';
            const _fv_tag = _fv_ver ? `${_fv_stage}${_fv_grade}（${_fv_ver}）` : `${_fv_stage}${_fv_grade}`;

            // 四步法：根据对话轮次切换追问风格
            const turn = questionCount + 1;
            const stepIdx = pickFeynmanStep(turn);
            const step = feynmanLib && feynmanLib.four_steps ? feynmanLib.four_steps[stepIdx] : null;
            const libEntry = matchLibraryEntry(currentSubject, currentTopic);

            let systemPrompt;
            if (step) {
                systemPrompt = `${step.ai_persona_prompt}\n\n当前阶段：第 ${step.step} 步「${step.name}」· 目标：${step.goal}\n你在和一位${_fv_tag || '该年级'}的小老师对话，讲解主题是"${currentTopic}"。用${_fv_stage || '该年级'}学生的语气和词汇，每次只问 1 个问题。`;
            } else {
                systemPrompt = `你是一个${_fv_tag || '该年级'}、完全不懂"${currentTopic}"的好奇同学。每次只问 1-2 个问题，用"等等"、"可是"、"那"开头。`;
            }

            // 注入这个主题的常见盲区 + 候选追问 + 类比参考（如命中库）
            if (libEntry) {
                systemPrompt += `\n\n**这个主题常见的理解盲区（请重点追问，但用你自己的话问）：**\n`
                    + (libEntry.common_gaps || []).map(g => '- ' + g).join('\n');
                systemPrompt += `\n\n**可参考的追问（改编，不要原封不动照抄）：**\n`
                    + (libEntry.probe_questions || []).map(q => '- ' + q).join('\n');
                if (stepIdx === 2 && libEntry.analogies && libEntry.analogies.length) {
                    systemPrompt += `\n\n**若小老师类比卡住，可提示这类比方：** ${libEntry.analogies.join(' / ')}`;
                }
            }

            // 旧的通用 common_mistakes 作兜底
            if (!libEntry && examStandards && examStandards.common_mistakes) {
                const subjectKey = currentSubject;
                if (examStandards.common_mistakes[subjectKey]) {
                    systemPrompt += `\n\n该科目常见错误认知（从中挑贴近本题的追问）：\n${JSON.stringify(examStandards.common_mistakes[subjectKey], null, 2)}`;
                }
            }

            systemPrompt += `\n\n当前对话轮次：${turn}

通过条件：
- 若小老师已经能用最简单的话讲清核心 + 补上关键盲区 + 给出贴切类比，输出「[PASS]通过验证」开头，并附评级（铜/银/金），以及一句 next_gap 指出下次还可深挖的一点。
- 否则继续追问，每轮只问 1 个问题。`;

            const messages = conversationHistory.map(msg => ({
                role: msg.role === 'user' ? 'user' : 'assistant',
                content: msg.content
            }));

            window.YdzxAI.call({
                messages: messages,
                systemPrompt: systemPrompt,
                temperature: 0.8,
                maxTokens: 300,
                onDone: function(response) {
                    conversationHistory.push({
                        role: 'assistant',
                        content: response
                    });

                    questionCount++;

                    // 检查是否通过
                    if (response.includes('[PASS]')) {
                        const cleanResponse = response.replace('[PASS]', '').trim();
                        addMessage('ai', cleanResponse);
                        setTimeout(() => showBadge(), 1000);
                        saveLearningRecord(true);
                        if (window.GAME) {
                            let tier = 'bronze', xp = 30, bid = 'feynman_bronze';
                            if (/金级|gold|金嗓子/i.test(cleanResponse)) { tier = 'gold'; xp = 100; bid = 'feynman_gold'; }
                            else if (/银级|silver|银讲师/i.test(cleanResponse)) { tier = 'silver'; xp = 60; bid = 'feynman_silver'; }
                            var _fv_subjZh = ({ math:'数学', physics:'物理', chemistry:'化学', biology:'生物', history:'历史', geography:'地理', politics:'政治' })[currentSubject] || '';
                            window.GAME.addXP(xp, '费曼验证 · ' + (_fv_subjZh ? _fv_subjZh + ' · ' : '') + tier + ' · ' + currentTopic);
                            window.GAME.unlockBadge(bid);
                            if (window.YdzxHUD) window.YdzxHUD.refresh();
                        }
                    } else {
                        addMessage('ai', response);
                    }

                    sendBtn.disabled = false;
                    sendBtn.textContent = '发送';
                },
                onError: function(err) {
                    addMessage('ai', '抱歉，我遇到了点问题：' + err);
                    sendBtn.disabled = false;
                    sendBtn.textContent = '发送';
                }
            });
        }

        function showBadge() {
            document.getElementById('badge-success').classList.add('visible');
        }

        function closeBadge() {
            document.getElementById('badge-success').classList.remove('visible');
        }

        function resetSession() {
            if (confirm('确定要重新开始吗？当前对话将会丢失。')) {
                saveLearningRecord(false);
                document.getElementById('setup-section').style.display = 'block';
                document.getElementById('chat-section').classList.remove('visible');
                document.getElementById('chat-history').innerHTML = '';
                document.getElementById('topic-input').value = '';
            }
        }

        function saveLearningRecord(passed) {
            const record = {
                type: 'feynman-verify',
                topic: currentTopic,
                level: currentLevel,
                questionCount: questionCount,
                passed: passed,
                conversation: conversationHistory,
                timestamp: Date.now()
            };

            if (window.LearningStore && window.LearningStore.savePractice) {
                window.LearningStore.savePractice(record);
            }
        }

        // 回车发送
        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
    <script>
    window.addEventListener('DOMContentLoaded', () => {
        initToolsNav('feynman-verify.html');
        loadTextbookIndex();
        document.getElementById('school-stage').addEventListener('change', updateGradeOptions);
        document.getElementById('grade').addEventListener('change', updateSubjectOptions);
        document.getElementById('subject-select').addEventListener('change', updateVersionOptions);
        updateGradeOptions();

        // 数据串联：从localStorage读取预填知识点
        const prefillTopic = localStorage.getItem('yuandian_prefill_topic');
        if (prefillTopic) {
            document.getElementById('topic-input').value = prefillTopic;
            localStorage.removeItem('yuandian_prefill_topic');
        }
    });
    </script>

        <style>
        /* === 亮色主题基础变量 === */
        :root {
            --bg: #FAF7F0;
            --bg-card: #FFFFFF;
            --text: #1A1A1A;
            --text-2: #374151;
            --text-3: #6B7280;
            --text-4: #9CA3AF;
            --border: #E8E5DE;
            --border-hover: #D1CCC3;
            
            --amber: #0F4F3D;
            --amber-light: #E8EFE9;
            --amber-glow: rgba(15, 79, 61,0.12);
            
            --success: #059669;
            --success-bg: #ECFDF5;
            --warning: #F59E0B;
            --warning-bg: #FEF3C7;
            --error: #DC2626;
            --error-bg: #FEE2E2;
            
            --font-body: 'Noto Sans SC', system-ui, sans-serif;
            --font-heading: 'Noto Sans SC', system-ui, sans-serif;
            
            --r-sm: 6px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 20px;
            
            --sp-xs: 4px;
            --sp-sm: 8px;
            --sp-md: 16px;
            --sp-lg: 24px;
            --sp-xl: 32px;
            --sp-2xl: 48px;
            --sp-section: 64px;
            
            --fs-caption: 12px;
            --fs-small: 13px;
            --fs-body: 15px;
            --fs-hero: clamp(28px, 4vw, 42px);
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            
            --grad-cta: linear-gradient(135deg, #0F4F3D 0%, #C2410C 100%);
            --grad-hero: linear-gradient(180deg, var(--bg) 0%, var(--amber-light) 100%);
            
            /* 兼容旧变量 */
            --c-warm-white: var(--text);
            --c-warm-gray: var(--text-3);
            --c-warm-dim: var(--text-4);
            --c-ink-border: var(--border);
            --c-origin: var(--amber);
            --c-origin-glow: var(--amber-glow);
            --c-success: var(--success);
            --c-warning: var(--warning);
            --c-error: var(--error);
        }
        
        html { scroll-behavior: smooth }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        /* === 导航栏重置 === */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250,250,247,0.88);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }
        .navbar::before { display: none }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 15px;
        }
        .brand-icon {
            font-size: 24px;
            color: var(--amber);
        }
        .nav-links { display: flex; gap: 2px }
        .nav-links a {
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-3);
            font-size: 13px;
            font-weight: 500;
            transition: all .15s;
        }
        .nav-links a:hover { color: var(--text); background: var(--amber-light) }
        .nav-cta {
            background: var(--text);
            color: #fff;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-body);
            transition: opacity .15s;
        }
        .nav-cta:hover { opacity: .85 }
    
        .page-hero { padding: 120px 24px 40px; text-align: center; background: var(--grad-hero); }
        .page-hero h1 { font-family: var(--font-heading); font-size: var(--fs-hero); margin: var(--sp-lg) 0 var(--sp-sm); }
        .page-hero-icon { font-size: 3rem; }

        .tool-container { max-width: 900px; margin: var(--sp-section) auto; padding: 0 var(--sp-lg); }

        .input-card { background: #FFFFFF; border: 1px solid var(--c-ink-border); border-radius: var(--r-lg); padding: var(--sp-xl); margin-bottom: var(--sp-lg); }
        .input-card h2 { font-family: var(--font-heading); margin-bottom: var(--sp-lg); color: var(--c-warm-white); }

        .form-field { display: flex; flex-direction: column; margin-bottom: var(--sp-md); }
        .form-field label { color: var(--c-warm-gray); font-size: var(--fs-small); margin-bottom: var(--sp-xs); }
        .form-field input, .form-field select, .form-field textarea {
            width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--c-ink-border);
            border-radius: var(--r-md); color: var(--c-warm-white); font-size: var(--fs-body); font-family: var(--font-body);
        }
        .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--c-origin); outline: none; }

        .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-md); }

        .btn-primary { padding: 14px 32px; background: var(--grad-cta); color: #fff; border: none; border-radius: var(--r-md); font-size: var(--fs-body); font-weight: 700; cursor: pointer; font-family: var(--font-body); transition: transform 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-secondary { padding: 12px 24px; background: var(--bg); color: var(--c-warm-white); border: 1px solid var(--c-ink-border); border-radius: var(--r-md); font-size: var(--fs-body); cursor: pointer; font-family: var(--font-body); }

        .result-section { display: none; }
        .result-section.visible { display: block; }

        .practice-question { background: #FFFFFF; border: 1px solid var(--c-ink-border); border-radius: var(--r-lg); padding: var(--sp-lg); margin-bottom: var(--sp-md); }
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-md); }
        .question-num { font-weight: 700; color: var(--c-warm-white); font-size: var(--fs-h3); }
        .question-difficulty { font-size: var(--fs-small); padding: 4px 12px; border-radius: var(--r-pill); }
        .difficulty-easy { background: rgba(45,159,111,0.2); color: var(--c-success); }
        .difficulty-medium { background: rgba(212,168,67,0.2); color: var(--c-warning); }
        .difficulty-hard { background: rgba(201,64,64,0.2); color: var(--c-error); }

        .question-content { color: var(--c-warm-white); line-height: 1.8; margin-bottom: var(--sp-md); }
        .question-actions { display: flex; gap: var(--sp-sm); flex-wrap: wrap; }

        .answer-section { background: var(--amber-light); border: 1px solid var(--c-ink-border); border-radius: var(--r-md); padding: var(--sp-md); margin-top: var(--sp-md); display: none; }
        .answer-section.visible { display: block; }
        .answer-section strong { color: var(--c-success); }

        .btn-small { padding: 8px 16px; border-radius: var(--r-md); font-size: var(--fs-small); cursor: pointer; font-family: var(--font-body); }
        .btn-show { background: rgba(45,159,111,0.2); color: var(--c-success); border: 1px solid var(--c-success); }
        .btn-mark-error { background: rgba(201,64,64,0.2); color: var(--c-error); border: 1px solid var(--c-error); }
        .btn-submit { background: var(--amber); color: #fff; border: 1px solid var(--amber); font-weight: 600; }
        .btn-submit:hover { background: #C2410C; border-color: #C2410C; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .answer-input-wrap { margin: var(--sp-md) 0; }
        .answer-input-wrap label { display: block; font-size: var(--fs-small); color: var(--text-3); margin-bottom: 6px; font-weight: 500; }
        .answer-input { width: 100%; min-height: 88px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.6; resize: vertical; box-sizing: border-box; }
        .answer-input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); }
        .answer-input:disabled { background: #F5F4F0; color: var(--text-3); }

        .judge-card { margin-top: var(--sp-md); padding: var(--sp-md); border-radius: var(--r-md); border-left: 4px solid var(--border); background: var(--amber-light); display: none; }
        .judge-card.visible { display: block; }
        .judge-card.correct { border-left-color: var(--success); background: var(--success-bg); }
        .judge-card.partial { border-left-color: var(--warning); background: var(--warning-bg); }
        .judge-card.wrong { border-left-color: var(--error); background: var(--error-bg); }
        .judge-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .judge-score { font-family: var(--font-heading); font-weight: 900; font-size: 1.6rem; color: var(--text); }
        .judge-verdict { font-weight: 700; color: var(--text); }
        .judge-body { color: var(--text-2); line-height: 1.7; font-size: var(--fs-small); }
        .judge-body strong { color: var(--text); }
        .mistake-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
        .mistake-tag { padding: 3px 10px; background: #fff; border: 1px solid var(--border); border-radius: var(--r-pill, 999px); font-size: 12px; color: var(--text-2); }
        .judge-foot { margin-top: 10px; font-size: var(--fs-small); color: var(--text-3); }

        .summary-card { background: rgba(45,159,111,0.1); border: 1px solid rgba(45,159,111,0.3); border-radius: var(--r-lg); padding: var(--sp-lg); }
        .summary-stats { display: flex; gap: var(--sp-xl); justify-content: center; margin: var(--sp-md) 0; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 900; font-family: var(--font-heading); color: var(--c-origin); }
        .stat-label { font-size: var(--fs-small); color: var(--c-warm-gray); }

        @media (max-width: 767px) {
            .form-row { grid-template-columns: 1fr; }
            .summary-stats { flex-direction: column; gap: var(--sp-md); }
        }        .quick-nav-section { background: #FFFFFF; border-top: 1px solid var(--c-ink-border); padding: var(--sp-xl) var(--sp-lg); margin-top: var(--sp-2xl); }
        .quick-nav-container { max-width: 900px; margin: 0 auto; }
        .quick-nav-title { font-family: var(--font-heading); color: var(--c-warm-gray); font-size: var(--fs-small); margin-bottom: var(--sp-md); text-align: center; }
        .quick-nav-list { display: flex; gap: var(--sp-md); flex-wrap: wrap; justify-content: center; }
        .quick-nav-item { display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs); padding: var(--sp-md); background: var(--amber-light); border: 1px solid var(--c-ink-border); border-radius: var(--r-md); text-decoration: none; transition: all 0.2s; min-width: 100px; }
        .quick-nav-item:hover { border-color: var(--c-origin); transform: translateY(-2px); }
        .quick-nav-icon { font-size: 1.8rem; }
        .quick-nav-name { color: var(--c-warm-white); font-size: var(--fs-small); text-align: center; }


    </style>
</head>

    <script>
    function sharePractice() {
        var total = document.querySelectorAll('#questions-container .question-item').length || document.querySelectorAll('#questions-container > div').length;
        if (!total) { YdzxToast.show('先生成练习题再分享', 'warn'); return; }
        var stage = (document.getElementById('school-stage')||{}).value || '';
        var grade = (document.getElementById('grade')||{}).value || '';
        var subj = (document.getElementById('subject')||{}).value || '';
        var kw = (document.getElementById('keyword')||{}).value || '';
        YdzxShare.open({
            source: 'error-practice',
            title: '原点AI 按错题类型出了一组变式练习',
            subtitle: [stage+grade, subj, kw].filter(Boolean).join(' · '),
            metrics: [
                { label:'题数', value: String(total) },
                { label:'类型', value: kw ? kw.substring(0,4) : '同型' },
                { label:'答案', value: '带讲解' }
            ],
            quote: '同类型多题反复练，薄弱点 3 天就能翻红'
        });
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script>
    // 真题样本缓存
    var seedQuestions = null;
    var textbookIndex = null;

    var subjectMap = {
        '数学': 'math',
        '物理': 'physics',
        '化学': 'chemistry',
        '生物': 'biology'
    };

    var gradesByStage = {'小学': ['三年级', '四年级', '五年级', '六年级'], '初中': ['七年级', '八年级', '九年级'], '高中': ['高一', '高二', '高三']};
    var subjectNameMap = {'数学': '数学', '语文': '语文', '英语': '英语', '物理': '物理', '化学': '化学', '生物': '生物学', '历史': '历史', '地理': '地理', '政治': '道德与法治', '思想政治': '思想政治', '道德与法治': '道德与法治', '科学': '科学', '美术': '美术', '音乐': '音乐'};

    async function loadTextbookIndex() { if (textbookIndex) return; try { var r = await fetch('../src/curriculum/textbook-index.json'); textbookIndex = await r.json(); } catch (e) { console.error(e); } }

    function updateGradeOptions() { var s = document.getElementById('school-stage').value, g = document.getElementById('grade'); g.innerHTML = '<option value="">请选择年级</option>'; if (s && gradesByStage[s]) { gradesByStage[s].forEach(function(v) { var o = document.createElement('option'); o.value = v; o.textContent = v; g.appendChild(o); }); if (s === '初中') g.value = '七年级'; } updateSubjectOptions(); }

    function updateSubjectOptions() { var s = document.getElementById('school-stage').value, g = document.getElementById('grade').value, sub = document.getElementById('subject'); sub.innerHTML = '<option value="">请选择科目</option>'; if (!s || !g) return; var subjects = s === '初中' ? ['语文', '数学', '英语', '物理', '化学', '生物', '历史', '地理', '政治'] : s === '小学' ? ['语文', '数学', '英语', '道德与法治', '科学', '美术', '音乐'] : ['语文', '数学', '英语', '物理', '化学', '生物', '历史', '地理', '思想政治']; subjects.forEach(function(v) { var o = document.createElement('option'); o.value = v; o.textContent = v; sub.appendChild(o); }); if (subjects.includes('数学')) sub.value = '数学'; updateVersionOptions(); }

    async function updateVersionOptions() { var s = document.getElementById('school-stage').value, sub = document.getElementById('subject').value, ver = document.getElementById('textbook-version'); ver.innerHTML = '<option value="">请选择版本</option>'; if (!s || !sub) return; await loadTextbookIndex(); if (!textbookIndex || !textbookIndex[s]) return; var subName = subjectNameMap[sub], subData = textbookIndex[s][subName]; if (!subData) return; Object.keys(subData).forEach(function(v) { var o = document.createElement('option'); o.value = v; o.textContent = v; ver.appendChild(o); }); if (Object.keys(subData).length > 0) ver.value = Object.keys(subData)[0]; }

    // 加载真题样本
    async function loadSeedQuestions() {
        if (seedQuestions) return;
        try {
            var response = await fetch('../src/curriculum/seed-questions.json');
            var data = await response.json();
            seedQuestions = data.questions || [];
        } catch (e) {
            console.error('加载真题样本失败', e);
            seedQuestions = [];
        }
    }

    // 获取题库样本（同科目，用于出题参考）
    function getSampleQuestions(subject) {
        if (!seedQuestions || seedQuestions.length === 0) return '';

        var subjectEn = subjectMap[subject];
        var samples = seedQuestions.filter(q => q.subject === subjectEn).slice(0, 5);
        if (samples.length === 0) return '';

        var text = '**题库样本参考：**\n';
        samples.forEach((q, i) => {
            text += (i + 1) + '. [' + q.difficulty + '] ' + q.question_text + '\n';
            text += '   答案：' + q.answer + '\n';
            if (q.solution_steps) {
                text += '   解析：' + q.solution_steps + '\n';
            }
        });
        return text + '\n请参考以上格式生成练习题。';
    }

    // 页面加载时预加载真题
    document.addEventListener('DOMContentLoaded', function() {
        loadSeedQuestions();
        loadTextbookIndex();
        document.getElementById('school-stage').addEventListener('change', updateGradeOptions);
        document.getElementById('grade').addEventListener('change', updateSubjectOptions);
        document.getElementById('subject').addEventListener('change', updateVersionOptions);
        updateGradeOptions();
    });

    var stats = { total: 0, viewed: 0, errors: 0 };

    function generatePractice() {
        var stage = document.getElementById('school-stage').value;
        var grade = document.getElementById('grade').value;
        var subject = document.getElementById('subject').value;
        var version = document.getElementById('textbook-version').value;
        var quantity = document.getElementById('quantity').value;
        var keyword = document.getElementById('keyword').value;

        if (!stage) { YdzxToast.show('请选择学段', 'error'); YdzxToast.flagField('school-stage'); return; }
        if (!grade) { YdzxToast.show('请选择年级', 'error'); YdzxToast.flagField('grade'); return; }
        if (!subject) { YdzxToast.show('请选择科目', 'error'); YdzxToast.flagField('subject'); return; }
        if (!version) { YdzxToast.show('请选择教材版本', 'error'); YdzxToast.flagField('textbook-version'); return; }
        if (!keyword) { YdzxToast.show('请输入知识点或关键词', 'error'); YdzxToast.flagField('keyword'); return; }

        // 动态注入真题样本
        var sampleQuestions = getSampleQuestions(subject);
        var versionSection = '\n\n**教材信息：**学段：' + stage + '，年级：' + grade + '，科目：' + subject + '，版本：' + version + '\n';
        var sampleSection = sampleQuestions ?
            '\n\n' + sampleQuestions + '\n' :
            '';

        var _ep_stage = document.getElementById('school-stage') ? document.getElementById('school-stage').value : '';
        var _ep_grade = document.getElementById('grade') ? document.getElementById('grade').value : '';
        var _ep_ver = document.getElementById('textbook-version') ? document.getElementById('textbook-version').value : '';
        var _ep_tag = _ep_ver ? _ep_stage + _ep_grade + '（' + _ep_ver + '）' : _ep_stage + _ep_grade;
        var systemPrompt = '你是' + (_ep_tag || '该年级') + '的变式出题专家，严格对齐该版本教材。根据学生的年级、科目和指定知识点，生成' + quantity + '道练习题。' +
            versionSection + sampleSection + '\n' +
            '要求：\n' +
            '1. 题目难度分布：简单30%、中等50%、困难20%\n' +
            '2. 题目类型多样：选择题、填空题、计算题、简答题\n' +
            '3. 每道题包含完整的答案和解析\n' +
            '4. 数学公式用LaTeX格式（$公式$或$$公式$$）\n\n' +
            '回复格式（严格JSON）：\n' +
            '{\n' +
            '  "questions": [\n' +
            '    {\n' +
            '      "id": 1,\n' +
            '      "difficulty": "简单" | "中等" | "困难",\n' +
            '      "content": "题目内容",\n' +
            '      "answer": "答案",\n' +
            '      "explanation": "详细解析"\n' +
            '    },\n' +
            '    ...\n' +
            '  ]\n' +
            '}';

        var userMsg = '学段：' + stage + '\n年级：' + grade + '\n科目：' + subject + '\n教材版本：' + version + '\n知识点：' + keyword + '\n题量：' + quantity + '道';

        document.getElementById('result-section').classList.add('visible');
        document.getElementById('questions-container').innerHTML = '<p style="text-align:center;color:var(--c-warm-gray)">AI正在生成练习题...</p>';

        var btn = document.getElementById('generate-btn');
        btn.disabled = true;

        window.YdzxAI.call({
            systemPrompt: systemPrompt,
            messages: [{ role: 'user', content: userMsg }],
            maxTokens: 4000,
            onDone: function(fullText) {
                btn.disabled = false;
                try {
                    var jsonMatch = fullText.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('无法解析AI回复');
                    var result = JSON.parse(jsonMatch[0]);
                    lastQuestions = result.questions || [];
                    lastContext = { subject: subject, grade: grade, keyword: keyword };
                    renderQuestions(lastQuestions);
                    stats.total = lastQuestions.length;
                    updateStats();
                    document.getElementById('summary-card').style.display = 'block';

                    // 保存到learning-store
                    if (window.LearningStore) {
                        window.LearningStore.savePractice({
                            type: 'error-practice',
                            grade: grade,
                            subject: subject,
                            keyword: keyword,
                            questions: result.questions
                        });
                    }
                } catch (e) {
                    console.error('解析失败', e);
                    document.getElementById('questions-container').innerHTML = '<p style="color:var(--c-error)">AI回复格式异常，请重试。</p>';
                }
            },
            onError: function(err) {
                btn.disabled = false;
                document.getElementById('questions-container').innerHTML = '<p style="color:var(--c-error)">' + err + '</p>';
            }
        });
    }

    function renderQuestions(questions) {
        var html = questions.map(function(q, i) {
            var difficultyClass = q.difficulty === '简单' ? 'difficulty-easy' : (q.difficulty === '困难' ? 'difficulty-hard' : 'difficulty-medium');
            var contentRendered = renderMath(q.content);
            var answerRendered = renderMath(q.answer);
            var explanationRendered = renderMath(q.explanation);

            return '<div class="practice-question" data-idx="' + i + '">' +
                '<div class="question-header">' +
                '<span class="question-num">第 ' + (i+1) + ' 题</span>' +
                '<span class="question-difficulty ' + difficultyClass + '">' + q.difficulty + '</span>' +
                '</div>' +
                '<div class="question-content">' + contentRendered + '</div>' +
                '<div class="answer-input-wrap">' +
                '<label for="stu-ans-' + i + '">你的作答（写出思路和结论，AI 会判分）</label>' +
                '<textarea class="answer-input" id="stu-ans-' + i + '" placeholder="这里直接写解题过程，数学可写文字描述或 $x=1$"></textarea>' +
                '</div>' +
                '<div class="question-actions">' +
                '<button class="btn-small btn-submit" id="submit-btn-' + i + '" onclick="submitAnswer(' + i + ')">提交作答 · AI 判分</button>' +
                '<button class="btn-small btn-show" onclick="showAnswer(' + i + ')">查看答案</button>' +
                '<button class="btn-small btn-mark-error" onclick="markAsError(' + i + ')">标记为错题</button>' +
                '</div>' +
                '<div class="judge-card" id="judge-' + i + '"></div>' +
                '<div class="answer-section" id="answer-' + i + '">' +
                '<strong>答案：</strong>' + answerRendered + '<br><br>' +
                '<strong>解析：</strong>' + explanationRendered +
                '</div>' +
                '</div>';
        }).join('');
        document.getElementById('questions-container').innerHTML = html;
    }

    function renderMath(text) {
        if (!text) return '';
        try {
            return text.replace(/\$\$([^\$]+)\$\$/g, function(match, formula) {
                return katex.renderToString(formula, { displayMode: true, throwOnError: false });
            }).replace(/\$([^\$]+)\$/g, function(match, formula) {
                return katex.renderToString(formula, { displayMode: false, throwOnError: false });
            });
        } catch (e) {
            return text;
        }
    }

    function showAnswer(index) {
        var answerEl = document.getElementById('answer-' + index);
        if (!answerEl.classList.contains('visible')) {
            stats.viewed++;
            updateStats();
        }
        answerEl.classList.toggle('visible');
    }

    // 缓存最近一次生成的题目（submitAnswer 时读取对照答案）
    var lastQuestions = [];
    var lastContext = { subject: '', grade: '', keyword: '' };

    // 判题：0-10 分 + verdict + 错因标签 + 下一步建议
    function submitAnswer(index) {
        var q = lastQuestions[index];
        if (!q) return;
        var studentAns = (document.getElementById('stu-ans-' + index).value || '').trim();
        if (!studentAns) { YdzxToast.show('请先写下你的作答', 'warn'); return; }

        var btn = document.getElementById('submit-btn-' + index);
        var card = document.getElementById('judge-' + index);
        btn.disabled = true;
        btn.textContent = 'AI 正在判分…';
        card.className = 'judge-card visible';
        card.innerHTML = '<div class="judge-body">AI 正在比对你的思路和标准答案…</div>';

        var sys = '你是一位' + (lastContext.grade || '该年级') + lastContext.subject + '老师，负责判一道练习题。判分只看思路和最终结论，不抠格式。\n\n'
            + '打分规则：\n'
            + '- 9-10 分：结论正确 + 关键步骤完整\n'
            + '- 7-8 分：结论正确但步骤缺失或跳步\n'
            + '- 4-6 分：思路对了一半，结论错或算错关键步\n'
            + '- 1-3 分：方向错了\n'
            + '- 0 分：空白或完全不相关\n\n'
            + '错因标签（从以下选，最多 3 个）：概念混淆 / 公式记错 / 审题漏条件 / 计算失误 / 单位遗漏 / 推理跳步 / 建模错误 / 书写不规范 / 方向正确但步骤缺失\n\n'
            + '严格返回 JSON：\n'
            + '{\n'
            + '  "score": 整数 0-10,\n'
            + '  "verdict": "correct" | "partial" | "wrong",\n'
            + '  "correct_points": "学生做对的部分，一句话",\n'
            + '  "gap": "学生真正缺什么，一句话，具体到知识点或步骤，禁用粗心/马虎",\n'
            + '  "mistake_tags": ["..."],\n'
            + '  "next_step": "下一步该做什么，一句话可执行"\n'
            + '}\n\n'
            + '禁止输出 JSON 之外的任何文字。';

        var userMsg = '题目：' + q.content + '\n'
            + '标准答案：' + q.answer + '\n'
            + '标准解析：' + q.explanation + '\n\n'
            + '学生作答：\n' + studentAns;

        window.YdzxAI.call({
            systemPrompt: sys,
            messages: [{ role: 'user', content: userMsg }],
            maxTokens: 800,
            onDone: function (fullText) {
                btn.disabled = false;
                btn.textContent = '重新提交';
                try {
                    var m = fullText.match(/\{[\s\S]*\}/);
                    if (!m) throw new Error('无法解析');
                    var j = JSON.parse(m[0]);
                    var score = Math.max(0, Math.min(10, parseInt(j.score, 10) || 0));
                    var verdict = j.verdict || (score >= 9 ? 'correct' : score >= 6 ? 'partial' : 'wrong');
                    var cls = verdict === 'correct' ? 'correct' : (verdict === 'partial' ? 'partial' : 'wrong');
                    var emoji = verdict === 'correct' ? '✅' : (verdict === 'partial' ? '⚠️' : '❌');
                    var label = verdict === 'correct' ? '正确' : (verdict === 'partial' ? '部分正确' : '答错了');
                    var tags = (j.mistake_tags || []).map(function (t) { return '<span class="mistake-tag">' + t + '</span>'; }).join('');

                    card.className = 'judge-card visible ' + cls;
                    card.innerHTML =
                        '<div class="judge-head">' +
                        '<span class="judge-score">' + score + '/10</span>' +
                        '<span class="judge-verdict">' + emoji + ' ' + label + '</span>' +
                        '</div>' +
                        '<div class="judge-body">' +
                        (j.correct_points ? '<p><strong>做对了：</strong>' + j.correct_points + '</p>' : '') +
                        (j.gap ? '<p><strong>缺在哪：</strong>' + j.gap + '</p>' : '') +
                        (tags ? '<div class="mistake-tags">' + tags + '</div>' : '') +
                        (j.next_step ? '<p class="judge-foot">👉 下一步：' + j.next_step + '</p>' : '') +
                        '</div>';

                    // 游戏化埋点
                    if (window.GAME) {
                        if (score >= 9) window.GAME.addXP(15, '练习正确 · ' + lastContext.keyword);
                        else if (score >= 7) window.GAME.addXP(8, '部分正确 · ' + lastContext.keyword);
                        else window.GAME.addXP(3, '尝试作答 · ' + lastContext.keyword);
                        // 攻克徽章：基于错题池累计
                        if (window.LearningStore) {
                            var errs = window.LearningStore.getErrors();
                            if (errs.length >= 10) window.GAME.unlockBadge('error_sweeper_10');
                            if (errs.length >= 50) window.GAME.unlockBadge('error_sweeper_50');
                        }
                        if (window.YdzxHUD) window.YdzxHUD.refresh();
                    }
                    // 低分自动写入错题池
                    if (score < 7 && window.LearningStore) {
                        window.LearningStore.saveError({
                            source: 'error-practice',
                            subject: lastContext.subject,
                            grade: lastContext.grade,
                            keyword: lastContext.keyword,
                            question: q.content,
                            studentAnswer: studentAns,
                            correctAnswer: q.answer,
                            explanation: q.explanation,
                            score: score,
                            verdict: verdict,
                            gap: j.gap || '',
                            mistakeTags: j.mistake_tags || []
                        });
                        stats.errors++;
                        updateStats();
                    } else if (score >= 9) {
                        // 做对的题目不写入错题池
                    }
                } catch (e) {
                    card.className = 'judge-card visible';
                    card.innerHTML = '<div class="judge-body">AI 回复格式异常，已显示原文：<br><em>' + fullText.replace(/</g, '&lt;').slice(0, 400) + '</em></div>';
                }
            },
            onError: function (err) {
                btn.disabled = false;
                btn.textContent = '重试';
                card.className = 'judge-card visible wrong';
                card.innerHTML = '<div class="judge-body">判分失败：' + err + '</div>';
            }
        });
    }

    function markAsError(index) {
        var q = lastQuestions[index];
        if (!q) return;
        YdzxToast.confirm('标记为错题？会连同题目/解析一起存入错题本。', { confirmText: '存入错题本' }).then(function(ok){
            if (!ok) return;
            var studentAns = (document.getElementById('stu-ans-' + index).value || '').trim();
            if (window.LearningStore) {
                window.LearningStore.saveError({
                    source: 'error-practice',
                    subject: lastContext.subject,
                    grade: lastContext.grade,
                    keyword: lastContext.keyword,
                    question: q.content,
                    studentAnswer: studentAns || '（未作答）',
                    correctAnswer: q.answer,
                    explanation: q.explanation,
                    score: 0,
                    verdict: 'wrong',
                    gap: '用户手动标记',
                    mistakeTags: ['用户手动标记']
                });
            }
            stats.errors++;
            updateStats();
            YdzxToast.show('已存入错题本 · 可在「学习档案 / 错题举一反三」复习', 'success');
        });
    }

    function updateStats() {
        document.getElementById('total-count').textContent = stats.total;
        document.getElementById('viewed-count').textContent = stats.viewed;
        document.getElementById('error-count').textContent = stats.errors;
    }
    </script>
    <script src="../src/gamification.js"></script>
    <script src="../src/gamification-hud.js"></script>
    <script src="../src/tools-nav.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', () => {
        initToolsNav('error-practice.html');
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题本 · 间隔复习 | 原点智学</title>
<meta name="description" content="quiz 自评做错的题、手动标记、月考诊断推送都汇总在这里。FSRS 简化版排期：记得了 +1 阶，还不会回 0 阶。">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#D85A30;
  --bg:#FFFFFF;--bg-2:#F7F6F2;
  --card:#FFFFFF;
  --ink:#1A1A1A;--ink2:#666666;--ink3:#999999;--ink4:#999999;
  --bdr:rgba(0,0,0,0.08);--bdr2:rgba(0,0,0,0.16);
  /* 错题本主题色 (痛点 pill) */
  --pain-bg:#FCEBEB;--pain-text:#791F1F;
  /* 完成状态(正确答案/掌握) 用低饱和绿 */
  --ok-bg:#E1F5EE;--ok-text:#085041;
  /* 中间态(模糊/今日新增) 用低饱和琥珀 */
  --mid-bg:#FAEEDA;--mid-text:#854F0B;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --r:8px;
  /* 兼容老 class 名: 旧 CSS 用 --red --amber --emerald, 重映射到痛点/中间/掌握 */
  --red:var(--primary);--red-bg:var(--pain-bg);--red-deep:var(--pain-text);
  --amber:var(--mid-text);--amber-bg:var(--mid-bg);--gold:var(--mid-text);
  --emerald:var(--ok-text);--emerald-bg:var(--ok-bg);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}

.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--bg);border-bottom:0.5px solid var(--bdr);height:60px}
.nav-in{max-width:1200px;margin:0 auto;height:100%;padding:0 32px;display:flex;align-items:center;gap:32px}
.nav-brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ink)}
.nav-brand svg{display:none}
.nav-brand::before{content:'';width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block;position:relative}
.nav-brand::after{content:'';position:absolute;left:38px;top:30px;width:6px;height:6px;background:var(--primary);border-radius:50%}
.nav-a{font-size:13px;color:var(--ink2);transition:color .15s;padding:0;background:transparent;border-radius:0;font-weight:400}
.nav-a:hover{color:var(--ink);background:transparent}
.nav-a.on{color:var(--ink);font-weight:500;background:transparent}
.nav-in>.nav-brand{margin-right:32px}
.nav-in>.nav-a{margin-right:24px}
.nav-in>.nav-a:nth-of-type(7){margin-left:auto;margin-right:0}
@media (max-width:768px){
  .nav-in{padding:0 20px;gap:0;overflow-x:auto;white-space:nowrap}
  .nav-in>.nav-a{margin-right:18px;font-size:12px;flex-shrink:0}
}

.wrap{max-width:920px;margin:0 auto;padding:90px 32px 80px}
@media(max-width:768px){.wrap{padding:80px 20px 48px}}

.head{margin-bottom:24px}
.eyebrow{font-size:12px;color:var(--ink3);letter-spacing:.4px;margin-bottom:12px}
.h-title{font-size:32px;font-weight:500;letter-spacing:-.5px;line-height:1.2;color:var(--ink)}
.h-title small{font-weight:400;color:var(--ink2);font-size:14px;margin-left:0;display:block;margin-top:6px}
@media(max-width:768px){.h-title{font-size:24px}}

#streak-mount,#upnext-banner-mount{margin-bottom:14px}

/* 顶部 stats — 单灰 + 局部主色 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--bg-2);border-radius:8px;padding:16px;border:0.5px solid transparent}
.stat-card .sn{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1;color:var(--ink)}
.stat-card .sl{font-size:11px;color:var(--ink3);font-weight:400;margin-top:6px;letter-spacing:.3px}
.stat-card.due .sn{color:var(--primary)}
.stat-card.tot .sn{color:var(--ink)}
.stat-card.mas .sn{color:var(--ink)}
.stat-card.tdy .sn{color:var(--ink)}

/* filters — 极简 toggle */
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fl-grp{display:inline-flex;background:var(--bg);border:0.5px solid var(--bdr);border-radius:6px;overflow:hidden;font-size:12px}
.fl-grp button{background:transparent;border:none;padding:7px 12px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit;font-weight:400;border-right:0.5px solid var(--bdr)}
.fl-grp button:last-child{border-right:none}
.fl-grp button:hover{background:var(--bg-2);color:var(--ink)}
.fl-grp button.on{background:var(--ink);color:var(--bg);font-weight:500}

/* error item */
.list{display:grid;gap:8px}
.item{background:var(--card);border:0.5px solid var(--bdr);border-radius:var(--r);padding:18px 20px;border-left:2px solid var(--primary);transition:border-color .15s}
.item:hover{border-color:var(--bdr2)}
.item.due{border-left-color:var(--primary)}
.item.future{border-left-color:var(--bdr2);opacity:.85}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.item-meta span{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:400}
.m-subj{background:var(--bg-2);color:var(--ink2)}
.m-src{background:var(--bg-2);color:var(--ink2)}
.m-tag{background:var(--pain-bg);color:var(--pain-text)}
.m-due{background:var(--ink);color:var(--bg)}
.m-soon{background:var(--mid-bg);color:var(--mid-text)}
.m-later{background:var(--bg-2);color:var(--ink3)}
.item-q{font-size:14px;font-weight:400;color:var(--ink);line-height:1.7;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:hidden;position:relative}
.item-q.expanded{max-height:none}
.item-q.fade::after{content:'';position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(transparent,#fff)}
.item-expand{font-size:11px;color:var(--ink3);text-decoration:underline;cursor:pointer;margin-bottom:8px;background:transparent;border:none;padding:0;font-family:inherit}
.item-ans{font-size:13px;color:var(--ink);background:var(--ok-bg);padding:8px 12px;border-radius:6px;font-family:var(--mono);margin-bottom:8px}
.item-ans b{color:var(--ok-text);font-weight:500}
.item-exp{font-size:12px;color:var(--ink2);line-height:1.65;margin-bottom:10px;white-space:pre-wrap}
.item-exp.ai{background:var(--bg-2);border-left:2px solid var(--ink);padding:10px 12px;border-radius:0 6px 6px 0;color:var(--ink2);margin-top:8px}
.item-exp.ai .ai-tag{display:inline-block;font-size:10px;font-weight:500;color:var(--ink);background:var(--bg);padding:2px 7px;border-radius:4px;margin-bottom:6px;letter-spacing:.5px;border:0.5px solid var(--bdr)}
.btn-violet{background:var(--ink);color:#fff;border-color:transparent}
.btn-violet:hover{background:#000;color:#fff}
.btn-loading{opacity:.6;pointer-events:none}
.btn-loading::after{content:' …'}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 12px;border-radius:6px;font-size:12px;font-weight:500;border:0.5px solid var(--bdr);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px;line-height:1;background:var(--bg);color:var(--ink2);min-height:32px}
.btn:hover{border-color:var(--bdr2);color:var(--ink)}
.btn-ok{background:var(--ok-bg);color:var(--ok-text);border-color:transparent}
.btn-ok:hover{background:#cfe9de;color:var(--ok-text)}
.btn-no{background:var(--pain-bg);color:var(--pain-text);border-color:transparent}
.btn-no:hover{background:#f7d5d5;color:var(--pain-text)}
.btn-amber{background:var(--mid-bg);color:var(--mid-text);border-color:transparent}
.btn-amber:hover{background:#f4ddb6;color:var(--mid-text)}
.item-actions .spacer{flex:1}
.item-actions .del{font-size:11px;color:var(--ink3);background:transparent;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}
.item-actions .del:hover{color:var(--ink)}

/* 薄弱 KP 汇总 */
.weak{margin-bottom:14px;background:var(--bg-2);border:0.5px solid var(--bdr);border-radius:8px;padding:14px 16px}
.weak-hd{font-size:12px;font-weight:500;color:var(--ink);margin-bottom:8px;letter-spacing:.3px}
.weak-hd small{font-weight:400;color:var(--ink3);margin-left:6px}
.weak-list{display:flex;gap:6px;flex-wrap:wrap}
.weak-chip{background:var(--bg);border:0.5px solid var(--bdr);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:400;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all .15s}
.weak-chip:hover{border-color:var(--bdr2)}
.weak-chip b{color:var(--primary);font-weight:500;font-variant-numeric:tabular-nums}
.weak-chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weak-chip.on b{color:var(--bg)}

/* 14 天趋势 */
.trend{margin-bottom:18px;background:var(--card);border:0.5px solid var(--bdr);border-radius:8px;padding:14px 16px}
.trend-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.trend-t{font-size:13px;font-weight:500;color:var(--ink)}
.trend-t small{font-weight:400;color:var(--ink3);font-size:11px;margin-left:6px}
.trend-legend{font-size:11px;color:var(--ink3);display:flex;gap:12px}
.trend-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.trend-legend .lg-new i{background:var(--primary)}
.trend-legend .lg-rev i{background:var(--ok-text)}
.trend-svg{display:block;width:100%;height:80px}
.trend-foot{margin-top:8px;font-size:11px;color:var(--ink3);line-height:1.5}
.trend-foot b{color:var(--ink);font-weight:500}
.trend-foot .verdict.up{color:var(--primary);font-weight:500}
.trend-foot .verdict.down{color:var(--ok-text);font-weight:500}
.trend-foot .verdict.flat{color:var(--ink2);font-weight:500}

/* 复习模式 CTA */
.cta-bar{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cta-bar .btn-review{background:var(--ink);color:var(--bg);border:none;padding:12px 20px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;min-height:44px;transition:background .15s,transform .1s}
.cta-bar .btn-review:hover{background:#000}
.cta-bar .btn-review:active{transform:scale(.98)}
.cta-bar .btn-review[disabled]{background:var(--ink3);cursor:not-allowed}
.cta-bar .cta-meta{font-size:11px;color:var(--ink3);margin-left:auto}

.rev-mod{display:none;position:fixed;inset:0;z-index:200;background:rgba(26,26,26,.85);align-items:center;justify-content:center;padding:20px}
.rev-mod.on{display:flex}
.rev-shell{width:100%;max-width:680px;background:#fff;border-radius:8px;display:flex;flex-direction:column;max-height:96vh;overflow:hidden}
.rev-hd{padding:16px 20px;border-bottom:0.5px solid var(--bdr);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rev-hd .rh-t{font-size:14px;font-weight:500;color:var(--ink)}
.rev-hd .rh-prog{flex:1;height:4px;background:var(--bg-2);border-radius:2px;overflow:hidden;min-width:120px}
.rev-hd .rh-prog i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.rev-hd .rh-num{font-size:13px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;font-family:var(--mono)}
.rev-hd .rh-x{background:transparent;border:0.5px solid var(--bdr);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;color:var(--ink2);font-family:inherit}
.rev-hd .rh-x:hover{background:var(--bg-2);color:var(--ink)}
.rev-body{padding:24px 24px 16px;overflow-y:auto;flex:1}
.rev-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rev-meta span{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:400}
.rev-q{font-size:16px;font-weight:400;color:var(--ink);line-height:1.7;white-space:pre-wrap;margin-bottom:14px;min-height:80px}
.rev-flip{display:block;width:100%;padding:14px;background:var(--bg-2);border:0.5px dashed var(--bdr2);border-radius:6px;text-align:center;font-size:13px;color:var(--ink2);font-weight:400;cursor:pointer;font-family:inherit}
.rev-flip:hover{background:var(--bg);color:var(--ink);border-style:solid;border-color:var(--bdr2)}
.rev-flip kbd{font-family:var(--mono);font-size:10px;background:var(--bg);color:var(--ink2);padding:1px 5px;border-radius:3px;border:0.5px solid var(--bdr);margin:0 2px}
.rev-back{margin-top:14px;display:none}
.rev-back.on{display:block}
.rev-back .a-lbl{font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.rev-back .a-txt{font-size:14px;font-weight:500;color:var(--ink);background:var(--ok-bg);padding:10px 14px;border-radius:6px;font-family:var(--mono);margin-bottom:10px;word-break:break-word}
.rev-back .a-txt b{color:var(--ok-text)}
.rev-back .a-exp{font-size:13px;color:var(--ink2);line-height:1.65;background:var(--bg-2);padding:10px 12px;border-radius:6px;white-space:pre-wrap}
.rev-foot{padding:14px 20px;border-top:0.5px solid var(--bdr);display:flex;gap:8px;flex-wrap:wrap;background:var(--bg-2)}
.rev-foot button{flex:1;min-width:130px;padding:14px 16px;border-radius:6px;font-size:13px;font-weight:500;border:none;cursor:pointer;font-family:inherit;min-height:48px}
.rev-foot .btn-no{background:var(--pain-bg);color:var(--pain-text)}
.rev-foot .btn-no:hover{background:#f7d5d5}
.rev-foot .btn-mid{background:var(--mid-bg);color:var(--mid-text)}
.rev-foot .btn-mid:hover{background:#f4ddb6}
.rev-foot .btn-yes{background:var(--ok-bg);color:var(--ok-text)}
.rev-foot .btn-yes:hover{background:#cfe9de}
.rev-foot button kbd{display:inline-block;background:rgba(0,0,0,.12);font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;margin-left:5px}
.rev-foot button[disabled]{opacity:.4;cursor:not-allowed}
.rev-done{padding:32px 24px;text-align:center}
.rev-done .rd-em{font-size:28px;line-height:1;margin-bottom:8px}
.rev-done .rd-t{font-size:18px;font-weight:500;margin-bottom:4px}
.rev-done .rd-stats{font-size:13px;color:var(--ink2);margin:14px 0;line-height:1.7}
.rev-done .rd-stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.rev-done .btn-close{margin-top:6px;background:var(--ink);color:#fff;padding:12px 24px;border-radius:6px;font-size:13px;font-weight:500;border:none;cursor:pointer;font-family:inherit;min-height:44px}

.empty{padding:48px 20px;text-align:center;color:var(--ink3);font-size:13px;background:var(--bg-2);border-radius:var(--r)}
.empty b{color:var(--ink);font-weight:500;display:block;margin-bottom:6px;font-size:15px}
.empty a{color:var(--ink);font-weight:500;text-decoration:underline}

.intro{margin-bottom:18px;padding:14px 16px;background:var(--bg-2);border-radius:8px;font-size:13px;color:var(--ink2);line-height:1.65}
.intro b{color:var(--ink);font-weight:500}

@media(max-width:600px){
  .item{padding:14px 16px}
  .item-q{font-size:13px}
}
</style>
</head>

<script>
const SUBJ_ZH = { math:'数学', physics:'物理', chemistry:'化学', biology:'生物', chinese:'语文', english:'英语', history:'历史', geography:'地理', politics:'政治', moral:'道法' };
const SOURCE_ZH = { 'quiz':'每日一题', 'error-practice':'举一反三', 'error-mastery':'错题攻克', 'exam-diagnosis':'考试诊断', 'essay-grading':'作文批改' };

let FILTER = { subject: '', view: 'due', keyword: '' }; // view: due | all | mastered

function $(id){ return document.getElementById(id); }
function escHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; });
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function dayKey(ts){ return new Date(ts).toISOString().slice(0,10); }
function dueLabel(e){
  const now = Date.now();
  const next = e.nextReviewAt || 0;
  if (next <= now) return { txt: '到期', cls: 'm-due' };
  const days = Math.round((next - now) / 86400000);
  if (days <= 1) return { txt: '< 1 天', cls: 'm-soon' };
  return { txt: days + ' 天后', cls: 'm-later' };
}

function loadStats(){
  if (!window.LearningStore){ return; }
  const all = window.LearningStore.getErrors();
  const now = Date.now();
  const today = todayKey();
  const due = all.filter(function(e){ return (e.nextReviewAt || 0) <= now; });
  const todayNew = all.filter(function(e){ return dayKey(e.timestamp || 0) === today; });
  const mastered = all.filter(function(e){ return (e.reviewCount || 0) >= 3; });

}

// 选出最适合冲关的 5 题: 同章节 active 错题最多的章节; 没章节绑定的退化为同学科
function pickChallengeBatch(errs){
  if (!errs || !errs.length) return null;
  // 兼容两种 textbook 字段(textbookRef.path / 顶层 textbookPath)
  function sigOf(e){
    if (e.textbookRef && e.textbookRef.path && e.textbookRef.ch != null)
      return e.textbookRef.path + '::ch' + e.textbookRef.ch;
    if (e.textbookPath && e.textbookCh != null)
      return e.textbookPath + '::ch' + e.textbookCh;
    return '';
  }
  const byChapter = {};
  errs.forEach(function(e){
    const s = sigOf(e);
    if (!s) return;
    if (!byChapter[s]) byChapter[s] = [];
    byChapter[s].push(e);
  });
  // 找最大的章节桶
  let bestSig = '', bestList = [];
  Object.keys(byChapter).forEach(function(s){
    if (byChapter[s].length > bestList.length) { bestSig = s; bestList = byChapter[s]; }
  });
  if (bestList.length >= 5) {
    // 限定 5 题, 优先到期 + 阶段较低
    const sorted = bestList.slice().sort(function(a, b){
      const ad = (a.nextReviewAt||0) <= Date.now() ? 0 : 1;
      const bd = (b.nextReviewAt||0) <= Date.now() ? 0 : 1;
      if (ad !== bd) return ad - bd;
      return (a.reviewCount||0) - (b.reviewCount||0);
    });
    const ch = bestSig.split('::ch')[1];
    const path = bestSig.split('::ch')[0];
    const tail = path.split('/').slice(-3).join('/');
    return { sig: bestSig, batch: sorted.slice(0, 5), label: tail + ' 第 ' + ch + ' 章' };
  }
  // 退化 1: 同学科最大桶
  const bySubj = {};
  errs.forEach(function(e){
    const k = e.subject || '_';
    if (!bySubj[k]) bySubj[k] = [];
    bySubj[k].push(e);
  });
  let subjBest = '_', subjList = [];
  Object.keys(bySubj).forEach(function(k){
    if (bySubj[k].length > subjList.length) { subjBest = k; subjList = bySubj[k]; }
  });
  if (subjList.length >= 5){
    return { sig: 'subj::' + subjBest, batch: subjList.slice(0, 5), label: (SUBJ_ZH[subjBest] || subjBest) + '·混章' };
  }
  return { sig: '', batch: errs.slice(0, Math.min(5, errs.length)), label: '攒题中' };
}

// 5 题冲关: 复用 startReview, 但开 REVIEW.mode=challenge, 全对解锁
function startChallenge(challenge){
  // 拷贝 + 不打乱顺序(冲关按难度梯度更友好)
  const queue = challenge.batch.slice();
  REVIEW = { queue: queue, idx: 0, flipped: false, stats: { ok: 0, mid: 0, no: 0, xp: 0 }, mode: 'challenge', challengeSig: challenge.sig, challengeLabel: challenge.label };
  $('rev-mod').classList.add('on');
  document.body.style.overflow = 'hidden';
  drawReview();
}

// 复习模式状态机
let REVIEW = null; // { queue:[], idx:0, flipped:false, stats:{ok:0,mid:0,no:0,xp:0} }
function startReview(queue){
  // 拷贝并随机化顺序，避免每次都从同一道开始
  const q = queue.slice().sort(function(){ return Math.random() - 0.5; });
  REVIEW = { queue: q, idx: 0, flipped: false, stats: { ok: 0, mid: 0, no: 0, xp: 0 } };
  $('rev-mod').classList.add('on');
  document.body.style.overflow = 'hidden';
  drawReview();
}
function drawReview(){
  const r = REVIEW; if (!r) return;
  if (r.idx >= r.queue.length){ drawReviewDone(); return; }
  const e = r.queue[r.idx];
  const subjZh = SUBJ_ZH[e.subject] || e.subjectZh || e.subject || '';
  const ref = (e.textbookPath && e.textbookCh != null) ? (e.textbookPath + ' · 第 ' + e.textbookCh + ' 章') : '';
  $('rh-num').textContent = (r.idx + 1) + ' / ' + r.queue.length;
  $('rh-prog-fill').style.width = ((r.idx) / r.queue.length * 100).toFixed(1) + '%';
  let body = '<div class="rev-meta">';
  if (subjZh) body += '<span style="background:var(--amber-bg);color:var(--gold)">' + escHtml(subjZh) + '</span>';
  if (e.keyword) body += '<span style="background:var(--red-bg);color:var(--red-deep)">' + escHtml(e.keyword) + '</span>';
  if (ref) body += '<span style="background:var(--sky-bg);color:#0C4A6E;font-family:var(--mono);font-size:10px">' + escHtml(ref) + '</span>';
  body += '<span style="background:#F4F4F5;color:var(--ink3)">复习 ' + (e.reviewCount || 0) + ' 次</span>';
  body += '</div>';
  body += '<div class="rev-q">' + escHtml((e.question || '').slice(0, 1500)) + '</div>';
  if (!r.flipped){
    body += '<div class="rev-flip" id="rev-flip">点这里看答案 · <kbd>空格</kbd></div>';
  } else {
    body += '<div class="rev-back on">';
    if (e.correctAnswer) body += '<div class="a-lbl">正确答案</div><div class="a-txt">' + escHtml(e.correctAnswer) + '</div>';
    if (e.aiExplanation) body += '<div class="a-lbl">🤖 AI 诊断</div><div class="a-exp">' + escHtml(e.aiExplanation) + '</div>';
    else if (e.explanation) body += '<div class="a-lbl">解析</div><div class="a-exp">' + escHtml(e.explanation.slice(0, 600)) + '</div>';
    body += '</div>';
  }
  $('rev-body').innerHTML = body;
  // 按钮组
  const disabled = r.flipped ? '' : ' disabled';
  $('rev-foot').innerHTML = ''
    + '<button class="btn-no"' + disabled + ' data-rate="no">✗ 不会<kbd>1</kbd></button>'
    + '<button class="btn-mid"' + disabled + ' data-rate="mid">~ 模糊<kbd>2</kbd></button>'
    + '<button class="btn-yes"' + disabled + ' data-rate="yes">✓ 会了<kbd>3</kbd></button>';
  // 绑定
  if (!r.flipped){
    const flip = document.getElementById('rev-flip');
    if (flip) flip.addEventListener('click', flipCard);
  } else {
    document.querySelectorAll('[data-rate]').forEach(function(b){
      b.addEventListener('click', function(){ rate(b.dataset.rate); });
    });
  }
}
function flipCard(){
  if (!REVIEW || REVIEW.flipped) return;
  REVIEW.flipped = true;
  drawReview();
}
function rate(r){
  if (!REVIEW || !REVIEW.flipped) return;
  const e = REVIEW.queue[REVIEW.idx];
  const subjZh = SUBJ_ZH[e.subject] || e.subjectZh || e.subject || '';
  if (r === 'yes'){
    window.LearningStore.markErrorReviewed(e.id, true);
    if (window.GAME) window.GAME.addXP(2, '错题攻克 · ' + subjZh + ' · 复习对了');
    REVIEW.stats.ok += 1; REVIEW.stats.xp += 2;
  } else if (r === 'mid'){
    // 模糊：保留 reviewCount 不动，但把 nextReviewAt 推到 4h 后再问一次
    const pool = JSON.parse(localStorage.getItem('ydzx_errors_pool') || '[]');
    for (let i = 0; i < pool.length; i++){
      if (pool[i].id === e.id){
        pool[i].lastReviewAt = Date.now();
        pool[i].nextReviewAt = Date.now() + 4 * 3600 * 1000;
        break;
      }
    }
    try { localStorage.setItem('ydzx_errors_pool', JSON.stringify(pool)); } catch(_){}
    if (window.GAME) window.GAME.addXP(1, '错题攻克 · ' + subjZh + ' · 模糊 · 4h 后再来');
    REVIEW.stats.mid += 1; REVIEW.stats.xp += 1;
  } else { // no
    window.LearningStore.markErrorReviewed(e.id, false);
    if (window.GAME) window.GAME.addXP(1, '错题攻克 · ' + subjZh + ' · 又答错·重新计时');
    REVIEW.stats.no += 1; REVIEW.stats.xp += 1;
  }
  REVIEW.idx += 1;
  REVIEW.flipped = false;
  drawReview();
}
function drawReviewDone(){
  const s = REVIEW.stats; const total = s.ok + s.mid + s.no;
  $('rh-prog-fill').style.width = '100%';
  $('rh-num').textContent = total + ' / ' + total;

  // 冲关模式: 全对触发额外 XP + 写 localStorage 解锁记录
  let challengeBanner = '';
  if (REVIEW.mode === 'challenge') {
    const perfect = (s.ok === total && total >= 5);
    if (perfect) {
      // 加 +20 XP, 写解锁记录(同 sig 不重复加)
      try {
        const KEY = 'ydzx_challenge_clears_v1';
        const cleared = JSON.parse(localStorage.getItem(KEY) || '{}');
        if (!cleared[REVIEW.challengeSig]) {
          cleared[REVIEW.challengeSig] = { ts: Date.now(), label: REVIEW.challengeLabel };
          localStorage.setItem(KEY, JSON.stringify(cleared));
          if (window.GAME) window.GAME.addXP(20, '考前冲关·' + REVIEW.challengeLabel + ' 全对通关');
        }
      } catch(_){}
      challengeBanner = '<div style="background:var(--ink);color:#fff;padding:18px;border-radius:8px;margin-bottom:14px;text-align:center">'
        + '<div style="font-size:11px;font-weight:500;letter-spacing:.5px;margin-bottom:6px;color:rgba(255,255,255,0.85)">通关</div>'
        + '<div style="font-size:16px;font-weight:800;letter-spacing:.5px;margin-bottom:3px">冲关成功 · ' + escHtml(REVIEW.challengeLabel) + '</div>'
        + '<div style="font-size:11px;opacity:.9">5 题全对 · +20 XP · 这一关下次不再考你</div>'
        + '</div>';
    } else {
      challengeBanner = '<div style="background:#FEF2F2;border:1px solid #FCA5A5;color:#7F1D1D;padding:14px;border-radius:10px;margin-bottom:14px;text-align:center;font-size:13px">'
        + '<b>冲关未过</b> · 下次再来一遍 · 全对解锁 +20 XP</div>';
    }
  }

  $('rev-body').innerHTML = challengeBanner + '<div class="rev-done">'
    + '<div class="rd-em">完成</div>'
    + '<div class="rd-t">' + (REVIEW.mode === 'challenge' ? '本轮冲关结束' : '本轮复习完成') + '</div>'
    + '<div class="rd-stats">共 <b>' + total + '</b> 道 · 会了 <b style="color:var(--emerald)">' + s.ok + '</b> · 模糊 <b style="color:var(--amber)">' + s.mid + '</b> · 不会 <b style="color:var(--red)">' + s.no + '</b><br>本轮累计 <b>+' + s.xp + ' XP</b></div>'
    + '<button class="btn-close" id="rev-close">关闭并刷新错题本</button>'
    + '</div>';
  $('rev-foot').innerHTML = '';
  document.getElementById('rev-close').addEventListener('click', closeReview);
}
function closeReview(){
  $('rev-mod').classList.remove('on');
  document.body.style.overflow = '';
  REVIEW = null;
  loadStats(); renderCTA(); renderWeak(); renderTrend(); renderList();
}

// 键盘快捷键
document.addEventListener('keydown', function(ev){
  if (!REVIEW) return;
  if (ev.key === 'Escape'){ closeReview(); ev.preventDefault(); return; }
  if (ev.key === ' ' && !REVIEW.flipped){ flipCard(); ev.preventDefault(); return; }
  if (REVIEW.flipped){
    if (ev.key === '1'){ rate('no'); ev.preventDefault(); }
    else if (ev.key === '2'){ rate('mid'); ev.preventDefault(); }
    else if (ev.key === '3'){ rate('yes'); ev.preventDefault(); }
  }
});

// 14 天日历，从 13 天前到今天
function _last14DayKeys(){
  const out = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 13; i >= 0; i--){
    const d = new Date(today.getTime() - i * 86400000);
    out.push(d.toISOString().slice(0,10));
  }
  return out;
}
function _dayKey(ts){ if (!ts) return ''; return new Date(ts).toISOString().slice(0,10); }
function renderTrend(){
  const slot = $('trend-mount'); if (!slot) return;
  if (!window.LearningStore){ slot.innerHTML = ''; return; }
  const all = window.LearningStore.getErrors();
  const days = _last14DayKeys();
  const dayIdx = {}; days.forEach(function(d,i){ dayIdx[d] = i; });
  const newCnt = new Array(14).fill(0);
  const revCnt = new Array(14).fill(0);
  all.forEach(function(e){
    const dk = _dayKey(e.timestamp);
    if (dayIdx[dk] != null) newCnt[dayIdx[dk]] += 1;
    const lk = _dayKey(e.lastReviewAt);
    if (dayIdx[lk] != null) revCnt[dayIdx[lk]] += 1;
  });
  const totalNew = newCnt.reduce(function(a,b){ return a+b; }, 0);
  const totalRev = revCnt.reduce(function(a,b){ return a+b; }, 0);
  if (totalNew === 0 && totalRev === 0){
    slot.innerHTML = ''; // 完全没数据，不渲染骚扰
    return;
  }
  const max = Math.max(1, Math.max.apply(null, newCnt.concat(revCnt)));
  const W = 600, H = 80, padL = 24, padR = 8, padT = 6, padB = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const stepX = innerW / 13;
  function pt(i, v){
    return [padL + i * stepX, padT + innerH - (v / max) * innerH];
  }
  function path(arr){
    return arr.map(function(v, i){ const p = pt(i, v); return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('');
  }
  // 轴线 + 网格
  let svg = '<svg class="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
  // y 轴顶/中/底虚线
  for (let g = 0; g <= 2; g++){
    const y = padT + (innerH / 2) * g;
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#E4E4E7" stroke-dasharray="2 3"/>';
  }
  // 红线（新增）
  svg += '<path d="' + path(newCnt) + '" fill="none" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  // 绿线（复习）
  svg += '<path d="' + path(revCnt) + '" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  // 点 + 数值
  for (let i = 0; i < 14; i++){
    if (newCnt[i] > 0){
      const p = pt(i, newCnt[i]);
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.4" fill="#DC2626"/>';
    }
    if (revCnt[i] > 0){
      const p = pt(i, revCnt[i]);
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.4" fill="#059669"/>';
    }
  }
  // x 轴：显示首尾 + 中间
  const ticks = [0, 6, 13];
  ticks.forEach(function(i){
    const x = padL + i * stepX;
    const lbl = days[i].slice(5).replace('-', '/');
    svg += '<text x="' + x.toFixed(1) + '" y="' + (H - 2) + '" font-size="9" fill="#A1A1AA" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,monospace">' + lbl + '</text>';
  });
  // y 轴最大值
  svg += '<text x="' + (padL - 4) + '" y="' + (padT + 4) + '" font-size="9" fill="#A1A1AA" text-anchor="end" font-family="JetBrains Mono,ui-monospace,monospace">' + max + '</text>';
  svg += '</svg>';

  // 趋势判断：近 7 天 新增 vs 复习
  const recent7New = newCnt.slice(7).reduce(function(a,b){ return a+b; }, 0);
  const recent7Rev = revCnt.slice(7).reduce(function(a,b){ return a+b; }, 0);
  let verdict, vClass;
  if (recent7Rev >= recent7New * 1.2 && recent7Rev > 0){
    verdict = '✓ 复习速度跟得上'; vClass = 'down';
  } else if (recent7New > recent7Rev && recent7New > 0){
    verdict = '⚠ 积压在涨 · 该多复习了'; vClass = 'up';
  } else {
    verdict = '— 平稳'; vClass = 'flat';
  }
  const html = '<div class="trend">'
    + '<div class="trend-hd"><div class="trend-t">14 天趋势<small>· 新增 ' + totalNew + ' · 复习 ' + totalRev + '</small></div>'
    + '<div class="trend-legend"><span class="lg-new"><i></i>新增错题</span><span class="lg-rev"><i></i>复习次数</span></div></div>'
    + svg
    + '<div class="trend-foot">最近 7 天 · 新增 <b>' + recent7New + '</b> · 复习 <b>' + recent7Rev + '</b> · <span class="verdict ' + vClass + '">' + verdict + '</span></div>'
    + '</div>';
  slot.innerHTML = html;
}

    return;
  }
  let pool = window.LearningStore.getErrors({ subject: FILTER.subject || undefined, keyword: FILTER.keyword || undefined });
  const now = Date.now();
  if (FILTER.view === 'due') pool = pool.filter(function(e){ return (e.nextReviewAt || 0) <= now && (e.reviewCount || 0) < 3; });
  else if (FILTER.view === 'mastered') pool = pool.filter(function(e){ return (e.reviewCount || 0) >= 3; });
  // 排序：到期最近 → 最远；同到期，新错先看
  pool.sort(function(a, b){
    const da = (a.nextReviewAt || 0), db = (b.nextReviewAt || 0);
    if (da !== db) return da - db;
    return (b.timestamp || 0) - (a.timestamp || 0);
  });
  if (!pool.length){
    if (FILTER.view === 'due'){
      list.innerHTML = '<div class="empty"><b>没有到期错题</b>所有题都还在间隔期 · 去 <a href="/quiz">每日一题</a> 刷新错题</div>';
    } else if (FILTER.view === 'mastered'){
      list.innerHTML = '<div class="empty"><b>还没有已掌握的错题</b>每条错题做对 3 次以上自动归入这里</div>';
    } else {
      list.innerHTML = '<div class="empty"><b>错题本是空的</b>去 <a href="/quiz.html">每日一题</a> 标几道，或在 <a href="/tools/error-practice">举一反三</a> 直接录入</div>';
    }
    return;
  }
  let h = '';
  pool.forEach(function(e, idx){
    const due = dueLabel(e);
    const isDue = (e.nextReviewAt || 0) <= now;
    const isMas = (e.reviewCount || 0) >= 3;
    const cls = isMas ? 'future' : (isDue ? 'due' : '');
    const subjZh = SUBJ_ZH[e.subject] || e.subjectZh || e.subject || '';
    const srcZh = SOURCE_ZH[e.source] || e.source || '';
    const reviewN = e.reviewCount || 0;
    const qText = (e.question || '').slice(0, 600);
    const longQ = (e.question || '').length > 240;
    const qHref = e.source === 'quiz' && e.quizId ? '/quiz.html#q=' + e.quizId : null;
    h += '<div class="item ' + cls + '" data-id="' + e.id + '">';
    h += '<div class="item-meta">';
    if (subjZh) h += '<span class="m-subj">' + escHtml(subjZh) + '</span>';
    if (srcZh) h += '<span class="m-src">来自 ' + escHtml(srcZh) + '</span>';
    if (e.keyword) h += '<span class="m-tag">' + escHtml(e.keyword) + '</span>';
    h += '<span class="' + due.cls + '" style="font-size:11px;padding:3px 9px;border-radius:100px;font-weight:600">' + due.txt + '</span>';
    h += '<span class="m-later">复习 ' + reviewN + ' 次</span>';
    h += '</div>';
    h += '<div class="item-q ' + (longQ ? 'fade' : '') + '" id="q-' + idx + '">' + escHtml(qText) + '</div>';
    if (longQ) h += '<div class="item-expand" onclick="this.previousElementSibling.classList.toggle(\'expanded\');this.previousElementSibling.classList.remove(\'fade\');this.style.display=\'none\'">展开全文</div>';
    if (e.correctAnswer) h += '<div class="item-ans"><b>正确答案：</b>' + escHtml(e.correctAnswer) + '</div>';
    if (e.explanation) h += '<div class="item-exp">' + escHtml(e.explanation.slice(0, 400)) + (e.explanation.length > 400 ? '...' : '') + '</div>';
    if (e.aiExplanation) h += '<div class="item-exp ai"><span class="ai-tag">🤖 AI 诊断</span>' + escHtml(e.aiExplanation) + '</div>';
    h += '<div class="item-actions">';
    if (isDue && !isMas){
      h += '<button class="btn btn-ok" data-act="ok" data-id="' + e.id + '">✓ 记得了</button>';
      h += '<button class="btn btn-no" data-act="no" data-id="' + e.id + '">✗ 还不会</button>';
    }
    if (qHref) h += '<a class="btn" href="' + qHref + '" target="_blank">回到原题 →</a>';
    if (e.textbookPath && e.textbookCh != null){
      h += '<a class="btn" href="/tools/textbook-browser?book=' + encodeURIComponent(e.textbookPath) + '&ch=' + e.textbookCh + '" target="_blank">📖 看课本</a>';
    }
    var hasAI = e.aiExplanation && e.aiExplanation.length;
    h += '<button class="btn btn-violet" data-act="ai" data-id="' + e.id + '">' + (hasAI ? '🤖 重新讲透' : '🤖 让 AI 讲透') + '</button>';
    h += '<a class="btn btn-amber" href="/tools/error-mastery?prefill=' + encodeURIComponent((e.question || '').slice(0,400)) + '" target="_blank">深度分析 →</a>';
    h += '<span class="spacer"></span>';
    h += '<button class="del" data-act="del" data-id="' + e.id + '">删除</button>';
    h += '</div>';
    h += '</div>';
  });
  list.innerHTML = h;
  document.querySelectorAll('[data-act]').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      const id = b.dataset.id, act = b.dataset.act;
      if (act === 'del'){
        if (!confirm('确定删除这道错题？删除后不可恢复。')) return;
        window.LearningStore.deleteError(id);
      } else if (act === 'ok'){
        window.LearningStore.markErrorReviewed(id, true);
        // 复习对了 → 错题攻克 XP（小，避免刷分）
        var e = (window.LearningStore.getErrors() || []).find(function(x){ return x.id === id; });
        var subjZh = e ? (SUBJ_ZH[e.subject] || e.subjectZh || e.subject || '') : '';
        if (window.GAME) window.GAME.addXP(2, '错题攻克 · ' + subjZh + ' · 复习对了');
      } else if (act === 'no'){
        window.LearningStore.markErrorReviewed(id, false);
        // 复习答错也给少量 XP，鼓励正面对错题
        var e2 = (window.LearningStore.getErrors() || []).find(function(x){ return x.id === id; });
        var subjZh2 = e2 ? (SUBJ_ZH[e2.subject] || e2.subjectZh || e2.subject || '') : '';
        if (window.GAME) window.GAME.addXP(1, '错题攻克 · ' + subjZh2 + ' · 又答错·重新计时');
      } else if (act === 'ai'){
        return aiExplain(id, b);
      }
      loadStats();
      renderCTA();
      renderWeak();
      renderTrend();
      renderList();
    });
  });
}

// 让 DeepSeek 给这道错题做诊断；写回 LearningStore；重渲染 list
function aiExplain(id, btn){
  const all = window.LearningStore.getErrors();
  const e = all.find(function(x){ return x.id === id; });
  if (!e){ alert('找不到这道题'); return; }
  btn.classList.add('btn-loading');
  btn.textContent = '🤖 思考中';
  const subjZh = SUBJ_ZH[e.subject] || e.subjectZh || e.subject || '';
  const sys = '你是耐心的中学'+(subjZh||'')+'老师。学生答错了一道题，你要用最短的话讲清楚三件事：(1) 这题在考什么知识点；(2) 学生最可能踩的坑；(3) 下次怎么避免。' +
              '语言：清晰、口语化、不要 markdown 标题，直接出三段或三条短句即可。150-220 字最佳。';
  const userMsg = '题目：\n' + (e.question || '').slice(0, 1200) + '\n\n标准答案：' + (e.correctAnswer || '（无）') + '\n\n学生答案：' + (e.studentAnswer || '（自评做错）') + '\n\n知识点：' + (e.keyword || '（无）');
  fetch('/api/ai-proxy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      provider: 'deepseek',
      temperature: 0.3,
      max_tokens: 600,
      stream: false,
      messages: [
        { role: 'system', content: sys },
        { role: 'user', content: userMsg }
      ]
    })
  }).then(function(r){
    if (!r.ok) return r.json().then(function(j){ throw new Error(j.message || ('HTTP ' + r.status)); });
    return r.json();
  }).then(function(j){
    var raw = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
    if (!raw) throw new Error('AI 没说话，再试一次');
    window.LearningStore.updateError(id, { aiExplanation: raw, aiExplainedAt: Date.now() });
    btn.classList.remove('btn-loading');
    loadStats();
    renderCTA();
    renderWeak();
    renderTrend();
    renderList();
  }).catch(function(err){
    btn.classList.remove('btn-loading');
    btn.textContent = '🤖 重试';
    alert('AI 诊断失败：' + (err.message || err));
  });
}
(function init(){
  if (!window.LearningStore){
    $('list').innerHTML = '<div class="empty"><b>错题池模块未加载</b>请刷新页面</div>';
    return;
  }
  // 接受 ?subject=&view=&keyword= 深链
  try {
    const p = new URLSearchParams(location.search);
    if (p.get('subject')) FILTER.subject = p.get('subject');
    if (p.get('view') && ['due','all','mastered'].indexOf(p.get('view')) >= 0) FILTER.view = p.get('view');
    if (p.get('keyword')) FILTER.keyword = p.get('keyword');
  } catch(e){}
  loadStats();
  renderCTA();
  renderWeak();
  renderTrend();
  renderFilter();
  renderList();
})();
</script>

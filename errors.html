<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题本 · 间隔复习 | 原点智学</title>
<meta name="description" content="quiz 自评做错的题、error-practice 标记的题、exam-diagnosis 推送的题，都汇总在这一页。按 FSRS 简化版排队复习，记得了+1 阶，还不会回 0 阶，不再让同一道题白错。">
<meta name="theme-color" content="#DC2626">
<link rel="canonical" href="https://www.yuandianzhixue.com/errors.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23DC2626'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23fff' font-weight='900'>!</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.cnpmjs.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.cnpmjs.org/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAFAF7;--card:#fff;--ink:#18181B;--ink2:#3F3F46;--ink3:#71717A;--ink4:#A1A1AA;
  --bdr:#E4E4E7;--bdr2:#D4D4D8;
  --amber:#F5A623;--amber-bg:#FFFBF0;--gold:#D97706;
  --emerald:#059669;--emerald-bg:#ECFDF5;
  --sky:#0EA5E9;--sky-bg:#F0F9FF;
  --slate:#334155;--slate-bg:#F1F5F9;
  --red:#DC2626;--red-bg:#FEF2F2;--red-deep:#991B1B;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --font:'Noto Sans SC',system-ui,sans-serif;
  --r:12px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}

.nav{position:sticky;top:0;z-index:100;background:rgba(250,250,247,.86);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--bdr)}
.nav-in{max-width:920px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:52px;gap:8px}
.nav-brand{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;margin-right:auto}
.nav-brand svg{width:24px;height:24px}
.nav-a{padding:5px 10px;border-radius:7px;text-decoration:none;color:var(--ink3);font-size:13px;font-weight:500}
.nav-a:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.nav-a.on{color:var(--red);background:var(--red-bg)}

.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}

.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.h-title{font-size:22px;font-weight:900;letter-spacing:-.5px}
.h-title small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:8px}

/* 顶部 stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px}
.stat-card .sn{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.stat-card .sl{font-size:11px;color:var(--ink3);font-weight:600;margin-top:5px}
.stat-card.due .sn{color:var(--red)}
.stat-card.tot .sn{color:var(--ink)}
.stat-card.mas .sn{color:var(--emerald)}
.stat-card.tdy .sn{color:var(--amber)}

/* filters */
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.fl-grp{display:inline-flex;background:#fff;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;font-size:12px}
.fl-grp button{background:transparent;border:none;padding:7px 12px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit;font-weight:600;border-right:1px solid var(--bdr)}
.fl-grp button:last-child{border-right:none}
.fl-grp button:hover{background:var(--red-bg);color:var(--red-deep)}
.fl-grp button.on{background:var(--red);color:#fff}

/* error item */
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:18px 20px;border-left:4px solid var(--red)}
.item.due{border-left-color:var(--amber)}
.item.future{border-left-color:#A1A1AA;opacity:.85}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.item-meta span{font-size:11px;padding:3px 9px;border-radius:100px;font-weight:600}
.m-subj{background:var(--amber-bg);color:var(--gold)}
.m-src{background:var(--slate-bg);color:var(--slate)}
.m-tag{background:var(--red-bg);color:var(--red-deep)}
.m-due{background:var(--red);color:#fff}
.m-soon{background:var(--amber);color:#fff}
.m-later{background:#F4F4F5;color:var(--ink3)}
.item-q{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:hidden;position:relative}
.item-q.expanded{max-height:none}
.item-q.fade::after{content:'';position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(transparent,#fff)}
.item-expand{font-size:11px;color:var(--ink4);text-decoration:underline;cursor:pointer;margin-bottom:8px}
.item-ans{font-size:13px;color:var(--ink2);background:var(--emerald-bg);padding:8px 12px;border-radius:6px;font-family:var(--mono);margin-bottom:8px;border:1px solid #A7F3D0}
.item-ans b{color:var(--emerald);font-weight:700}
.item-exp{font-size:12px;color:var(--ink3);line-height:1.65;margin-bottom:10px;white-space:pre-wrap}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 12px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--bdr2);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px;line-height:1;background:#fff;color:var(--ink2)}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn-ok{background:var(--emerald);color:#fff;border-color:transparent}
.btn-ok:hover{background:#047857;color:#fff}
.btn-no{background:var(--red);color:#fff;border-color:transparent}
.btn-no:hover{background:#B91C1C;color:#fff}
.btn-amber{background:var(--amber);color:#fff;border-color:transparent}
.btn-amber:hover{background:var(--gold);color:#fff}
.item-actions .spacer{flex:1}
.item-actions .del{font-size:11px;color:var(--ink4);background:transparent;border:none;cursor:pointer;text-decoration:underline}
.item-actions .del:hover{color:var(--red)}

/* empty state */
.empty{padding:48px 20px;text-align:center;color:var(--ink4);font-size:13px;background:var(--card);border:1px dashed var(--bdr2);border-radius:var(--r)}
.empty b{color:var(--ink2);font-weight:700;display:block;margin-bottom:6px;font-size:15px}
.empty a{color:var(--amber);font-weight:700;text-decoration:none}

/* intro */
.intro{margin-bottom:18px;padding:14px 16px;background:var(--card);border:1px solid var(--bdr);border-radius:10px;font-size:13px;color:var(--ink2);line-height:1.65}
.intro b{color:var(--ink);font-weight:700}

@media(max-width:600px){
  .item{padding:14px 16px}
  .item-q{font-size:14px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 26 26" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="26" y2="26"><stop offset="0%" stop-color="#B0B0B0"/><stop offset="100%" stop-color="#404040"/></linearGradient></defs><circle cx="13" cy="13" r="12" fill="url(#lg)"/><rect x="12" y="3" width="2.5" height="20" rx="1.25" fill="#fff" opacity="0.9"/></svg>
      原点智学
    </a>
    <a href="/errors.html" class="nav-a on">错题本</a>
    <a href="/quiz.html" class="nav-a">每日一题</a>
    <a href="/progress.html" class="nav-a">成长档案</a>
    <a href="/study-tools.html" class="nav-a">工具</a>
  </div>
</nav>

<div class="wrap">

  <div class="head">
    <div class="h-title">错题本<small>错的不是失败，是下次能多得的分</small></div>
  </div>

  <div class="intro">
    <b>规则：</b>quiz 评「做错了」、error-practice 手动标记、exam-diagnosis 推送，都进同一个池。每条按 FSRS 简化版排期：首次 24h 后到期，「记得了」+1 阶 (1d→3d→7d→15d→30d)，「还不会」回 0 阶。同一道题不再白错。
  </div>

  <div class="stats">
    <div class="stat-card tot"><div class="sn" id="st-total">0</div><div class="sl">总错题</div></div>
    <div class="stat-card due"><div class="sn" id="st-due">0</div><div class="sl">今日到期</div></div>
    <div class="stat-card tdy"><div class="sn" id="st-today">0</div><div class="sl">今日新增</div></div>
    <div class="stat-card mas"><div class="sn" id="st-mas">0</div><div class="sl">已掌握(≥3 阶)</div></div>
  </div>

  <div class="filter" id="filter"></div>

  <div class="list" id="list"></div>

</div>

<script src="/src/learning-store.js"></script>
<script>
const SUBJ_ZH = { math:'数学', physics:'物理', chemistry:'化学', biology:'生物', chinese:'语文', english:'英语', history:'历史', geography:'地理', politics:'政治', moral:'道法' };
const SOURCE_ZH = { 'quiz':'每日一题', 'error-practice':'举一反三', 'error-mastery':'错题攻克', 'exam-diagnosis':'考试诊断', 'essay-grading':'作文批改' };

let FILTER = { subject: '', view: 'due' }; // view: due | all | mastered

function $(id){ return document.getElementById(id); }
function escHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; });
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function dayKey(ts){ return new Date(ts).toISOString().slice(0,10); }
function dueLabel(e){
  const now = Date.now();
  const next = e.nextReviewAt || 0;
  if (next <= now) return { txt: '到期', cls: 'm-due' };
  const days = Math.round((next - now) / 86400000);
  if (days <= 1) return { txt: '< 1 天', cls: 'm-soon' };
  return { txt: days + ' 天后', cls: 'm-later' };
}

function loadStats(){
  if (!window.LearningStore){ return; }
  const all = window.LearningStore.getErrors();
  const now = Date.now();
  const today = todayKey();
  const due = all.filter(function(e){ return (e.nextReviewAt || 0) <= now; });
  const todayNew = all.filter(function(e){ return dayKey(e.timestamp || 0) === today; });
  const mastered = all.filter(function(e){ return (e.reviewCount || 0) >= 3; });
  $('st-total').textContent = all.length;
  $('st-due').textContent = due.length;
  $('st-today').textContent = todayNew.length;
  $('st-mas').textContent = mastered.length;
}

function renderFilter(){
  const subjs = ['', 'math','physics','chemistry','biology','chinese','history','geography','politics'];
  let h = '<div class="fl-grp">';
  ['due','all','mastered'].forEach(function(v){
    const lbl = v === 'due' ? '🔥 今日到期' : v === 'all' ? '全部' : '🌳 已掌握';
    h += '<button data-view="' + v + '" class="' + (FILTER.view === v ? 'on' : '') + '">' + lbl + '</button>';
  });
  h += '</div><div class="fl-grp">';
  subjs.forEach(function(sk){
    h += '<button data-subject="' + sk + '" class="' + (FILTER.subject === sk ? 'on' : '') + '">' + (sk ? SUBJ_ZH[sk] : '全学科') + '</button>';
  });
  h += '</div>';
  $('filter').innerHTML = h;
  document.querySelectorAll('[data-view]').forEach(function(b){
    b.addEventListener('click', function(){ FILTER.view = b.dataset.view; renderFilter(); renderList(); });
  });
  document.querySelectorAll('[data-subject]').forEach(function(b){
    b.addEventListener('click', function(){ FILTER.subject = b.dataset.subject; renderFilter(); renderList(); });
  });
}

function renderList(){
  const list = $('list');
  if (!window.LearningStore){
    list.innerHTML = '<div class="empty"><b>错题池模块未加载</b>请刷新页面 · 如果仍然失败请清缓存</div>';
    return;
  }
  let pool = window.LearningStore.getErrors({ subject: FILTER.subject || undefined });
  const now = Date.now();
  if (FILTER.view === 'due') pool = pool.filter(function(e){ return (e.nextReviewAt || 0) <= now && (e.reviewCount || 0) < 3; });
  else if (FILTER.view === 'mastered') pool = pool.filter(function(e){ return (e.reviewCount || 0) >= 3; });
  // 排序：到期最近 → 最远；同到期，新错先看
  pool.sort(function(a, b){
    const da = (a.nextReviewAt || 0), db = (b.nextReviewAt || 0);
    if (da !== db) return da - db;
    return (b.timestamp || 0) - (a.timestamp || 0);
  });
  if (!pool.length){
    if (FILTER.view === 'due'){
      list.innerHTML = '<div class="empty"><b>🎉 没有到期错题</b>所有题都还在间隔期 · 去 <a href="/quiz.html">每日一题</a> 刷新错题</div>';
    } else if (FILTER.view === 'mastered'){
      list.innerHTML = '<div class="empty"><b>还没有已掌握的错题</b>每条错题做对 3 次以上自动归入这里</div>';
    } else {
      list.innerHTML = '<div class="empty"><b>错题本是空的</b>去 <a href="/quiz.html">每日一题</a> 标几道，或在 <a href="/tools/error-practice">举一反三</a> 直接录入</div>';
    }
    return;
  }
  let h = '';
  pool.forEach(function(e, idx){
    const due = dueLabel(e);
    const isDue = (e.nextReviewAt || 0) <= now;
    const isMas = (e.reviewCount || 0) >= 3;
    const cls = isMas ? 'future' : (isDue ? 'due' : '');
    const subjZh = SUBJ_ZH[e.subject] || e.subjectZh || e.subject || '';
    const srcZh = SOURCE_ZH[e.source] || e.source || '';
    const reviewN = e.reviewCount || 0;
    const qText = (e.question || '').slice(0, 600);
    const longQ = (e.question || '').length > 240;
    const qHref = e.source === 'quiz' && e.quizId ? '/quiz.html#q=' + e.quizId : null;
    h += '<div class="item ' + cls + '" data-id="' + e.id + '">';
    h += '<div class="item-meta">';
    if (subjZh) h += '<span class="m-subj">' + escHtml(subjZh) + '</span>';
    if (srcZh) h += '<span class="m-src">来自 ' + escHtml(srcZh) + '</span>';
    if (e.keyword) h += '<span class="m-tag">' + escHtml(e.keyword) + '</span>';
    h += '<span class="' + due.cls + '" style="font-size:11px;padding:3px 9px;border-radius:100px;font-weight:600">' + due.txt + '</span>';
    h += '<span class="m-later">复习 ' + reviewN + ' 次</span>';
    h += '</div>';
    h += '<div class="item-q ' + (longQ ? 'fade' : '') + '" id="q-' + idx + '">' + escHtml(qText) + '</div>';
    if (longQ) h += '<div class="item-expand" onclick="this.previousElementSibling.classList.toggle(\'expanded\');this.previousElementSibling.classList.remove(\'fade\');this.style.display=\'none\'">展开全文</div>';
    if (e.correctAnswer) h += '<div class="item-ans"><b>正确答案：</b>' + escHtml(e.correctAnswer) + '</div>';
    if (e.explanation) h += '<div class="item-exp">' + escHtml(e.explanation.slice(0, 400)) + (e.explanation.length > 400 ? '...' : '') + '</div>';
    h += '<div class="item-actions">';
    if (isDue && !isMas){
      h += '<button class="btn btn-ok" data-act="ok" data-id="' + e.id + '">✓ 记得了</button>';
      h += '<button class="btn btn-no" data-act="no" data-id="' + e.id + '">✗ 还不会</button>';
    }
    if (qHref) h += '<a class="btn" href="' + qHref + '" target="_blank">回到原题 →</a>';
    if (e.textbookPath && e.textbookCh != null){
      h += '<a class="btn" href="/tools/textbook-browser?book=' + encodeURIComponent(e.textbookPath) + '&ch=' + e.textbookCh + '" target="_blank">📖 看课本</a>';
    }
    h += '<a class="btn btn-amber" href="/tools/error-mastery?prefill=' + encodeURIComponent((e.question || '').slice(0,400)) + '" target="_blank">🤖 AI 深度分析</a>';
    h += '<span class="spacer"></span>';
    h += '<button class="del" data-act="del" data-id="' + e.id + '">删除</button>';
    h += '</div>';
    h += '</div>';
  });
  list.innerHTML = h;
  document.querySelectorAll('[data-act]').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      const id = b.dataset.id, act = b.dataset.act;
      if (act === 'del'){
        if (!confirm('确定删除这道错题？删除后不可恢复。')) return;
        window.LearningStore.deleteError(id);
      } else if (act === 'ok'){
        window.LearningStore.markErrorReviewed(id, true);
      } else if (act === 'no'){
        window.LearningStore.markErrorReviewed(id, false);
      }
      loadStats();
      renderList();
    });
  });
}
(function init(){
  if (!window.LearningStore){
    $('list').innerHTML = '<div class="empty"><b>错题池模块未加载</b>请刷新页面</div>';
    return;
  }
  loadStats();
  renderFilter();
  renderList();
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F4F3D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='none' stroke='%231A1A1A' stroke-width='5'/><circle cx='50' cy='50' r='14' fill='%230F4F3D'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.cnpmjs.org/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap">
<title>原点 25 分钟闭环 · 一元一次方程</title>
<meta name="description" content="单知识点 25 分钟从入门到精通，原点 AI 私教学习闭环">
<style>
:root {
    /* v2 design tokens（米白底+墨绿+砖红，附加，不破坏 legacy）*/
    --accent-primary: #0F4F3D;
    --accent-hover: #0A3D2E;
    --accent-warm: #B85C2E;
    --bg-primary: #FAF7F0;
    --text-primary: #1A1A1A;
    --font-serif-sc: "Noto Serif SC", ui-serif, Georgia, serif;
    --font-serif-en: "Instrument Serif", ui-serif, Georgia, serif;

    /* legacy 名字保留，值改写为 v2 米白底语义（dark→light 反转）*/
    --c-ink: #FAF7F0;            /* 主背景：米白（原 #1A1A2E dark navy 反转）*/
    --c-ink-light: #FFFFFF;      /* 次背景/卡片：纯白（原 #16213E）*/
    --c-ink-surface: #F4F1EC;    /* 略沉一档暖白：高亮区（原 #0F3460）*/
    --c-origin: #0F4F3D;         /* 强调色：墨绿（原橙 #0F4F3D）*/
    --c-origin-soft: #0F4F3D;    /* 软强调：墨绿（原橙 #FF6B4A）*/
    --c-origin-glow: rgba(15,79,61,0.12);
    --c-warm-white: #1A1A1A;     /* 主字色：墨黑（原浅米 #F5F0EB 反转为字色）*/
    --c-warm-gray: #4A4A47;      /* 次字色 */
    --c-warm-dim: #7A7570;       /* 辅助小字 */
    --c-success: #2D9F6F;        /* 成功保留绿 */
    --c-warning: #B85C2E;        /* 警告：砖红（原 amber #D4A843）*/
    --c-error: #C94040;          /* 错误保留红 */
    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 12px;
    --shadow-card: 0 1px 3px rgba(26,26,26,0.06);
    --shadow-hover: 0 4px 12px rgba(26,26,26,0.10);
    --shadow-cta: 0 4px 16px rgba(15,79,61,0.20);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-serif-sc); font-weight: 500; }
h1 { letter-spacing: 0.02em; }
.container { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }

/* 头部 */
.hero {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid rgba(26,26,26,0.08);
}
.hero .topic-tag {
    display: inline-block;
    padding: 4px 12px;
    background: var(--c-origin-glow);
    color: var(--c-origin-soft);
    font-size: 0.8rem;
    border-radius: var(--r-sm);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
}
.hero h1 { font-size: 1.75rem; margin-bottom: 6px; }
.hero p { color: var(--c-warm-gray); font-size: 0.95rem; }

/* 进度条 */
.progress-block { padding: 24px 0 16px; }
.progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.875rem;
}
.progress-meta .step { color: var(--c-warm-gray); }
.progress-meta .level {
    font-family: "Noto Serif SC", serif;
    font-weight: 700;
    color: var(--c-origin-soft);
    font-size: 1rem;
    transition: color 0.4s ease;
}
.bar-track {
    height: 12px;
    background: var(--c-ink-surface);
    border-radius: var(--r-pill, 100px);
    overflow: hidden;
    position: relative;
}
.bar-fill {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, var(--c-origin), var(--c-origin-soft));
    border-radius: 100px;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.threshold-marker {
    position: absolute;
    top: -3px;
    bottom: -3px;
    left: 90%;
    width: 2px;
    background: var(--c-warning);
    opacity: 0.7;
}
.threshold-label {
    position: absolute;
    top: -22px;
    left: calc(90% - 18px);
    font-size: 0.72rem;
    color: var(--c-warning);
}

/* 题卡 */
.question-card {
    background: var(--c-ink-light);
    border: 1px solid rgba(26,26,26,0.08);
    border-radius: var(--r-lg);
    padding: 28px 24px;
    margin-top: 24px;
    box-shadow: var(--shadow-card);
}
.q-difficulty {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    color: var(--c-warm-dim);
    margin-bottom: 12px;
}
.q-difficulty .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-warm-dim); }
.q-difficulty .dot.on { background: var(--c-origin); }
.q-stem {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.5;
}
.q-input-row {
    display: flex;
    gap: 10px;
    align-items: center;
}
.q-input-row label { color: var(--c-warm-gray); font-size: 0.95rem; }
.q-input {
    flex: 1;
    background: #FFFFFF;
    border: 1px solid rgba(26,26,26,0.12);
    color: var(--c-warm-white);
    padding: 10px 14px;
    font-size: 1rem;
    border-radius: var(--r-md);
    font-family: inherit;
}
.q-input:focus {
    outline: none;
    border-color: var(--c-origin);
    box-shadow: 0 0 0 3px var(--c-origin-glow);
}
.btn-submit {
    background: linear-gradient(135deg, var(--c-origin), var(--c-origin-soft));
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: var(--r-md);
    cursor: pointer;
    box-shadow: var(--shadow-cta);
    font-family: inherit;
    transition: transform 0.2s ease;
}
.btn-submit:hover:not(:disabled) { transform: scale(1.02); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

/* 反馈区 */
.feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: var(--r-md);
    border-left: 3px solid;
    font-size: 0.95rem;
    line-height: 1.6;
    display: none;
}
.feedback.correct { background: rgba(45,159,111,0.1); border-color: var(--c-success); color: var(--c-warm-white); }
.feedback.wrong { background: rgba(201,64,64,0.1); border-color: var(--c-error); color: var(--c-warm-white); }
.feedback h4 { font-size: 0.95rem; margin-bottom: 6px; }
.feedback .socratic { color: var(--c-warm-gray); font-size: 0.88rem; margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(26,26,26,0.10); }
.feedback .delta {
    display: inline-block;
    margin-left: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--c-origin-soft);
}
.feedback .ask-tutor-btn {
    display: inline-flex;align-items:center;gap:6px;
    margin-top: 10px;padding: 8px 14px;
    background: linear-gradient(135deg,#0F4F3D,#0A3D2E);
    color: #fff;border: none;border-radius: 100px;
    font-size: 0.84rem;font-weight: 600;cursor: pointer;
    font-family: inherit;transition: transform 0.12s;
    box-shadow: 0 2px 8px rgba(15,79,61,0.30);
}
.feedback .ask-tutor-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(15,79,61,0.40); }
.feedback .ask-tutor-btn::before { content: "原"; display:inline-flex;align-items:center;justify-content:center;
    width: 18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.25);
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:11px; }

/* ─── mini-tutor 浮窗（答错弹出，不离开当前题）─── */
.mini-tutor {
    position: fixed; right: 20px; bottom: 20px;
    width: 360px; height: 520px; max-height: 70vh;
    background: #FAF7F0; color: #18181B;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
    display: none; flex-direction: column;
    z-index: 1000;
    animation: mtIn 0.22s ease-out;
    font-family: "Noto Sans SC", sans-serif;
}
@keyframes mtIn { from { opacity:0; transform: translateY(20px) scale(0.96);} to { opacity:1; transform: translateY(0) scale(1);} }
.mini-tutor.open { display: flex; }
.mt-head { display:flex;align-items:center;gap:10px;padding:14px 16px;
    background: linear-gradient(135deg,#F4F1EC,#FAF7F0);border-bottom:1px solid #E7E5DF; }
.mt-av { width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,#0F4F3D,#0A3D2E);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:0.9rem;
    box-shadow: 0 2px 6px rgba(15,79,61,0.25); }
.mt-title { flex:1; min-width:0; }
.mt-title .nm { font-size:0.92rem;font-weight:700;color:#18181B;line-height:1.2; }
.mt-title .ctx { font-size:0.72rem;color:#71717A;margin-top:2px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.mt-close { background:none;border:none;color:#71717A;font-size:1.4rem;cursor:pointer;
    width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    transition:all 0.12s; }
.mt-close:hover { background:rgba(0,0,0,0.06);color:#18181B; }
.mt-body { flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;
    background: #FBFAF6; }
.mt-bub { animation: mtBub 0.18s ease-out; max-width:85%; }
@keyframes mtBub { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.mt-bub.tutor { align-self:flex-start;background:#fff;border:1px solid #E7E5DF;
    padding:10px 13px;border-radius:4px 14px 14px 14px;font-size:0.88rem;line-height:1.65;
    color:#18181B;white-space:pre-wrap;word-break:break-word; }
.mt-bub.student { align-self:flex-end;background:#0F4F3D;color:#fff;
    padding:10px 13px;border-radius:14px 14px 4px 14px;font-size:0.88rem;line-height:1.55; }
.mt-input-row { display:flex;gap:6px;padding:10px 12px;border-top:1px solid #E7E5DF;background:#fff; }
.mt-input { flex:1;border:1px solid #D4D2CC;border-radius:18px;padding:8px 14px;
    font-size:0.88rem;outline:none;font-family:inherit;color:#18181B;background:#FBFAF6; }
.mt-input:focus { border-color:#0F4F3D;background:#fff; }
.mt-send { background:#0F4F3D;color:#fff;border:none;width:34px;height:34px;border-radius:50%;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;
    transition:transform 0.12s; }
.mt-send:hover { transform:scale(1.06); }
.mt-send:disabled { background:#D4D2CC;cursor:not-allowed;transform:none; }
.mt-dots span { display:inline-block;width:5px;height:5px;border-radius:50%;background:#A1A1AA;
    margin-right:3px;animation:mtDot 1.2s infinite; }
.mt-dots span:nth-child(2){animation-delay:0.15s}
.mt-dots span:nth-child(3){animation-delay:0.30s}
@keyframes mtDot { 0%,60%,100%{opacity:0.3} 30%{opacity:1} }
@media (max-width: 480px) {
    .mini-tutor { right: 8px; left: 8px; bottom: 8px; width: auto; height: 80vh; }
}

/* 控制按钮组 */
.actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 18px;
}
.btn-secondary {
    background: transparent;
    color: var(--c-warm-gray);
    border: 1px solid rgba(26,26,26,0.12);
    padding: 8px 16px;
    border-radius: var(--r-md);
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
}
.btn-secondary:hover { color: var(--c-warm-white); border-color: var(--c-warm-gray); }

/* 结业 */
.completion {
    background: linear-gradient(135deg, var(--c-ink-light), var(--c-ink-surface));
    border: 1px solid var(--c-origin);
    border-radius: var(--r-lg);
    padding: 36px 24px;
    margin-top: 24px;
    text-align: center;
    display: none;
    position: relative;
    overflow: hidden;
}
.completion h2 { font-size: 1.6rem; margin-bottom: 8px; color: var(--c-origin-soft); position: relative; z-index: 2; }
.completion p { color: var(--c-warm-gray); margin-bottom: 16px; position: relative; z-index: 2; }
.completion .stats { display: flex; gap: 24px; justify-content: center; margin: 16px 0; position: relative; z-index: 2; }
.completion .stat { text-align: center; }
.completion .stat-num { font-size: 1.8rem; font-weight: 800; color: var(--c-origin-soft); font-family: "Noto Serif SC", serif; }
.completion .stat-label { font-size: 0.78rem; color: var(--c-warm-dim); }

/* 出师奖章（学习段位完成）*/
.medal {
    width: 96px; height: 96px;
    margin: 0 auto 16px;
    position: relative;
    z-index: 2;
    animation: medal-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.medal svg { width: 100%; height: 100%; filter: drop-shadow(0 0 20px rgba(15,79,61,0.45)); }
.medal .star { fill: url(#medal-grad); animation: medal-spin 8s linear infinite; transform-origin: center; transform-box: fill-box; }
.medal .core { fill: var(--c-origin); }
.medal .label { fill: white; font-family: "Noto Serif SC", serif; font-weight: 800; }
@keyframes medal-in { from { transform: scale(0) rotate(-180deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes medal-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* 烟花光圈 */
.fireworks {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    pointer-events: none;
    background:
        radial-gradient(circle at 20% 30%, rgba(15,79,61,0.14), transparent 30%),
        radial-gradient(circle at 80% 60%, rgba(45,159,111,0.12), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(184,92,46,0.12), transparent 35%);
    animation: fireworks-pulse 3s ease-in-out infinite;
}
@keyframes fireworks-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

.completion .actions-final { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; position: relative; z-index: 2; }
.btn-flex {
    background: rgba(26,26,26,0.04);
    color: var(--c-warm-white);
    border: 1px solid rgba(26,26,26,0.10);
    padding: 10px 18px;
    font-size: 0.9rem;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
}
.btn-flex:hover { background: rgba(26,26,26,0.08); }

/* 炫耀分享弹窗 */
.brag-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    padding: 20px;
    align-items: center;
    justify-content: center;
}
.brag-modal.show { display: flex; }
.brag-card {
    background: linear-gradient(165deg, #0F4F3D 0%, #0A3D2E 60%, #B85C2E 200%);
    border-radius: 16px;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 3 / 4;
    padding: 32px 24px;
    color: white;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.brag-card::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(184,92,46,0.45) 0%, transparent 70%);
    border-radius: 50%;
}
.brag-card::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(250,247,240,0.18) 0%, transparent 70%);
    border-radius: 50%;
}
.brag-card .top-row { display: flex; align-items: center; gap: 8px; position: relative; z-index: 2; }
.brag-card .top-row .badge { font-family: "Noto Serif SC", serif; font-weight: 800; font-size: 0.92rem; opacity: 0.85; }
.brag-card .center-block { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
.brag-card .level-tag { font-family: "Noto Serif SC", serif; font-size: 1.05rem; color: #FAF7F0; opacity: 0.85; margin-bottom: 8px; }
.brag-card .child { font-family: "Noto Serif SC", serif; font-size: 1.85rem; font-weight: 800; line-height: 1.2; }
.brag-card .achievement { font-size: 1rem; line-height: 1.6; margin-top: 14px; opacity: 0.95; }
.brag-card .meta-row { display: flex; gap: 14px; margin-top: 18px; position: relative; z-index: 2; }
.brag-card .meta-item .v { font-size: 1.45rem; font-weight: 800; font-family: "Noto Serif SC", serif; }
.brag-card .meta-item .k { font-size: 0.7rem; opacity: 0.7; margin-top: 2px; }
.brag-card .footer { font-size: 0.72rem; opacity: 0.7; text-align: center; margin-top: 12px; position: relative; z-index: 2; }
.brag-actions { display: flex; gap: 10px; margin-top: 14px; }
.brag-actions button {
    flex: 1;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 10px;
    font-size: 0.88rem;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
}
.brag-actions button.primary { background: white; color: #1A1A1A; font-weight: 700; }
.brag-modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
}

/* 调试 */
.debug-log {
    margin-top: 32px;
    padding: 12px;
    background: rgba(26,26,26,0.04);
    border: 1px solid rgba(26,26,26,0.08);
    border-radius: var(--r-md);
    font-family: "DM Mono", "Courier New", monospace;
    font-size: 0.78rem;
    color: var(--c-warm-dim);
    max-height: 180px;
    overflow-y: auto;
    display: none;
}
.debug-toggle {
    margin-top: 16px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--c-warm-dim);
    cursor: pointer;
}
.debug-toggle:hover { color: var(--c-warm-gray); }

@media (max-width: 480px) {
    .hero h1 { font-size: 1.4rem; }
    .q-stem { font-size: 1.05rem; }
    .q-input-row { flex-direction: column; align-items: stretch; }
    .btn-submit { width: 100%; }
}
</style>
</head>
<body>
<div class="container">

    <header class="hero">
        <span class="topic-tag">单知识点 · 25 分钟</span>
        <h1>一元一次方程</h1>
        <p>从入门到出师，看你这一道关</p>
    </header>

    <section class="progress-block">
        <div class="progress-meta">
            <span class="step" id="step-meta">第 1 / 5 题</span>
            <span class="level" id="level-tag">入门</span>
        </div>
        <div class="bar-track">
            <span class="threshold-label">过关 90%</span>
            <div class="threshold-marker"></div>
            <div class="bar-fill" id="bar"></div>
        </div>
    </section>

    <section class="question-card" id="qcard">
        <!-- 「AI 记得你」记忆提示（fire-and-forget，无记忆时隐藏）-->
        <div id="memory-hint" style="display:none; padding: 10px 12px; background: rgba(184,92,46,0.10); border-left: 3px solid var(--c-warning); border-radius: 4px; margin-bottom: 12px; font-size: 0.85rem; color: var(--c-warm-gray);">
            <span style="color: var(--c-warning); font-weight: 600;">📌 我记得</span>
            <span id="memory-text"></span>
        </div>
        <div class="q-difficulty" id="diff-meta"></div>
        <div class="q-stem" id="qstem">加载中...</div>
        <div class="q-input-row">
            <label for="answer">答案：</label>
            <input class="q-input" id="answer" type="text" placeholder="输入数值或表达式" autocomplete="off">
            <button class="btn-submit" id="submit-btn">提交</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
            <button class="btn-secondary" id="next-btn" style="display:none;">下一题 →</button>
        </div>
    </section>

    <section class="completion" id="completion">

    if (profile.dominant_emotion === '焦虑' || profile.dominant_emotion === '沮丧') {
        parts.push(`这次慢一点没事`);

    if (!parts.length) { el.style.display = 'none'; return; }

    el.style.display = 'block';
}

// 开新题前拉「学生跨会话记忆」（fire-and-forget）
async function recallStudentMemory(question_stem) {
    try {
        const r = await fetch('/api/student-memory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                student_id: STUDENT_ID,
                query: question_stem,
                top_k: 3,
                include_profile: true,
            })
        });
        if (!r.ok) { logDebug(`! memory ${r.status}`); return null; }
        const d = await r.json();
        if (d.memory_count > 0) {
            logDebug(`✓ memory recalled ${d.memory_count} 条 · 主导情绪 ${d.signal_profile?.dominant_emotion || '-'}`);
            // UI 显示「AI 记得你」提示
            renderMemoryHint(d);
        } else {
            logDebug(`· memory 空（首次或对话不足）`);
            document.getElementById('memory-hint').style.display = 'none';
        }
        state.recalled_memory = d;
        return d;
    } catch (e) { return null; }
}

            <input class="q-input" id="answer" type="text" placeholder="输入数值或表达式" autocomplete="off">
            <button class="btn-submit" id="submit-btn">提交</button>
        `;
        const ansEl = document.getElementById('answer');
        ansEl.value = '';
        ansEl.focus();
        ansEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (document.getElementById('next-btn').style.display !== 'none') onNext();

        });
        document.getElementById('submit-btn').addEventListener('click', onSubmit);
    }
    state._mcqPick = null;

    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    state.questionStartedAt = Date.now();
}

function checkAnswer(submitted, correct) {
    const norm = s => String(s == null ? '' : s)
        .trim()
        .replace(/\s/g, '')
        .replace(/。$/, '')
        .replace(/[xX]\s*=\s*/, '')
        .toUpperCase();   // mcq 'a' = 'A'
    return norm(submitted) === norm(correct);
}

// fire-and-forget 写 FSRS state（每答一题更新 student_states.fsrs_state）

// 调 /api/diagnose 拿真 LLM 64 类归因（答错时使用）
async function callDiagnose(problem, correctAnswer, studentResponse) {
    logDebug(`POST /api/diagnose problem="${problem.slice(0, 30)}..."`);
    try {
        const r = await fetch('/api/diagnose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                subject: SUBJECT,
                problem,
                correct_answer: correctAnswer,
                student_response: studentResponse
            })
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        logDebug(`← diagnose verdict=${data.verdict} l1=${data.l1_tag} confidence=${data.confidence || '-'}`);
        return data;
    } catch (e) {
        logDebug(`! diagnose failed: ${e.message}, 用本地 hint 兜底`);
        return null;
    }
}

async function callBKT(isCorrect, difficulty, discrimination, timeMs) {
    const attempt = { is_correct: isCorrect, time_spent_ms: timeMs };
    if (difficulty != null)     attempt.difficulty = difficulty;
    if (discrimination != null) attempt.discrimination = discrimination;
    const body = {
        current_mastery: state.mastery,
        attempts: [attempt]
    };
    logDebug(`POST /api/bkt mastery_in=${state.mastery.toFixed(3)} correct=${isCorrect} d=${difficulty} a=${discrimination} t=${timeMs}ms`);
    try {
        const r = await fetch('/api/bkt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        logDebug(`← mastery_out=${data.final_mastery} mastered=${data.mastered}`);
        return data;
    } catch (e) {
        logDebug(`! BKT failed: ${e.message}, 用本地兜底`);
        return localBKT(state.mastery, isCorrect, difficulty, timeMs);
    }
}

// 本地兜底（API 不通时也能演示）
function localBKT(prior, isCorrect, difficulty, timeMs) {
    let { learn, guess, slip } = { learn: 0.15, guess: 0.2, slip: 0.1 };
    const d = difficulty != null ? difficulty : 0.5;
    if (isCorrect) guess *= (1 - 0.5 * d); else slip *= (1 - 0.5 * d);
    if (isCorrect && timeMs && timeMs > 60000) slip += Math.min(1, (timeMs - 60000) / 60000) * 0.1;
    let posterior;
    if (isCorrect) posterior = prior * (1 - slip) / (prior * (1 - slip) + (1 - prior) * guess);
    else posterior = prior * slip / (prior * slip + (1 - prior) * (1 - guess));
    const next = posterior + (1 - posterior) * learn;
    return { final_mastery: Math.round(next * 1000) / 1000, mastered: next >= 0.9 };
}

async function onSubmit() {
    const q = QUESTIONS[state.idx];
    const isMcq = q.type === 'mcq' && q.options;
    let submitted;
    if (isMcq) {
        submitted = state._mcqPick;
        if (!submitted) return;  // 没选不提交
    } else {
        const answerEl = document.getElementById('answer');
        submitted = answerEl ? answerEl.value.trim() : '';
        if (!submitted) { if (answerEl) answerEl.focus(); return; }
    }
    const isCorrect = checkAnswer(submitted, q.answer);
    const timeMs = Date.now() - state.questionStartedAt;
    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) submitBtn.disabled = true;
    if (isMcq) {
        document.querySelectorAll('.mcq-opt').forEach(b => b.disabled = true);
    }

    const prevMastery = state.mastery;
    // 答对：只调 BKT；答错：BKT + diagnose 并行
    const tasks = [callBKT(isCorrect, q.difficulty, q.discrimination, timeMs)];
    if (!isCorrect) tasks.push(callDiagnose(q.stem, q.answer, submitted));
    const [result, diagnose] = await Promise.all(tasks);

    state.mastery = result.final_mastery;
    state.attempts.push({
        qid: q.id, is_correct: isCorrect, mastery_after: state.mastery, time_ms: timeMs,
        diagnose: diagnose ? { l1: diagnose.l1_tag, l3: diagnose.l3_tag, root_cause: diagnose.root_cause } : null
    });
    if (isCorrect) state.correctCount++;

    // fire-and-forget 写库：不阻塞 UI，失败仅日志
    ingestAttempt({
        student_id: STUDENT_ID,
        question_stem: q.stem,
        topic_id: TOPIC_CODE,
        topic_code: TOPIC_CODE,
        is_correct: isCorrect,
        response: submitted,
        time_spent_ms: timeMs,
        difficulty: q.difficulty,
        mastery_before: prevMastery,
        mastery_after: state.mastery,
        diagnose_l3: diagnose?.l3_tag || null,
    });
    // 同步走 FSRS（每答一题更新 fsrs_state，把错题入复习队列）
    fsrsUpdateAttempt(TOPIC_CODE, isCorrect, timeMs, isCorrect ? 'none' : 'medium', state.mastery);
    if (!isCorrect && diagnose) {
        logDialogue({
            student_id: STUDENT_ID, role: 'system', kind: 'diagnose_call',
            content: diagnose.root_cause || '错题归因结果',
            meta: { l1_tag: diagnose.l1_tag, l3_tag: diagnose.l3_tag, suggested_drill: diagnose.suggested_drill, confidence: diagnose.confidence },
            topic_id: TOPIC,
        });
    }

    updateProgress(state.mastery);
    showFeedback(q, isCorrect, submitted, prevMastery, state.mastery, diagnose);

    // P1-4 · 同型连错 3 次自动 escalate（streak_3_wrong）
    // 触发条件：最近 3 次 attempts 全是 wrong + 同 l1 类目 + 防 30min 内重复触发
    autoStreakEscalate(diagnose);

    if (state.mastery >= 0.9 || state.idx >= QUESTIONS.length - 1) {
        document.getElementById('next-btn').textContent = '完成 →';
    }
    document.getElementById('next-btn').style.display = '';
    document.getElementById('next-btn').focus();
}

// ─── P1-4 同型连错自动求助学长 ──────────────
function autoStreakEscalate(latestDiagnose) {
    const recent3 = state.attempts.slice(-3);
    if (recent3.length < 3) return;
    if (recent3.some(a => a.is_correct)) return;  // 必须连续 3 错
    // 同 l1 类目（concept/ability/metacog/careless）
    const l1Set = new Set(recent3.map(a => a.diagnose?.l1).filter(Boolean));
    if (l1Set.size > 1) return;  // 不是同类问题就不 escalate
    // 防重复：30 分钟内同 KP 不重复 escalate
    const lastKey = `yd:streak_esc:${TOPIC_CODE}`;
    const lastAt = parseInt(sessionStorage.getItem(lastKey) || '0');
    if (Date.now() - lastAt < 30 * 60 * 1000) return;
    sessionStorage.setItem(lastKey, String(Date.now()));

    const l3Tags = recent3.flatMap(a => a.diagnose?.l3 || []).filter(Boolean);
    const rootCauses = recent3.map(a => a.diagnose?.root_cause).filter(Boolean);
    const wrongResponses = recent3.map(a => state.questions[state.idx - (recent3.length - 1 - recent3.indexOf(a))]?.userAnswer || '');

    // 静默 fire-and-forget
    fetch('/api/escalate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            student_id: STUDENT_ID,
            kind: 'streak_3_wrong',
            student_message: `连续 3 道同类型错：${state.questions[state.idx]?.stem || ''}`,
            topic_code: TOPIC_CODE,
            ai_summary: `同型连错 3 次 · l3 标签 ${l3Tags.slice(0, 3).join(' / ') || '未识别'} · 根因 ${rootCauses[rootCauses.length - 1] || '未抽取'}`,
            context: {
                recent_3_attempts: recent3.map(a => ({
                    is_correct: a.is_correct,
                    diagnose: a.diagnose,
                    mastery_after: a.mastery_after,
                })),
                current_kp: TOPIC_CODE,
                trigger: 'auto_streak_3_wrong',
            },
        }),
    }).then(r => r.json()).then(data => {
        if (data.ok) {
            const fb = document.getElementById('feedback');
            if (fb) {
                const note = document.createElement('div');
                note.className = 'streak-esc-note';
                note.style.cssText = 'margin-top:10px;padding:10px 12px;background:rgba(91,141,191,0.10);border-left:3px solid #5B8DBF;border-radius:8px;font-size:0.86rem;color:#5B8DBF;line-height:1.55;';
                note.innerHTML = `🔁 同类错了 3 次 · 我把这道转给学长录段讲解（${data.expected_response_minutes || 60} 分钟内发你）。等的时候咱继续做别的，不停下。`;
                fb.appendChild(note);
            }
        }
    }).catch(() => {});
}

function showFeedback(q, isCorrect, submitted, prev, now, diagnose) {
    const el = document.getElementById('feedback');
    const delta = (now - prev);
    const deltaText = delta >= 0 ? `+${delta.toFixed(3)}` : delta.toFixed(3);
    if (isCorrect) {
        el.className = 'feedback correct';
        const tail = q.stem.includes('：') ? q.stem.split('：').slice(1).join('：') : q.stem;
        el.innerHTML = `
            <h4>对了 <span class="delta">掌握度 ${deltaText}</span></h4>
            <div>${escapeHtml(tail)} 标准答案：${escapeHtml(q.answer)}。</div>
            <div class="socratic">想一想：为什么这一步是对的？下一题再来一次试试看。</div>
        `;
    } else {
        // 优先用 LLM 真归因，没有则退回本地 hint / explanation
        let socraticBlock;
        if (diagnose && diagnose.verdict === 'analyzed') {
            const tagPretty = (diagnose.l3_tag || []).map(t => t.split('.').pop().replace(/_/g, ' ')).join(' / ');
            socraticBlock = `
                <strong style="color:var(--c-warning);">根因：</strong>${escapeHtml(diagnose.root_cause || '—')}
                ${tagPretty ? `<br><span style="color:var(--c-warm-dim);font-size:0.8rem;">归因标签：${escapeHtml(tagPretty)}</span>` : ''}
                ${diagnose.suggested_drill ? `<br><strong style="color:var(--c-success);margin-top:6px;display:inline-block;">下一步练：</strong>${escapeHtml(diagnose.suggested_drill)}` : ''}
            `;
        } else {
            const fallbackHint = q.hint || q.explanation || '把已知条件再看一遍，从最容易的那一步开始。';
            socraticBlock = `${escapeHtml(fallbackHint)}<br>没事，方程不是死记答案，我们慢慢搭路径。`;
        }
        el.className = 'feedback wrong';
        el.innerHTML = `
            <h4>这一步还差一点 <span class="delta" style="color:#C94040">${deltaText}</span></h4>
            <div>你写的：<code style="background:rgba(26,26,26,0.06);padding:2px 6px;border-radius:3px;">${escapeHtml(submitted)}</code>，正确答案是 ${q.answer}。</div>
            <div class="socratic">${socraticBlock}</div>
            <button class="ask-tutor-btn" onclick="openMiniTutor(${q.id ? `'${q.id}'` : 'null'})">让老师讲讲这题</button>
        `;
    }
    el.style.display = 'block';
}

// ─── mini-tutor 浮窗（P0-A 答错弹老师）─────────────
window.MT = { history: [], currentQ: null };

function openMiniTutor(qid) {
    const q = state.questions[state.idx];
    window.MT.currentQ = q;
    window.MT.history = [];

    let panel = document.getElementById('mini-tutor');
    if (!panel) {
        panel = document.createElement('div');
        panel.id = 'mini-tutor';
        panel.className = 'mini-tutor';
        panel.innerHTML = `
            <div class="mt-head">
                <div class="mt-av">原</div>
                <div class="mt-title">
                    <div class="nm">原小点 · 老师</div>
                    <div class="ctx" id="mt-ctx">这题：${escapeHtml((q.stem || '').slice(0, 40))}...</div>
                </div>
                <button class="mt-close" onclick="closeMiniTutor()" aria-label="关闭">×</button>
            </div>
            <div class="mt-body" id="mt-body"></div>
            <div class="mt-input-row">
                <input class="mt-input" id="mt-input" placeholder="说说你卡在哪一步…" autocomplete="off">
                <button class="mt-send" id="mt-send" aria-label="发送">→</button>
            </div>
        `;
        document.body.appendChild(panel);
        document.getElementById('mt-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); sendMiniTutor(); }
        });
        document.getElementById('mt-send').addEventListener('click', sendMiniTutor);
    } else {
        document.getElementById('mt-ctx').textContent = `这题：${(q.stem || '').slice(0, 40)}...`;
        document.getElementById('mt-body').innerHTML = '';
    }
    panel.classList.add('open');

    // 老师开场：直接基于当前错题进入引导
    const opener = `嗯，看到了。这题你写的「${q.userAnswer || state.attempts[state.attempts.length - 1]?.response || '...'}」差在哪——你做这题时第一步是怎么想的？`;
    appendMtBubble('tutor', opener);
    window.MT.history.push({ role: 'assistant', content: opener });
    setTimeout(() => document.getElementById('mt-input')?.focus(), 100);
}

function closeMiniTutor() {
    const panel = document.getElementById('mini-tutor');
    if (panel) panel.classList.remove('open');
}

function appendMtBubble(role, text) {
    const body = document.getElementById('mt-body');
    if (!body) return null;
    const b = document.createElement('div');
    b.className = 'mt-bub ' + role;
    b.textContent = text;
    body.appendChild(b);
    body.scrollTop = body.scrollHeight;
    return b;
}

async function sendMiniTutor() {
    const input = document.getElementById('mt-input');
    const send = document.getElementById('mt-send');
    const msg = input.value.trim();
    if (!msg) return;
    appendMtBubble('student', msg);
    window.MT.history.push({ role: 'user', content: msg });
    input.value = '';
    send.disabled = true;

    const tBub = appendMtBubble('tutor', '');
    tBub.innerHTML = '<span class="mt-dots"><span></span><span></span><span></span></span>';

    const q = window.MT.currentQ;
    const ctxPrefix = q ? `[当前题目：${q.stem}；正确答案 ${q.answer}；学生此前错答 ${q.userAnswer || '...'}] ` : '';

    let acc = '';
    try {
        const resp = await fetch('/api/tutor-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                student_id: STUDENT_ID,
                message: ctxPrefix + msg,
                topic_code: TOPIC_CODE,
                history: window.MT.history.slice(0, -1),
                mode: 'explain',
                prompt_version: 'v3',
                client_hour: new Date().getHours(),
            }),
        });
        if (!resp.ok) {
            tBub.textContent = resp.status === 429 ? '稍等一下再问' : `[出错 ${resp.status}]`;
            return;
        }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = line.slice(6).trim();
                if (!data || data === '[DONE]') continue;
                try {
                    const j = JSON.parse(data);
                    const delta = j.choices?.[0]?.delta?.content;
                    if (delta) {
                        acc += delta;
                        tBub.textContent = acc;
                        document.getElementById('mt-body').scrollTop = 9e9;
                    }
                } catch (e) {}
            }
        }
        if (acc) window.MT.history.push({ role: 'assistant', content: acc });
    } catch (e) {
        tBub.textContent = '[网络异常] ' + e.message;
    } finally {
        send.disabled = false;
        input.focus();
    }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

function onNext() {
    state.idx++;
    if (state.mastery >= 0.9 || state.idx >= QUESTIONS.length) {
        showCompletion();
    } else {
        renderQuestion();
    }
}

function showCompletion() {
    document.getElementById('qcard').style.display = 'none';
    document.getElementById('completion').style.display = 'block';
    const minutes = Math.round((Date.now() - state.sessionStartedAt) / 60000 * 10) / 10;
    document.getElementById('final-mastery').textContent = (state.mastery * 100).toFixed(0) + '%';
    document.getElementById('final-steps').textContent = state.attempts.length;
    document.getElementById('final-time').textContent = minutes;

    const isMastered = state.mastery >= 0.9;
    const lv = levelFor(state.mastery);

    // 出师时显示「下次复习时间」（FSRS 主动召回承诺）
    if (isMastered && state.fsrs_last && state.fsrs_last.days_until_next_review != null) {
        const days = state.fsrs_last.days_until_next_review;
        const completionText = document.getElementById('completion-text');
        const dayLabel = days < 1 ? '今天稍晚' : (days < 2 ? '明天' : `${Math.round(days)} 天后`);
        completionText.innerHTML = `${completionText.textContent} <br><span style="color: var(--c-warning); font-size: 0.85rem;">📅 ${dayLabel}我会带你回来重练，这次不用查复习清单。</span>`;
    }

    if (!isMastered) {
        // 未到出师：换个温和的奖章 + 文案
        document.getElementById('completion-h2').textContent = `今日 ${lv.name}`;
        document.getElementById('completion-h2').style.color = 'var(--c-warning)';
        document.getElementById('completion-text').textContent = '这一关还没破，错题进了你的复习库，明天再回来一次。';
        document.getElementById('medal').querySelector('text').textContent = lv.name;
        document.getElementById('medal').querySelector('.core').setAttribute('fill', '#B85C2E');
        document.getElementById('brag-trigger').style.display = 'none';
    } else {
        // 出师：备好分享卡数据
        document.getElementById('brag-mastery').textContent = (state.mastery * 100).toFixed(0) + '%';
        document.getElementById('brag-time').textContent = minutes;
        document.getElementById('brag-correct').textContent = `${state.correctCount}/${state.attempts.length}`;
        document.getElementById('brag-line').innerHTML = `今晚 ${minutes} 分钟，<br>把${TOPIC}从入门做到了出师。`;
        // AI 生成个性化金句（反 Khanmigo 无产出 · 给妈妈看具体进步点）
        fetchAchievementQuote(minutes).catch(() => {});
    }
}

// 从 attempts 抽 highlights：错→对的瞬间是最有产出价值的瞬间
function extractHighlights() {
    const out = [];
    let lastWrong = null;
    for (const a of state.attempts) {
        if (!a.is_correct && a.diagnose) {
            lastWrong = a.diagnose.l3 || a.diagnose.l1 || a.diagnose.root_cause;
        } else if (a.is_correct && lastWrong) {
            out.push({ step: lastWrong, from: '错', to: '对' });
            lastWrong = null;
        }
    }
    return out;
}

async function fetchAchievementQuote(minutes) {
    try {
        const r = await fetch('/api/achievement-quote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                student_id: STUDENT_ID,
                student_name: NAME && NAME !== '同学' ? NAME : '',  // 给金句生成用真名而不是泛称
                topic: TOPIC,
                minutes,
                attempts_count: state.attempts.length,
                correct_count: state.correctCount,
                final_mastery: state.mastery,
                highlights: extractHighlights(),
            }),
        });
        if (!r.ok) { logDebug && logDebug(`! achievement-quote HTTP ${r.status}`); return; }
        const data = await r.json();
        if (!data.ok) return;
        if (data.quote) {
            document.getElementById('brag-line').innerHTML =
                `「${data.quote}」<br><span style="font-size:0.78rem;opacity:0.75;font-weight:400;">${data.sub_quote || ''}</span>`;
        }
        if (data.share_for_mom) {
            // 留作给妈妈端的 share text，单独存到 dataset 供分享按钮使用
            const card = document.getElementById('brag-modal');
            if (card) card.dataset.shareForMom = data.share_for_mom;
            // 同时写 localStorage：parent-radar 同浏览器打开时能直接读最新金句给妈妈看（同设备扫码场景）
            try {
                localStorage.setItem('yd:lastQuote:' + STUDENT_ID, JSON.stringify({
                    topic: TOPIC,
                    quote: data.quote || '',
                    sub_quote: data.sub_quote || '',
                    share_for_mom: data.share_for_mom,
                    minutes,
                    mastery: state.mastery,
                    at: Date.now(),
                }));
            } catch (e) { /* localStorage 不可用就静默放弃 */ }
        }
    } catch (e) {
        logDebug && logDebug(`! achievement-quote err: ${e.message}`);
    }
}

// 炫耀按钮 + 截图保存
function setupBrag() {
    // 把孩子真名填进 brag-child（之前永远显示「小米同学」，URL ?name= 进不去）
    const childEl = document.getElementById('brag-child');
    if (childEl && NAME && NAME !== '同学') childEl.textContent = NAME + '同学';
    const trigger = document.getElementById('brag-trigger');
    if (!trigger) return;
    trigger.addEventListener('click', () => {
        document.getElementById('brag-modal').classList.add('show');
    });
    // 「看雷达」按钮把当前 STUDENT_ID + NAME 传过去（之前硬编码 demo-student-001 字符串）
    const radarBtn = document.getElementById('view-radar-btn');
    if (radarBtn) {
        radarBtn.addEventListener('click', () => {
            location.href = `/parent-radar.html?student_id=${encodeURIComponent(STUDENT_ID)}&name=${encodeURIComponent(NAME)}`;
        });
    }
    // 「问老师」按钮：练完题孩子想 follow-up 时直接进 tutor，不用回首页
    // 跨页 localStorage 桥已经把 STUDENT_ID 同步过去了，tutor 自动认人
    const askTutorBtn = document.getElementById('ask-tutor-btn');
    if (askTutorBtn) {
        askTutorBtn.addEventListener('click', () => {
            location.href = `/tutor.html?student_id=${encodeURIComponent(STUDENT_ID)}&name=${encodeURIComponent(NAME)}&topic_code=${encodeURIComponent(TOPIC_CODE)}`;
        });
    }
    const copyBtn = document.getElementById('copy-mom-btn');
    if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
            const card = document.getElementById('brag-modal');
            const txt = (card && card.dataset.shareForMom)
                || `他今晚把「${TOPIC}」从入门做到出师，掌握度 ${(state.mastery * 100).toFixed(0)}%`;
            try {
                await navigator.clipboard.writeText(txt);
                copyBtn.textContent = '✓ 已复制 · 粘到妈妈微信';
                setTimeout(() => { copyBtn.textContent = '📋 复制给妈妈看'; }, 2200);
            } catch (e) {
                copyBtn.textContent = '复制失败 · 长按文字选中';
            }
        });
    }
}
setupBrag();

// next-btn 是固定 DOM 元素，提交按钮和答案输入框由 renderQuestion 动态绑定
document.getElementById('next-btn').addEventListener('click', onNext);

// 拉真题：成功且 ≥ limit 题就替换 QUESTIONS，失败保留 fallback
async function loadQuestions() {
    try {
        const url = `/api/get-questions?topic_code=${encodeURIComponent(TOPIC_CODE)}&limit=5&difficulty_max=0.7`;
        const r = await fetch(url);
        if (!r.ok) {
            logDebug(`! get-questions HTTP ${r.status} · 用本地兜底 ${FALLBACK_QUESTIONS.length} 道`);
            return false;
        }
        const data = await r.json();
        const items = (data.items || []).filter(q => q.stem && q.answer != null);
        if (items.length >= 5) {
            QUESTIONS = items.slice(0, 5);
            logDebug(`✓ 真题 ${items.length} 道 · via=${data.via} kp=${data.kp_name || '-'}`);
            return true;
        }
        logDebug(`⚠️ 真题仅 ${items.length} 道 (<5) · 用本地兜底 ${FALLBACK_QUESTIONS.length} 道`);
        return false;
    } catch (e) {
        logDebug(`! get-questions network: ${e.message} · 用本地兜底`);
        return false;
    }
}

// 启动
updateProgress(state.mastery);
logDebug(`Loop 启动 · 起始掌握度 ${state.mastery.toFixed(2)}`);
loadQuestions().finally(() => {
    renderQuestion();
});

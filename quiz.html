<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* v2 spec tokens */
  --bg-primary:#FAF7F0;--bg-secondary:#F2EEE3;--bg-elevated:#FFFFFF;
  --text-primary:#1A1A1A;--text-secondary:#4A4A47;--text-tertiary:#8A8780;--text-muted:#B8B5AC;
  --accent-primary:#0F4F3D;--accent-hover:#0A3D2E;--accent-light:#E8EFE9;
  --accent-warm:#B85C2E;--accent-warm-light:#F5E8DF;
  --border-subtle:rgba(26,26,26,0.06);--border-default:rgba(26,26,26,0.10);--border-strong:rgba(26,26,26,0.20);
  --font-serif-sc:"Noto Serif SC",ui-serif,Georgia,serif;
  --font-sans-sc:"Noto Sans SC",ui-sans-serif,system-ui,sans-serif;
  --font-en:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-serif-en:"Instrument Serif",ui-serif,Georgia,serif;
  /* legacy aliases */
  --primary:var(--accent-primary);
  --bg:var(--bg-primary);--bg-2:var(--bg-secondary);
  --card:var(--bg-elevated);
  --ink:var(--text-primary);--ink2:var(--text-secondary);--ink3:var(--text-tertiary);--ink4:var(--text-muted);
  --bdr:var(--border-subtle);--bdr2:var(--border-strong);
  --pain-bg:#F5E8DF;--pain-text:#8B3A1F;
  --ok-bg:#E8EFE9;--ok-text:#0F4F3D;
  --mid-bg:#F5E8DF;--mid-text:#B85C2E;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --font:var(--font-sans-sc);
  --r:8px;
  --amber:var(--mid-text);--amber-bg:var(--mid-bg);--gold:var(--mid-text);
  --emerald:var(--ok-text);--emerald-bg:var(--ok-bg);
  --red:var(--pain-text);--red-bg:var(--pain-bg);
  --sky:var(--ink2);--sky-bg:var(--bg-2);
  --slate:var(--ink2);--slate-bg:var(--bg-2);
}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans-sc);background:var(--bg-primary);color:var(--text-primary);line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;font-size:15px;min-height:100vh;font-feature-settings:"palt" 1}
a{color:inherit;text-decoration:none}

.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(250,247,240,0.92);backdrop-filter:blur(12px);border-bottom:0.5px solid var(--border-subtle);height:68px}
.nav-in{max-width:1200px;margin:0 auto;height:100%;padding:0 40px;display:flex;align-items:center;gap:32px}
@media(max-width:768px){.nav-in{padding:0 24px}.nav{height:60px}}
.nav-brand{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--text-primary);letter-spacing:0.04em}
.nav-brand svg{display:none}
.nav-brand::before{content:'';width:22px;height:22px;border:1.5px solid var(--text-primary);border-radius:50%;display:inline-block;position:relative}
.nav-a{font-size:13px;color:var(--ink2);font-weight:400;background:transparent;padding:0;border-radius:0;transition:color .15s}
.nav-a:hover{color:var(--ink);background:transparent}
.nav-a.on{color:var(--ink);font-weight:500}
.nav-in>.nav-a{margin-right:24px}
.nav-in>.nav-a:nth-of-type(7){margin-left:auto;margin-right:0}
@media (max-width:768px){
  .nav-in{padding:0 20px;gap:0;overflow-x:auto;white-space:nowrap}
  .nav-in>.nav-a{margin-right:18px;font-size:12px;flex-shrink:0}
}

.wrap{max-width:920px;margin:0 auto;padding:160px 40px 120px}
@media(max-width:768px){.wrap{padding:112px 24px 80px}}

.eyebrow{font-family:var(--font-serif-en);font-style:italic;font-size:14px;color:var(--accent-primary);letter-spacing:0.01em;margin-bottom:20px;display:block}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:48px;flex-wrap:wrap}
.h-title{font-family:var(--font-serif-sc);font-size:clamp(36px,5vw,56px);font-weight:500;letter-spacing:0.02em;line-height:1.18;color:var(--text-primary)}
.h-title small{font-family:var(--font-sans-sc);font-weight:400;color:var(--text-secondary);font-size:15px;display:block;margin-top:14px;letter-spacing:0;line-height:1.8;max-width:640px}
.h-stats{font-size:12px;color:var(--text-tertiary);font-family:var(--font-en);font-feature-settings:"tnum" 1;letter-spacing:0.04em}
.h-stats b{color:var(--text-primary);font-weight:500}

#streak-counter-mount{margin-bottom:14px}

.section-eyebrow{font-family:var(--font-serif-en);font-style:italic;font-size:14px;color:var(--accent-primary);letter-spacing:0.01em;margin:48px 0 14px;display:block}
.section-eyebrow:first-of-type{margin-top:32px}

/* FILTER */
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fl-grp{display:inline-flex;background:var(--bg);border:0.5px solid var(--bdr);border-radius:6px;overflow:hidden;font-size:12px}
.fl-grp button{background:transparent;border:none;padding:7px 12px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit;font-weight:400;border-right:0.5px solid var(--bdr)}
.fl-grp button:last-child{border-right:none}
.fl-grp button:hover{background:var(--bg-2);color:var(--ink)}
.fl-grp button.on{background:var(--ink);color:var(--bg);font-weight:500}

.scope{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 14px;background:var(--bg-2);border-radius:6px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.scope b{color:var(--ink);font-weight:500}
.scope .sc-clr{margin-left:auto;background:transparent;border:0.5px solid var(--bdr);color:var(--ink2);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:400;cursor:pointer;font-family:inherit}
.scope .sc-clr:hover{background:var(--bg);color:var(--ink);border-color:var(--bdr2)}

.due-bar{margin-bottom:14px;padding:14px 16px;background:var(--mid-bg);border-radius:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.due-bar .db-em{display:none}
.due-bar .db-tx{flex:1;min-width:200px;font-size:13px;color:var(--mid-text);line-height:1.55;font-weight:400}
.due-bar .db-tx b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.due-bar .db-tx small{color:var(--mid-text);opacity:.8;font-weight:400;font-size:11px;display:block;margin-top:2px}
.due-bar a.db-cta{font-size:12px;font-weight:500;color:var(--bg);background:var(--ink);padding:9px 16px;border-radius:6px;text-decoration:none;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center}
.due-bar a.db-cta:hover{background:#000}
.due-bar button.db-skip{background:transparent;border:0.5px solid var(--bdr2);color:var(--ink2);font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:400}
.due-bar button.db-skip:hover{background:var(--bg)}

/* CARD */
.card{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--r);padding:32px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.card .meta span{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:400}
.m-stage{background:var(--bg-2);color:var(--ink2)}
.m-subj{background:var(--bg-2);color:var(--ink2)}
.m-diff.easy{background:var(--ok-bg);color:var(--ok-text)}
.m-diff.medium{background:var(--mid-bg);color:var(--mid-text)}
.m-diff.hard{background:var(--pain-bg);color:var(--pain-text)}
.m-id{background:var(--bg-2);color:var(--ink3);font-family:var(--mono)}
.m-ai{background:var(--bg-2);color:var(--ink2)}

.q-text{font-size:16px;font-weight:400;color:var(--ink);line-height:1.75;margin:6px 0 18px;white-space:pre-wrap;word-break:break-word}
.q-kp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.q-kp span{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg-2);color:var(--ink2);font-weight:400}

.reveal-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:4px;font-size:13px;font-weight:500;border:0.5px solid transparent;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1;min-height:36px;transition:all .15s}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{background:#000}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:var(--bg);color:var(--ink);border-color:var(--bdr)}
.btn-ghost:hover{background:var(--bg-2);border-color:var(--bdr2)}
.btn-emerald{background:var(--ok-bg);color:var(--ok-text);border-color:transparent}
.btn-emerald:hover{background:#cfe9de}

/* SELF-GRADE */
.grade-row{margin-top:14px;padding:14px 16px;background:var(--bg-2);border-radius:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grade-row .gr-q{font-size:13px;color:var(--ink2);font-weight:400;margin-right:auto}
.grade-row .gr-q b{color:var(--ink);font-weight:500}
.btn-good{background:var(--ok-bg);color:var(--ok-text);border-color:transparent}
.btn-good:hover{background:#cfe9de}
.btn-bad{background:var(--pain-bg);color:var(--pain-text);border-color:transparent}
.btn-bad:hover{background:#f7d5d5}
.grade-row.done .btn-good,.grade-row.done .btn-bad{opacity:.4;pointer-events:none}
.grade-row.done .gr-q::after{content:' · 已记录';color:var(--ink3);font-weight:400}
.session-bar{margin-top:14px;font-size:11px;color:var(--ink3);font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap}
.session-bar b{color:var(--ink);font-weight:500}
.session-bar .ok{color:var(--ok-text)}
.session-bar .bad{color:var(--pain-text)}

.answer{margin-top:18px;padding:16px 18px;background:var(--bg-2);border-radius:8px;display:none}
.answer.shown{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.a-label{font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:.5px;margin-bottom:6px}
.a-text{font-size:14px;font-weight:500;color:var(--ink);line-height:1.6;font-family:var(--mono);background:var(--bg);padding:10px 14px;border-radius:6px;margin-bottom:14px;word-break:break-word}
.a-steps{font-size:13px;color:var(--ink2);line-height:1.7;white-space:pre-wrap}

.src{margin-top:14px;padding:14px 16px;background:var(--bg-2);border-left:2px solid var(--ink);border-radius:0 6px 6px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.src-l{font-size:13px;color:var(--ink2);line-height:1.5}
.src-l b{color:var(--ink);font-weight:500}
.src-l .src-c{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}

.actions{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.actions .copy-hint{font-size:11px;color:var(--ink3)}
.actions .copy-hint.ok{color:var(--ok-text);font-weight:500}

.intro{margin-bottom:18px;padding:14px 16px;background:var(--bg-2);border-radius:8px;font-size:13px;color:var(--ink2);line-height:1.6}
.intro b{color:var(--ink);font-weight:500}
.intro a{color:var(--ink);text-decoration:underline;font-weight:400}

.empty{padding:40px 20px;text-align:center;color:var(--ink3);font-size:13px;background:var(--bg-2);border-radius:var(--r)}

@media(max-width:600px){
  .card{padding:20px 18px}
  .q-text{font-size:15px}
  .a-text{font-size:13px}
}
</style>

<div class="wrap">

    可以按学段/学科筛选；当前题的链接（含 <code style="font-family:var(--mono);font-size:12px">#q=ID</code>）直接复制就能转给孩子。<a href="/eval.html">关于这 943 道题怎么挂上教材的 →</a>

<script>
const SUBJ_ZH = { math:'数学', physics:'物理', chemistry:'化学', biology:'生物', chinese:'语文', english:'英语', history:'历史', geography:'地理', politics:'政治', moral:'道法' };
const DIFF_ZH = { easy:'易', medium:'中', hard:'难' };
const SEEN_KEY = 'ydzx_quiz_seen_v1';
const OUTCOME_KEY = 'ydzx_quiz_outcome_v1'; // {id: {r:'good'|'bad', d:'YYYY-MM-DD'}}
const GEN_KEY = 'ydzx_gen_questions_v1'; // {'path::chN': [seed-shape questions, ...]} — by textbook-browser AI
const XP_GOOD = 2; // 自评对，比 arcade 主线低，避免刷分
const XP_BAD = 3;  // 自评错略高，奖励直面错题

let POOL = [];
let CUR = null;
let FILTER = { stage: '', subject: '', book: '', ch: null };

function $(id){ return document.getElementById(id); }
function getSeen(){
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function getOutcomes(){
  try { return JSON.parse(localStorage.getItem(OUTCOME_KEY) || '{}'); }
  catch(e){ return {}; }
}
function setOutcome(id, result, q){
  const o = getOutcomes();
  const entry = { r: result, d: new Date().toISOString().slice(0,10) };
  // v2 schema: 把题目对应的教材章节存进 outcome value，让 paths.html 能做章节级 mastery
  if (q && q.textbook_ref){
    if (q.textbook_ref.path) entry.book = q.textbook_ref.path;
    if (q.textbook_ref.ch != null) entry.ch = q.textbook_ref.ch;
  }
  if (q && q.subject) entry.subj = q.subject;
  o[id] = entry;
  try { localStorage.setItem(OUTCOME_KEY, JSON.stringify(o)); } catch(e){}
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function getLocalGenPool(){
  // 从 localStorage 取出本地累积的 AI 章内题，扁平化成数组
  try {
    const obj = JSON.parse(localStorage.getItem(GEN_KEY) || '{}');
    const arr = [];
    Object.keys(obj).forEach(function(k){ (obj[k] || []).forEach(function(q){ arr.push(q); }); });
    return arr;
  } catch(e){ return []; }
}
function todayStats(){
  const o = getOutcomes();
  const today = todayKey();
  let n = 0, good = 0, bad = 0;
  Object.keys(o).forEach(function(id){
    if (o[id].d === today){ n++; if (o[id].r === 'good') good++; else bad++; }
  });
  return { n: n, good: good, bad: bad };
}
function addSeen(id){
  const s = getSeen(); s.add(id);
  // cap at 500 to avoid bloat
  const arr = Array.from(s); if (arr.length > 500) arr.splice(0, arr.length - 500);
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(arr)); } catch(e){}
}
function readQuery(){
  const p = new URLSearchParams(location.search);
  if (p.get('stage')) FILTER.stage = p.get('stage');
  if (p.get('subject')) FILTER.subject = p.get('subject');
  if (p.get('book')) FILTER.book = p.get('book');
  if (p.get('ch')) {
    const n = parseInt(p.get('ch'), 10);
    if (!isNaN(n)) FILTER.ch = n;
  }
}
function readHashId(){
  const m = (location.hash || '').match(/q=([\w-]+)/);
  return m ? m[1] : null;
}
function syncURL(){
  const p = new URLSearchParams();
  if (FILTER.stage) p.set('stage', FILTER.stage);
  if (FILTER.subject) p.set('subject', FILTER.subject);
  if (FILTER.book) p.set('book', FILTER.book);
  if (FILTER.ch != null) p.set('ch', FILTER.ch);
  const qs = p.toString();
  const hash = CUR ? '#q=' + CUR.id : '';
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + hash);
}

// 复习先于刷新题：错题本里有今日到期 → 顶部柔和提醒
const DUE_SKIP_KEY = 'ydzx_quiz_due_skip_today';
function _todayStr(){ return new Date().toISOString().slice(0,10); }
function renderDueBar(){
  const slot = $('due-mount'); if (!slot) return;
  if (!window.LearningStore){ slot.innerHTML = ''; return; }
  // 本日已 skip
  let skip = null;
  try { skip = JSON.parse(sessionStorage.getItem(DUE_SKIP_KEY) || 'null'); } catch(e){}
  if (skip && skip.d === _todayStr()){ slot.innerHTML = ''; return; }
  let pool;
  try { pool = window.LearningStore.getErrors({ dueOnly: true, subject: FILTER.subject || undefined }) || []; }
  catch(e){ slot.innerHTML = ''; return; }
  // 排除已掌握
  pool = pool.filter(function(e){ return (e.reviewCount || 0) < 3; });
  if (!pool.length){ slot.innerHTML = ''; return; }
  const subjLbl = FILTER.subject ? (SUBJ_ZH[FILTER.subject] || FILTER.subject) : '';
  const scopeTxt = FILTER.subject ? ('在 <b>' + subjLbl + '</b> 这一科里') : '';
  const href = '/errors.html?view=due' + (FILTER.subject ? '&subject=' + FILTER.subject : '');
  slot.innerHTML = '<div class="due-bar">'
    + '<span class="db-em"></span>'
    + '<span class="db-tx">' + scopeTxt + (scopeTxt ? '，' : '') + '错题本里有 <b>' + pool.length + '</b> 道今日到期'
    + '<small>学习的优先级：先复盘已经错过的 → 再做新题。这条提醒每天只出一次。</small></span>'
    + '<a class="db-cta" href="' + href + '">先去复习 →</a>'
    + '<button class="db-skip" id="db-skip">今天先做新题</button>'
    + '</div>';
  const btn = document.getElementById('db-skip');
  if (btn) btn.addEventListener('click', function(){
    try { sessionStorage.setItem(DUE_SKIP_KEY, JSON.stringify({ d: _todayStr() })); } catch(e){}
    slot.innerHTML = '';
  });
}

function renderScope(){
  const slot = $('scope-mount'); if (!slot) return;
  if (!FILTER.book){ slot.innerHTML = ''; return; }
  const cnt = filtered().length;
  const chTxt = FILTER.ch != null ? ('第 ' + FILTER.ch + ' 章') : '全书';
  slot.innerHTML = '<div class="scope">'
    + '<span>📖 本章模式 · <b>' + escapeHtml(FILTER.book) + '</b> · ' + chTxt + ' · 命中 <b>' + cnt + '</b> 道</span>'
    + '<button class="sc-clr" id="sc-clr">回到全题库 ×</button>'
    + '</div>';
  const btn = document.getElementById('sc-clr');
  if (btn) btn.addEventListener('click', function(){ FILTER.book = ''; FILTER.ch = null; renderScope(); reroll(); });
}
function renderFilter(){
  renderScope();
  renderDueBar();
  const stages = ['', '初中', '高中'];
  const subjs = ['', 'math','physics','chemistry','biology','chinese','history','geography','politics'];
  let h = '<div class="fl-grp">';
  stages.forEach(function(s){
    h += '<button data-stage="' + s + '" class="' + (FILTER.stage === s ? 'on' : '') + '">' + (s || '全学段') + '</button>';
  });
  h += '</div><div class="fl-grp">';
  subjs.forEach(function(sk){
    h += '<button data-subject="' + sk + '" class="' + (FILTER.subject === sk ? 'on' : '') + '">' + (sk ? SUBJ_ZH[sk] : '全学科') + '</button>';
  });
  h += '</div>';
  $('filter').innerHTML = h;
  document.querySelectorAll('[data-stage]').forEach(function(b){
    b.addEventListener('click', function(){ FILTER.stage = b.dataset.stage; renderFilter(); reroll(); });
  });
  document.querySelectorAll('[data-subject]').forEach(function(b){
    b.addEventListener('click', function(){ FILTER.subject = b.dataset.subject; renderFilter(); reroll(); });
  });
}

function filtered(){
  return POOL.filter(function(q){
    if (FILTER.stage && q.stage !== FILTER.stage) return false;
    if (FILTER.subject && q.subject !== FILTER.subject) return false;
    if (FILTER.book){
      const ref = q.textbook_ref || {};
      if (ref.path !== FILTER.book) return false;
      if (FILTER.ch != null && ref.ch !== FILTER.ch) return false;
    }
    return true;
  });
}

function pickRandom(){
  const list = filtered();
  if (!list.length) return null;
  const seen = getSeen();
  const fresh = list.filter(function(q){ return !seen.has(q.id); });
  const pool = fresh.length ? fresh : list;
  return pool[Math.floor(Math.random() * pool.length)];
}

function reroll(){
  CUR = pickRandom();
  if (CUR) addSeen(CUR.id);
  syncURL();
  renderCard();
}

function loadById(id){
  const found = POOL.find(function(q){ return q.id === id; });
  if (found){ CUR = found; addSeen(CUR.id); syncURL(); renderCard(); return true; }
  return false;
}

function renderCard(){
  const mount = $('card-mount');
  if (!CUR){
    if (FILTER.book){
      mount.innerHTML = '<div class="empty">本章题库还没收题。<br><br>'
        + '<a href="/tools/textbook-browser?book=' + encodeURIComponent(FILTER.book) + (FILTER.ch != null ? '&ch=' + FILTER.ch : '') + '" style="color:var(--amber);font-weight:700;text-decoration:none">回到本章阅读 →</a>'
        + ' 或 '
        + '<a href="javascript:void(0)" onclick="document.getElementById(\'sc-clr\').click()" style="color:var(--ink2);font-weight:700;text-decoration:none">清除章节筛选</a></div>';
    } else {
      mount.innerHTML = '<div class="empty">这个筛选下没有题 · 换一个学段或学科</div>';
    }
    return;
  }
  const q = CUR;
  const ref = q.textbook_ref || {};
  const refTxt = ref.path ? (ref.path + ' · 第 ' + ref.ch + ' 章') : '未挂载';
  const tbHref = ref.path ? '/tools/textbook-browser?book=' + encodeURIComponent(ref.path) + '&ch=' + ref.ch : '#';
  let kpHtml = '';
  if (q.knowledge_points && q.knowledge_points.length){
    kpHtml = '<div class="q-kp">' + q.knowledge_points.map(function(k){ return '<span>' + k + '</span>'; }).join('') + '</div>';
  }
  let h = '<article class="card">';
  h += '<div class="meta">';
  h += '<span class="m-stage">' + q.stage + '</span>';
  h += '<span class="m-subj">' + (SUBJ_ZH[q.subject] || q.subject) + '</span>';
  if (q.difficulty) h += '<span class="m-diff ' + q.difficulty + '">难度 · ' + (DIFF_ZH[q.difficulty] || q.difficulty) + '</span>';
  if (q.source === 'ai-textbook') h += '<span class="m-ai">🤖 AI 章内出题</span>';
  h += '<span class="m-id">' + q.id + '</span>';
  h += '</div>';
  h += '<div class="q-text">' + escapeHtml(q.question_text || '') + '</div>';
  h += kpHtml;
  h += '<div class="reveal-row">';
  h += '<button class="btn btn-primary" id="reveal-btn">展开答案</button>';
  if (ref.path) h += '<a class="btn btn-ghost" href="' + tbHref + '" target="_blank" rel="noopener">看原文章节 →</a>';
  h += '</div>';
  h += '<div class="answer" id="answer">';
  h += '<div class="a-label">参考答案</div>';
  h += '<div class="a-text">' + escapeHtml(q.answer || '（无）') + '</div>';
  if (q.solution_steps){
    h += '<div class="a-label">解析</div>';
    h += '<div class="a-steps">' + escapeHtml(q.solution_steps) + '</div>';
  }
  h += '<div class="src">';
  h += '<div class="src-l"><b>出处</b> · ' + refTxt + '<div class="src-c">挂载方式 · ensemble 引擎自动匹配 · 你可以去基准页查证</div></div>';
  if (ref.path) h += '<a class="btn btn-emerald" href="' + tbHref + '" target="_blank" rel="noopener">跳到原文</a>';
  h += '</div>';
  // 自评：对 / 错
  var outc = getOutcomes()[q.id];
  var graded = outc ? ' done' : '';
  // 当前连对数量提示（不打开页面顶部计数器也能看到下一步会得到什么）
  var stkRead = (function(){ try { return JSON.parse(sessionStorage.getItem('ydzx_quiz_streak_v1') || '{}') || {}; } catch(_){ return {}; } })();
  var stkN = stkRead.n || 0;
  var goodHint = stkN >= 9 ? '满了 · 收工 ✋' : (stkN >= 1 ? ('再 +1 = ' + (stkN + 1) + ' 连对') : '开启第 1 连对');
  var badHint = stkN >= 1 ? ('当前 ' + stkN + ' 连对 · 答错归 0') : '答错进错题本, 攒满 5 道开冲关';
  h += '<div class="grade-row' + graded + '" id="grade-row">';
  h += '<div class="gr-q">这道题<b>' + (outc ? (outc.r === 'good' ? '做对了 ✓' : '做错了 ✗') : '你做对了吗') + '</b></div>';
  h += '<button class="btn btn-good" id="gr-good" title="' + goodHint + '">✓ 做对了 · +' + XP_GOOD + ' XP</button>';
  h += '<button class="btn btn-bad" id="gr-bad" title="' + badHint + '">✗ 做错了 · 加入错题</button>';
  h += '</div>';
  h += '</div>';
  h += '<div class="actions">';
  h += '<button class="btn btn-ghost" id="reroll-btn">再来一题 ↻</button>';
  h += '<button class="btn btn-ghost" id="copy-btn">复制本题链接</button>';
  h += '<span class="copy-hint" id="copy-hint"></span>';
  h += '<span class="spacer"></span>';
  h += '<a class="btn btn-ghost" href="/progress.html">看四维体检 →</a>';
  h += '</div>';
  h += '</article>';
  mount.innerHTML = h;
  $('reveal-btn').addEventListener('click', function(){
    $('answer').classList.add('shown');
    this.style.display = 'none';
  });
  $('reroll-btn').addEventListener('click', reroll);
  $('copy-btn').addEventListener('click', copyLink);
  $('gr-good').addEventListener('click', function(){ grade('good'); });
  $('gr-bad').addEventListener('click', function(){ grade('bad'); });
  renderSessionBar();
}

// ─── 连对 N 题 sessionStorage 计数器 + 反狂热 nudge ───
const STREAK_KEY = 'ydzx_quiz_streak_v1';   // sessionStorage(刷新 reset, 关 tab reset)
function readStreak(){
  try { return JSON.parse(sessionStorage.getItem(STREAK_KEY) || '{"n":0,"best":0,"capped":false}'); }
  catch(e){ return { n:0, best:0, capped:false }; }
}
function writeStreak(s){
  try { sessionStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch(e){}
}
function bumpStreak(result){
  const s = readStreak();
  if (result === 'good'){
    s.n = (s.n || 0) + 1;
    if (s.n > (s.best || 0)) s.best = s.n;
    // 10 连对触发反狂热提示, 一次性
    if (s.n === 10) s.capped = false;   // 重置以便再次显示新阈值提示
  } else if (result === 'bad'){
    s.n = 0;
    s.capped = false;
  }
  writeStreak(s);
  return s;
}
function renderStreakCounter(){
  const mount = document.getElementById('streak-counter-mount');
  if (!mount) return;
  const s = readStreak();
  if (s.n <= 0){
    mount.innerHTML = '';
    return;
  }
  // 视觉等级用单色阶 + 主色橙做高亮: 1-2 极淡, 3-5 米白, 6-9 主色 chip, 10+ 黑底反 dopamine 提示
  let bg = '#F7F6F2', color = '#666', tail = '', dot = '#999';
  if (s.n >= 10){
    bg = '#1A1A1A'; color = '#FFFFFF'; dot = '#0F4F3D';
    tail = '<span style="margin-left:auto;font-size:11px;font-weight:400;color:rgba(255,255,255,0.7)">节奏满了 · 今天可以收工</span>';
  } else if (s.n >= 6){
    bg = '#F5E8DF'; color = '#8B3A1F'; dot = '#B85C2E';
  } else if (s.n >= 3){
    bg = '#FAEEDA'; color = '#854F0B'; dot = '#854F0B';
  }
  const bestTxt = s.best > s.n ? '本次最佳 ' + s.best : '继续保持';
  mount.innerHTML = ''
    + '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;background:'+bg+';font-size:13px;color:'+color+';font-weight:400">'
    +   '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+dot+'"></span>'
    +   '<span>连对 <b style="font-variant-numeric:tabular-nums;font-weight:500">' + s.n + '</b> 题</span>'
    +   '<span style="font-size:11px;opacity:.7">· ' + bestTxt + '</span>'
    +   tail
    + '</div>';
}

function grade(result){
  if (!CUR) return;
  if (getOutcomes()[CUR.id]) return; // 已评过，幂等
  setOutcome(CUR.id, result, CUR);
  bumpStreak(result);
  var subjZh = SUBJ_ZH[CUR.subject] || CUR.subject;
  if (window.GAME && typeof window.GAME.addXP === 'function'){
    if (result === 'good') window.GAME.addXP(XP_GOOD, '题库速练 · ' + subjZh + ' · quiz');
    else window.GAME.addXP(XP_BAD, '错题攻克 · ' + subjZh + ' · quiz');
  }
  // 评错时写入跨工具错题池（LearningStore），让 /errors.html 能复习这一题
  if (result === 'bad' && window.LearningStore){
    var ref = CUR.textbook_ref || {};
    try {
      window.LearningStore.saveError({
        source: 'quiz',
        quizId: CUR.id, // 反向链回 quiz#q=id
        subject: CUR.subject,
        subjectZh: subjZh,
        stage: CUR.stage || '',
        keyword: (CUR.knowledge_points && CUR.knowledge_points[0]) || '',
        question: CUR.question_text || '',
        studentAnswer: '（自评：做错了）',
        correctAnswer: CUR.answer || '',
        explanation: CUR.solution_steps || '',
        textbookPath: ref.path || '',
        textbookCh: ref.ch != null ? ref.ch : null,
        verdict: 'wrong',
        score: 0,
        mistakeTags: ['quiz 自评']
      });
    } catch(e){ console.warn('saveError failed', e); }
  }
  // 更新 UI
  var row = $('grade-row');
  if (row){
    row.classList.add('done');
    var label = row.querySelector('.gr-q b');
    if (label) label.textContent = (result === 'good' ? '做对了 ✓' : '做错了 ✗');
  }
  renderSessionBar();
  renderStreakCounter();
}

function renderSessionBar(){
  var bar = $('session-bar'); if (!bar) return;
  var s = todayStats();
  if (!s.n){
    bar.innerHTML = '<span>每完成一题点击 ✓ 或 ✗，<a href="/progress.html" style="color:var(--amber);text-decoration:none;font-weight:700">progress 四维体检</a> 的「练」「错」维度就会同步亮起来</span>';
    return;
  }
  var rate = s.n ? Math.round(s.good / s.n * 100) : 0;
  bar.innerHTML = '今日 · 刷了 <b>' + s.n + '</b> 道'
    + ' · <span class="ok">对 ' + s.good + '</span>'
    + ' · <span class="bad">错 ' + s.bad + '</span>'
    + ' · 正确率 <b>' + rate + '%</b>'
    + ' · <a href="/progress.html" style="color:var(--ink2);text-decoration:none">看四维体检 →</a>';
}

function copyLink(){
  const url = location.origin + location.pathname + (location.search || '') + '#q=' + CUR.id;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      const hint = $('copy-hint'); hint.textContent = '✓ 已复制 · 直接发给孩子'; hint.className = 'copy-hint ok';
      setTimeout(function(){ hint.textContent = ''; hint.className = 'copy-hint'; }, 2400);
    });
  } else {
    const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); $('copy-hint').textContent = '✓ 已复制'; $('copy-hint').className='copy-hint ok'; }
    catch(e){ prompt('复制这条链接：', url); }
    document.body.removeChild(ta);
  }
}

function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; });
}

(async function init(){
  readQuery();
  renderFilter();
  try {
    const r = await fetch('/src/curriculum/seed-questions-generated.json', { cache: 'force-cache' });
    const data = await r.json();
    POOL = data.questions || [];
  } catch(e){
    POOL = [];
    $('card-mount').innerHTML = '<div class="empty">题库加载失败 · 检查网络 · ' + (e.message || '') + '</div>';
    return;
  }
  // 合并本地累积的 AI 章内题（去 ID 重）
  const local = getLocalGenPool();
  if (local.length){
    const haveIds = new Set(POOL.map(function(q){ return q.id; }));
    local.forEach(function(q){ if (!haveIds.has(q.id)) POOL.push(q); });
  }
  $('pool-n').textContent = POOL.length + (local.length ? ' (含本地 AI ' + local.length + ' 道)' : '');
  $('seen-n').textContent = getSeen().size;
  renderSessionBar();
  renderStreakCounter();
  // 优先 URL hash 直链
  const hashId = readHashId();
  if (hashId && loadById(hashId)) return;
  reroll();
})();
</script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAFAF7;--card:#fff;--ink:#18181B;--ink2:#3F3F46;--ink3:#71717A;--ink4:#A1A1AA;
  --bdr:#E4E4E7;--bdr2:#D4D4D8;
  --amber:#F5A623;--amber-bg:#FFFBF0;--gold:#D97706;
  --emerald:#059669;--emerald-bg:#ECFDF5;
  --sky:#0EA5E9;--sky-bg:#F0F9FF;
  --slate:#334155;--slate-bg:#F1F5F9;
  --red:#DC2626;--red-bg:#FEF2F2;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --font:'Noto Sans SC',system-ui,sans-serif;
  --r:12px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}

.nav{position:sticky;top:0;z-index:100;background:rgba(250,250,247,.86);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--bdr)}
.nav-in{max-width:920px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:52px;gap:8px}
.nav-brand{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;margin-right:auto}
.nav-brand svg{width:24px;height:24px}
.nav-a{padding:5px 10px;border-radius:7px;text-decoration:none;color:var(--ink3);font-size:13px;font-weight:500}
.nav-a:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.nav-a.on{color:var(--amber);background:var(--amber-bg)}

/* HERO */
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.h-title{font-size:22px;font-weight:900;letter-spacing:-.5px}
.h-title small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:8px}
.h-stats{font-size:11px;color:var(--ink4);font-family:var(--mono)}
.h-stats b{color:var(--ink2);font-weight:700}

/* FILTER */
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.fl-grp{display:inline-flex;background:#fff;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;font-size:12px}
.fl-grp button{background:transparent;border:none;padding:7px 12px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit;font-weight:600;border-right:1px solid var(--bdr)}
.fl-grp button:last-child{border-right:none}
.fl-grp button:hover{background:var(--amber-bg);color:var(--gold)}
.fl-grp button.on{background:var(--amber);color:#fff}
.scope{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 14px;background:var(--sky-bg);border:1px solid #7DD3FC;border-radius:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.scope b{color:var(--ink);font-weight:800}
.scope .sc-clr{margin-left:auto;background:transparent;border:1px solid #7DD3FC;color:var(--sky);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.scope .sc-clr:hover{background:#fff;color:var(--ink)}
.due-bar{margin-bottom:14px;padding:12px 16px;background:linear-gradient(90deg,#FEF3C7,#FFFBF0);border:1px solid #FCD34D;border-radius:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.due-bar .db-em{font-size:20px;line-height:1}
.due-bar .db-tx{flex:1;min-width:200px;font-size:13px;color:#7C2D12;line-height:1.55;font-weight:500}
.due-bar .db-tx b{color:#92400E;font-weight:800;font-variant-numeric:tabular-nums}
.due-bar .db-tx small{color:#A16207;font-weight:500;font-size:11px;display:block;margin-top:2px}
.due-bar a.db-cta{font-size:12px;font-weight:700;color:#fff;background:var(--gold);padding:7px 14px;border-radius:7px;text-decoration:none;white-space:nowrap}
.due-bar a.db-cta:hover{background:#B45309}
.due-bar button.db-skip{background:transparent;border:1px solid #FCD34D;color:#92400E;font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600}
.due-bar button.db-skip:hover{background:#FEF3C7}

/* CARD */
.card{background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:28px 28px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.card .meta span{font-size:11px;padding:3px 9px;border-radius:100px;font-weight:600}
.m-stage{background:var(--slate-bg);color:var(--slate)}
.m-subj{background:var(--amber-bg);color:var(--gold)}
.m-diff.easy{background:var(--emerald-bg);color:var(--emerald)}
.m-diff.medium{background:var(--amber-bg);color:var(--gold)}
.m-diff.hard{background:var(--red-bg);color:var(--red)}
.m-id{background:#F4F4F5;color:var(--ink4);font-family:var(--mono)}
.m-ai{background:#F5F3FF;color:#7C3AED}

.q-text{font-size:18px;font-weight:500;color:var(--ink);line-height:1.75;margin:6px 0 18px;white-space:pre-wrap;word-break:break-word}
.q-kp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.q-kp span{font-size:11px;padding:3px 8px;border-radius:5px;background:#F4F4F5;color:var(--ink2);font-weight:500}

/* REVEAL */
.reveal-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid transparent;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn-primary{background:var(--amber);color:#fff}
.btn-primary:hover{background:var(--gold)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--bdr2)}
.btn-ghost:hover{background:#FAFAFA;border-color:var(--ink3)}
.btn-emerald{background:var(--emerald);color:#fff}
.btn-emerald:hover{background:#047857}

/* SELF-GRADE */
.grade-row{margin-top:14px;padding:12px 14px;background:#FAFBFC;border:1px solid var(--bdr);border-radius:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grade-row .gr-q{font-size:13px;color:var(--ink2);font-weight:600;margin-right:auto}
.grade-row .gr-q b{color:var(--ink)}
.btn-good{background:var(--emerald);color:#fff;border-color:transparent}
.btn-good:hover{background:#047857}
.btn-bad{background:var(--red);color:#fff;border-color:transparent}
.btn-bad:hover{background:#B91C1C}
.grade-row.done .btn-good,.grade-row.done .btn-bad{opacity:.4;pointer-events:none}
.grade-row.done .gr-q::after{content:' · 已记录';color:var(--ink4);font-weight:500}
.session-bar{margin-top:14px;font-size:11px;color:var(--ink3);font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap}
.session-bar b{color:var(--ink);font-weight:700}
.session-bar .ok{color:var(--emerald)}
.session-bar .bad{color:var(--red)}

.answer{margin-top:18px;padding:16px 18px;background:#F8FAFC;border:1px solid var(--bdr);border-radius:10px;display:none}
.answer.shown{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.a-label{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.a-text{font-size:16px;font-weight:700;color:var(--ink);line-height:1.6;font-family:var(--mono);background:#fff;padding:8px 12px;border-radius:6px;border:1px solid var(--bdr);margin-bottom:14px;word-break:break-word}
.a-steps{font-size:13px;color:var(--ink2);line-height:1.7;white-space:pre-wrap}

/* SOURCE PANEL */
.src{margin-top:14px;padding:14px 16px;background:linear-gradient(90deg,var(--sky-bg),#fff);border-left:3px solid var(--sky);border-radius:0 8px 8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.src-l{font-size:13px;color:var(--ink2);line-height:1.5}
.src-l b{color:var(--ink);font-weight:700}
.src-l .src-c{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}

/* ACTIONS */
.actions{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.actions .copy-hint{font-size:11px;color:var(--ink4)}
.actions .copy-hint.ok{color:var(--emerald);font-weight:700}

/* INTRO */
.intro{margin-bottom:18px;padding:14px 16px;background:#fff;border:1px solid var(--bdr);border-radius:10px;font-size:13px;color:var(--ink2);line-height:1.6}
.intro b{color:var(--ink);font-weight:700}
.intro a{color:var(--amber);text-decoration:none;font-weight:600}

.empty{padding:40px 20px;text-align:center;color:var(--ink4);font-size:13px;background:#fff;border:1px dashed var(--bdr2);border-radius:var(--r)}

@media(max-width:600px){
  .card{padding:20px 18px}
  .q-text{font-size:16px}
  .a-text{font-size:14px}
  .h-title{font-size:18px}
}
</style>
</head>

<div class="wrap">

  <div class="head">
    <div class="h-title">每日一题<small>挂上教材的题，先想，再看课本</small></div>
    <div class="h-stats">题库 · <b id="pool-n">—</b> 道 · 你已浏览 <b id="seen-n">0</b></div>
  </div>

  <div id="streak-counter-mount"></div>

  <div class="intro">
    <b>规则：</b>每打开一次抽 1 道，先在心里写答案；点「展开答案」对照解析；如果想知道这道题考的是哪一段课本，点「跳到原文」直接进 textbook 阅读器对位章节。
    可以按学段/学科筛选；当前题的链接（含 <code style="font-family:var(--mono);font-size:12px">#q=ID</code>）直接复制就能转给孩子。<a href="/eval.html">关于这 943 道题怎么挂上教材的 →</a>
  </div>

  <div id="due-mount"></div>

<script src="/src/learning-store.js"></script>
<script src="/src/gamification.js"></script>
<script>
const SUBJ_ZH = { math:'数学', physics:'物理', chemistry:'化学', biology:'生物', chinese:'语文', english:'英语', history:'历史', geography:'地理', politics:'政治', moral:'道法' };
const DIFF_ZH = { easy:'易', medium:'中', hard:'难' };
const SEEN_KEY = 'ydzx_quiz_seen_v1';
const OUTCOME_KEY = 'ydzx_quiz_outcome_v1'; // {id: {r:'good'|'bad', d:'YYYY-MM-DD'}}
const GEN_KEY = 'ydzx_gen_questions_v1'; // {'path::chN': [seed-shape questions, ...]} — by textbook-browser AI
const XP_GOOD = 2; // 自评对，比 arcade 主线低，避免刷分
const XP_BAD = 3;  // 自评错略高，奖励直面错题

let POOL = [];
let CUR = null;
let FILTER = { stage: '', subject: '', book: '', ch: null };

function $(id){ return document.getElementById(id); }
function getSeen(){
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function getOutcomes(){
  try { return JSON.parse(localStorage.getItem(OUTCOME_KEY) || '{}'); }
  catch(e){ return {}; }
}
function setOutcome(id, result, q){
  const o = getOutcomes();
  const entry = { r: result, d: new Date().toISOString().slice(0,10) };
  // v2 schema: 把题目对应的教材章节存进 outcome value，让 paths.html 能做章节级 mastery
  if (q && q.textbook_ref){
    if (q.textbook_ref.path) entry.book = q.textbook_ref.path;
    if (q.textbook_ref.ch != null) entry.ch = q.textbook_ref.ch;
  }
  if (q && q.subject) entry.subj = q.subject;
  o[id] = entry;
  try { localStorage.setItem(OUTCOME_KEY, JSON.stringify(o)); } catch(e){}
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function getLocalGenPool(){
  // 从 localStorage 取出本地累积的 AI 章内题，扁平化成数组
  try {
    const obj = JSON.parse(localStorage.getItem(GEN_KEY) || '{}');
    const arr = [];
    Object.keys(obj).forEach(function(k){ (obj[k] || []).forEach(function(q){ arr.push(q); }); });
    return arr;
  } catch(e){ return []; }
}
function todayStats(){
  const o = getOutcomes();
  const today = todayKey();
  let n = 0, good = 0, bad = 0;
  Object.keys(o).forEach(function(id){
    if (o[id].d === today){ n++; if (o[id].r === 'good') good++; else bad++; }
  });
  return { n: n, good: good, bad: bad };
}
function addSeen(id){
  const s = getSeen(); s.add(id);
  // cap at 500 to avoid bloat
  const arr = Array.from(s); if (arr.length > 500) arr.splice(0, arr.length - 500);
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(arr)); } catch(e){}
}
function readQuery(){
  const p = new URLSearchParams(location.search);
  if (p.get('stage')) FILTER.stage = p.get('stage');
  if (p.get('subject')) FILTER.subject = p.get('subject');
  if (p.get('book')) FILTER.book = p.get('book');
  if (p.get('ch')) {
    const n = parseInt(p.get('ch'), 10);
    if (!isNaN(n)) FILTER.ch = n;
  }
}
function readHashId(){
  const m = (location.hash || '').match(/q=([\w-]+)/);
  return m ? m[1] : null;
}
function syncURL(){
  const p = new URLSearchParams();
  if (FILTER.stage) p.set('stage', FILTER.stage);
  if (FILTER.subject) p.set('subject', FILTER.subject);
  if (FILTER.book) p.set('book', FILTER.book);
  if (FILTER.ch != null) p.set('ch', FILTER.ch);
  const qs = p.toString();
  const hash = CUR ? '#q=' + CUR.id : '';
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + hash);
}

// 复习先于刷新题：错题本里有今日到期 → 顶部柔和提醒
const DUE_SKIP_KEY = 'ydzx_quiz_due_skip_today';
function _todayStr(){ return new Date().toISOString().slice(0,10); }
function renderDueBar(){
  const slot = $('due-mount'); if (!slot) return;
  if (!window.LearningStore){ slot.innerHTML = ''; return; }
  // 本日已 skip
  let skip = null;
  try { skip = JSON.parse(sessionStorage.getItem(DUE_SKIP_KEY) || 'null'); } catch(e){}
  if (skip && skip.d === _todayStr()){ slot.innerHTML = ''; return; }
  let pool;
  try { pool = window.LearningStore.getErrors({ dueOnly: true, subject: FILTER.subject || undefined }) || []; }
  catch(e){ slot.innerHTML = ''; return; }
  // 排除已掌握
  pool = pool.filter(function(e){ return (e.reviewCount || 0) < 3; });
  if (!pool.length){ slot.innerHTML = ''; return; }
  const subjLbl = FILTER.subject ? (SUBJ_ZH[FILTER.subject] || FILTER.subject) : '';
  const scopeTxt = FILTER.subject ? ('在 <b>' + subjLbl + '</b> 这一科里') : '';
  const href = '/errors.html?view=due' + (FILTER.subject ? '&subject=' + FILTER.subject : '');
  slot.innerHTML = '<div class="due-bar">'
    + '<span class="db-em">📌</span>'
    + '<span class="db-tx">' + scopeTxt + (scopeTxt ? '，' : '') + '错题本里有 <b>' + pool.length + '</b> 道今日到期'
    + '<small>学习的优先级：先复盘已经错过的 → 再做新题。这条提醒每天只出一次。</small></span>'
    + '<a class="db-cta" href="' + href + '">先去复习 →</a>'
    + '<button class="db-skip" id="db-skip">今天先做新题</button>'
    + '</div>';
  const btn = document.getElementById('db-skip');
  if (btn) btn.addEventListener('click', function(){
    try { sessionStorage.setItem(DUE_SKIP_KEY, JSON.stringify({ d: _todayStr() })); } catch(e){}
    slot.innerHTML = '';
  });
}

function renderScope(){
  const slot = $('scope-mount'); if (!slot) return;
  if (!FILTER.book){ slot.innerHTML = ''; return; }
  const cnt = filtered().length;
  const chTxt = FILTER.ch != null ? ('第 ' + FILTER.ch + ' 章') : '全书';
  slot.innerHTML = '<div class="scope">'
    + '<span>📖 本章模式 · <b>' + escapeHtml(FILTER.book) + '</b> · ' + chTxt + ' · 命中 <b>' + cnt + '</b> 道</span>'
    + '<button class="sc-clr" id="sc-clr">回到全题库 ×</button>'
    + '</div>';
  const btn = document.getElementById('sc-clr');
  if (btn) btn.addEventListener('click', function(){ FILTER.book = ''; FILTER.ch = null; renderScope(); reroll(); });
}
function renderFilter(){
  renderScope();
  renderDueBar();
  const stages = ['', '初中', '高中'];
  const subjs = ['', 'math','physics','chemistry','biology','chinese','history','geography','politics'];
  let h = '<div class="fl-grp">';
  stages.forEach(function(s){
    h += '<button data-stage="' + s + '" class="' + (FILTER.stage === s ? 'on' : '') + '">' + (s || '全学段') + '</button>';
  });
  h += '</div><div class="fl-grp">';
  subjs.forEach(function(sk){
    h += '<button data-subject="' + sk + '" class="' + (FILTER.subject === sk ? 'on' : '') + '">' + (sk ? SUBJ_ZH[sk] : '全学科') + '</button>';
  });
  h += '</div>';
  $('filter').innerHTML = h;
  document.querySelectorAll('[data-stage]').forEach(function(b){
    b.addEventListener('click', function(){ FILTER.stage = b.dataset.stage; renderFilter(); reroll(); });
  });
  document.querySelectorAll('[data-subject]').forEach(function(b){
    b.addEventListener('click', function(){ FILTER.subject = b.dataset.subject; renderFilter(); reroll(); });
  });
}

function filtered(){
  return POOL.filter(function(q){
    if (FILTER.stage && q.stage !== FILTER.stage) return false;
    if (FILTER.subject && q.subject !== FILTER.subject) return false;
    if (FILTER.book){
      const ref = q.textbook_ref || {};
      if (ref.path !== FILTER.book) return false;
      if (FILTER.ch != null && ref.ch !== FILTER.ch) return false;
    }
    return true;
  });
}

function pickRandom(){
  const list = filtered();
  if (!list.length) return null;
  const seen = getSeen();
  const fresh = list.filter(function(q){ return !seen.has(q.id); });
  const pool = fresh.length ? fresh : list;
  return pool[Math.floor(Math.random() * pool.length)];
}

function reroll(){
  CUR = pickRandom();
  if (CUR) addSeen(CUR.id);
  syncURL();
  renderCard();
}

function loadById(id){
  const found = POOL.find(function(q){ return q.id === id; });
  if (found){ CUR = found; addSeen(CUR.id); syncURL(); renderCard(); return true; }
  return false;
}

function renderCard(){
  const mount = $('card-mount');
  if (!CUR){
    if (FILTER.book){
      mount.innerHTML = '<div class="empty">本章题库还没收题。<br><br>'
        + '<a href="/tools/textbook-browser?book=' + encodeURIComponent(FILTER.book) + (FILTER.ch != null ? '&ch=' + FILTER.ch : '') + '" style="color:var(--amber);font-weight:700;text-decoration:none">回到本章阅读 →</a>'
        + ' 或 '
        + '<a href="javascript:void(0)" onclick="document.getElementById(\'sc-clr\').click()" style="color:var(--ink2);font-weight:700;text-decoration:none">清除章节筛选</a></div>';
    } else {
      mount.innerHTML = '<div class="empty">这个筛选下没有题 · 换一个学段或学科</div>';
    }
    return;
  }
  const q = CUR;
  const ref = q.textbook_ref || {};
  const refTxt = ref.path ? (ref.path + ' · 第 ' + ref.ch + ' 章') : '未挂载';
  const tbHref = ref.path ? '/tools/textbook-browser?book=' + encodeURIComponent(ref.path) + '&ch=' + ref.ch : '#';
  let kpHtml = '';
  if (q.knowledge_points && q.knowledge_points.length){
    kpHtml = '<div class="q-kp">' + q.knowledge_points.map(function(k){ return '<span>' + k + '</span>'; }).join('') + '</div>';
  }
  let h = '<article class="card">';
  h += '<div class="meta">';
  h += '<span class="m-stage">' + q.stage + '</span>';
  h += '<span class="m-subj">' + (SUBJ_ZH[q.subject] || q.subject) + '</span>';
  if (q.difficulty) h += '<span class="m-diff ' + q.difficulty + '">难度 · ' + (DIFF_ZH[q.difficulty] || q.difficulty) + '</span>';
  if (q.source === 'ai-textbook') h += '<span class="m-ai">🤖 AI 章内出题</span>';
  h += '<span class="m-id">' + q.id + '</span>';
  h += '</div>';
  h += '<div class="q-text">' + escapeHtml(q.question_text || '') + '</div>';
  h += kpHtml;
  h += '<div class="reveal-row">';
  h += '<button class="btn btn-primary" id="reveal-btn">展开答案</button>';
  if (ref.path) h += '<a class="btn btn-ghost" href="' + tbHref + '" target="_blank" rel="noopener">看原文章节 →</a>';
  h += '</div>';
  h += '<div class="answer" id="answer">';
  h += '<div class="a-label">参考答案</div>';
  h += '<div class="a-text">' + escapeHtml(q.answer || '（无）') + '</div>';
  if (q.solution_steps){
    h += '<div class="a-label">解析</div>';
    h += '<div class="a-steps">' + escapeHtml(q.solution_steps) + '</div>';
  }
  h += '<div class="src">';
  h += '<div class="src-l"><b>出处</b> · ' + refTxt + '<div class="src-c">挂载方式 · ensemble 引擎自动匹配 · 你可以去基准页查证</div></div>';
  if (ref.path) h += '<a class="btn btn-emerald" href="' + tbHref + '" target="_blank" rel="noopener">跳到原文</a>';
  h += '</div>';
  // 自评：对 / 错
  var outc = getOutcomes()[q.id];
  var graded = outc ? ' done' : '';
  // 当前连对数量提示（不打开页面顶部计数器也能看到下一步会得到什么）
  var stkRead = (function(){ try { return JSON.parse(sessionStorage.getItem('ydzx_quiz_streak_v1') || '{}') || {}; } catch(_){ return {}; } })();
  var stkN = stkRead.n || 0;
  var goodHint = stkN >= 9 ? '满了 · 收工 ✋' : (stkN >= 1 ? ('再 +1 = ' + (stkN + 1) + ' 连对') : '开启第 1 连对');
  var badHint = stkN >= 1 ? ('当前 ' + stkN + ' 连对 · 答错归 0') : '答错进错题本, 攒满 5 道开冲关';
  h += '<div class="grade-row' + graded + '" id="grade-row">';
  h += '<div class="gr-q">这道题<b>' + (outc ? (outc.r === 'good' ? '做对了 ✓' : '做错了 ✗') : '你做对了吗') + '</b></div>';
  h += '<button class="btn btn-good" id="gr-good" title="' + goodHint + '">✓ 做对了 · +' + XP_GOOD + ' XP</button>';
  h += '<button class="btn btn-bad" id="gr-bad" title="' + badHint + '">✗ 做错了 · 加入错题</button>';
  h += '</div>';
  h += '</div>';
  h += '<div class="actions">';
  h += '<button class="btn btn-ghost" id="reroll-btn">再来一题 ↻</button>';
  h += '<button class="btn btn-ghost" id="copy-btn">复制本题链接</button>';
  h += '<span class="copy-hint" id="copy-hint"></span>';
  h += '<span class="spacer"></span>';
  h += '<a class="btn btn-ghost" href="/progress.html">看四维体检 →</a>';
  h += '</div>';
  h += '</article>';
  mount.innerHTML = h;
  $('reveal-btn').addEventListener('click', function(){
    $('answer').classList.add('shown');
    this.style.display = 'none';
  });
  $('reroll-btn').addEventListener('click', reroll);
  $('copy-btn').addEventListener('click', copyLink);
  $('gr-good').addEventListener('click', function(){ grade('good'); });
  $('gr-bad').addEventListener('click', function(){ grade('bad'); });
  renderSessionBar();
}

// ─── 连对 N 题 sessionStorage 计数器 + 反狂热 nudge ───
const STREAK_KEY = 'ydzx_quiz_streak_v1';   // sessionStorage(刷新 reset, 关 tab reset)
function readStreak(){
  try { return JSON.parse(sessionStorage.getItem(STREAK_KEY) || '{"n":0,"best":0,"capped":false}'); }
  catch(e){ return { n:0, best:0, capped:false }; }
}
function writeStreak(s){
  try { sessionStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch(e){}
}
function bumpStreak(result){
  const s = readStreak();
  if (result === 'good'){
    s.n = (s.n || 0) + 1;
    if (s.n > (s.best || 0)) s.best = s.n;
    // 10 连对触发反狂热提示, 一次性
    if (s.n === 10) s.capped = false;   // 重置以便再次显示新阈值提示
  } else if (result === 'bad'){
    s.n = 0;
    s.capped = false;
  }
  writeStreak(s);
  return s;
}
function renderStreakCounter(){
  const mount = document.getElementById('streak-counter-mount');
  if (!mount) return;
  const s = readStreak();
  if (s.n <= 0){
    mount.innerHTML = '';
    return;
  }
  // 视觉等级: 1-2 暖灰, 3-5 amber, 6-9 orange, 10+ 紫色 + 反狂热文案
  let bg = '#FAFAF7', border = '#E4E4E7', color = '#52525B', icon = '🟢', tail = '';
  if (s.n >= 10){
    bg = '#F5F3FF'; border = '#C4B5FD'; color = '#5B21B6'; icon = '🌟';
    tail = '<span style="margin-left:auto;font-size:11px;color:#7C3AED;font-weight:600">节奏满了 · 今天可以收工 ✋</span>';
  } else if (s.n >= 6){
    bg = '#FFF7ED'; border = '#FDBA74'; color = '#9A3412'; icon = '🔥';
  } else if (s.n >= 3){
    bg = '#FFFBEB'; border = '#FCD34D'; color = '#92400E'; icon = '✨';
  } else {
    icon = '🟢';
  }
  const bestTxt = s.best > s.n ? '本次最佳 ' + s.best : '继续保持';
  mount.innerHTML = ''
    + '<div style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:100px;background:'+bg+';border:1px solid '+border+';margin:8px 0 6px;font-size:12.5px;color:'+color+';font-weight:700">'
    +   '<span style="font-size:16px;line-height:1">' + icon + '</span>'
    +   '<span>连对 <b style="font-variant-numeric:tabular-nums;font-size:14px">' + s.n + '</b> 题</span>'
    +   '<span style="font-size:11px;font-weight:500;opacity:.7">· ' + bestTxt + '</span>'
    +   tail
    + '</div>';
}

function grade(result){
  if (!CUR) return;
  if (getOutcomes()[CUR.id]) return; // 已评过，幂等
  setOutcome(CUR.id, result, CUR);
  bumpStreak(result);
  var subjZh = SUBJ_ZH[CUR.subject] || CUR.subject;
  if (window.GAME && typeof window.GAME.addXP === 'function'){
    if (result === 'good') window.GAME.addXP(XP_GOOD, '题库速练 · ' + subjZh + ' · quiz');
    else window.GAME.addXP(XP_BAD, '错题攻克 · ' + subjZh + ' · quiz');
  }
  // 评错时写入跨工具错题池（LearningStore），让 /errors.html 能复习这一题
  if (result === 'bad' && window.LearningStore){
    var ref = CUR.textbook_ref || {};
    try {
      window.LearningStore.saveError({
        source: 'quiz',
        quizId: CUR.id, // 反向链回 quiz#q=id
        subject: CUR.subject,
        subjectZh: subjZh,
        stage: CUR.stage || '',
        keyword: (CUR.knowledge_points && CUR.knowledge_points[0]) || '',
        question: CUR.question_text || '',
        studentAnswer: '（自评：做错了）',
        correctAnswer: CUR.answer || '',
        explanation: CUR.solution_steps || '',
        textbookPath: ref.path || '',
        textbookCh: ref.ch != null ? ref.ch : null,
        verdict: 'wrong',
        score: 0,
        mistakeTags: ['quiz 自评']
      });
    } catch(e){ console.warn('saveError failed', e); }
  }
  // 更新 UI
  var row = $('grade-row');
  if (row){
    row.classList.add('done');
    var label = row.querySelector('.gr-q b');
    if (label) label.textContent = (result === 'good' ? '做对了 ✓' : '做错了 ✗');
  }
  renderSessionBar();
  renderStreakCounter();
}

function renderSessionBar(){
  var bar = $('session-bar'); if (!bar) return;
  var s = todayStats();
  if (!s.n){
    bar.innerHTML = '<span>每完成一题点击 ✓ 或 ✗，<a href="/progress.html" style="color:var(--amber);text-decoration:none;font-weight:700">progress 四维体检</a> 的「练」「错」维度就会同步亮起来</span>';
    return;
  }
  var rate = s.n ? Math.round(s.good / s.n * 100) : 0;
  bar.innerHTML = '今日 · 刷了 <b>' + s.n + '</b> 道'
    + ' · <span class="ok">对 ' + s.good + '</span>'
    + ' · <span class="bad">错 ' + s.bad + '</span>'
    + ' · 正确率 <b>' + rate + '%</b>'
    + ' · <a href="/progress.html" style="color:var(--ink2);text-decoration:none">看四维体检 →</a>';
}

function copyLink(){
  const url = location.origin + location.pathname + (location.search || '') + '#q=' + CUR.id;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      const hint = $('copy-hint'); hint.textContent = '✓ 已复制 · 直接发给孩子'; hint.className = 'copy-hint ok';
      setTimeout(function(){ hint.textContent = ''; hint.className = 'copy-hint'; }, 2400);
    });
  } else {
    const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); $('copy-hint').textContent = '✓ 已复制'; $('copy-hint').className='copy-hint ok'; }
    catch(e){ prompt('复制这条链接：', url); }
    document.body.removeChild(ta);
  }
}

function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; });
}

(async function init(){
  readQuery();
  renderFilter();
  try {
    const r = await fetch('/src/curriculum/seed-questions-generated.json', { cache: 'force-cache' });
    const data = await r.json();
    POOL = data.questions || [];
  } catch(e){
    POOL = [];
    $('card-mount').innerHTML = '<div class="empty">题库加载失败 · 检查网络 · ' + (e.message || '') + '</div>';
    return;
  }
  // 合并本地累积的 AI 章内题（去 ID 重）
  const local = getLocalGenPool();
  if (local.length){
    const haveIds = new Set(POOL.map(function(q){ return q.id; }));
    local.forEach(function(q){ if (!haveIds.has(q.id)) POOL.push(q); });
  }
  $('pool-n').textContent = POOL.length + (local.length ? ' (含本地 AI ' + local.length + ' 道)' : '');
  $('seen-n').textContent = getSeen().size;
  renderSessionBar();
  renderStreakCounter();
  // 优先 URL hash 直链
  const hashId = readHashId();
  if (hashId && loadById(hashId)) return;
  reroll();
})();
</script>

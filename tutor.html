<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>原点 AI 私教 · 莫小语</title>
<meta name="description" content="不是 ChatGPT 包壳，是真正记得你卡过哪、用什么类比、什么情绪的一对一私教">
<link rel="preconnect" href="https://fonts.googleapis.cnpmjs.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.cnpmjs.org/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root{
    --warm-white:#FAFAF7;
    --side:#FFFFFF;
    --canvas:#F7F5F0;
    --ink:#18181B;
    --ink-soft:#3F3F46;
    --ink-mute:#71717A;
    --ink-fade:#A8A29E;
    --bdr:#E7E5DF;
    --bdr-soft:#EFEDE7;
    --bdr-strong:#D6D3CC;
    --orange:#E94D35;
    --orange-soft:#FF8A6E;
    --orange-glow:rgba(233,77,53,0.10);
    --orange-bg:#FFF5F1;
    --amber:#F5A623;
    --amber-bg:#FFFBF0;
    --green:#15803D;
    --green-bg:#F0FDF4;
    --shadow-sm:0 1px 2px rgba(24,24,27,0.04);
    --shadow-md:0 1px 3px rgba(24,24,27,0.04), 0 8px 24px rgba(24,24,27,0.06);
    --shadow-lg:0 4px 8px rgba(24,24,27,0.06), 0 20px 40px rgba(24,24,27,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    background:var(--warm-white);
    color:var(--ink);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
}

/* ─── App shell · 2 栏（删了学科树左栏 · 我们不是学科目录是学习管家）─── */
.app{
    display:grid;
    grid-template-columns:1fr 320px;
    grid-template-rows:auto 1fr;
    height:100vh;
    overflow:hidden;
}
.app-header{
    grid-column:1/-1;
    background:rgba(250,250,247,0.94);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--bdr);
    z-index:60;
}
.header-row{
    padding:12px 22px;
    display:flex;
    align-items:center;
    gap:14px;
}
.header-back{
    color:var(--ink-mute);text-decoration:none;font-size:0.84rem;
    padding:6px 10px;border-radius:8px;transition:all 0.15s;
    display:flex;align-items:center;gap:4px;
}
.header-back:hover{color:var(--ink);background:var(--bdr-soft)}
.tutor-id{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.tutor-id .av{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg,var(--orange),var(--orange-soft));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:1.05rem;
    flex-shrink:0;box-shadow:0 2px 8px rgba(233,77,53,0.30);
}
.tutor-id .nm{min-width:0}
.tutor-id .nm h1{font-size:0.98rem;font-weight:700;line-height:1.2;letter-spacing:-0.2px}
.tutor-id .nm .sub{font-size:0.74rem;color:var(--ink-mute);line-height:1.3}
.tutor-id .nm .sub b{color:var(--orange);font-weight:600}
.header-radar{
    color:var(--ink-mute);text-decoration:none;font-size:0.82rem;
    padding:7px 14px;border-radius:8px;border:1px solid var(--bdr);
    transition:all 0.15s;
}
.header-radar:hover{color:var(--orange);border-color:var(--orange);background:var(--orange-bg)}
.mobile-toggle{display:none;background:none;border:1px solid var(--bdr);width:36px;height:36px;border-radius:8px;cursor:pointer;align-items:center;justify-content:center;color:var(--ink-soft)}
.mobile-toggle svg{width:18px;height:18px}

/* 学科树 CSS 已删（.rail-l / .subj / .kp 不再需要——产品定位是学习管家不是学科目录）*/

/* ─── Center · 对话主区 ─── */
.center{
    background:var(--canvas);
    overflow-y:auto;
    position:relative;
    display:flex;flex-direction:column;
}
.chat{
    flex:1;
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:26px 22px 40px;
}

.welcome{
    text-align:center;
    padding:30px 14px 8px;
}
.welcome .hero-av{
    width:88px;height:88px;border-radius:50%;
    background:linear-gradient(135deg,var(--orange),var(--orange-soft));
    color:#fff;font-family:"Noto Serif SC",serif;font-weight:900;font-size:2.4rem;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    box-shadow:0 6px 24px rgba(233,77,53,0.30), inset 0 -4px 12px rgba(0,0,0,0.08);
    position:relative;
}
.welcome .hero-av::after{
    content:'';position:absolute;bottom:2px;right:2px;
    width:18px;height:18px;border-radius:50%;
    background:#22C55E;border:3px solid var(--canvas);
}
.welcome h2{
    font-size:1.45rem;font-weight:900;letter-spacing:-0.5px;
    margin-bottom:6px;
}
.welcome .greet-sub{
    font-size:0.94rem;color:var(--ink-soft);
    max-width:420px;margin:0 auto 20px;
}
.quick{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:10px;max-width:520px;margin:0 auto;
}
.quick button{
    display:flex;align-items:center;gap:10px;
    padding:14px 14px;
    background:var(--side);border:1px solid var(--bdr);border-radius:12px;
    font-family:inherit;font-size:0.9rem;font-weight:500;color:var(--ink-soft);
    cursor:pointer;text-align:left;
    transition:all 0.15s;
}
.quick button:hover{
    border-color:var(--orange);color:var(--ink);
    background:var(--orange-bg);transform:translateY(-1px);
    box-shadow:var(--shadow-sm);
}
.quick button .qicon{font-size:1.1rem;flex-shrink:0}

/* ─── Bubbles ─── */
.bubble{margin-bottom:14px;display:flex;animation:popIn 0.22s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bubble.tutor{justify-content:flex-start;gap:10px;align-items:flex-start}
.bubble.tutor .b-avatar{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,var(--orange),var(--orange-soft));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:0.9rem;
    flex-shrink:0;box-shadow:0 2px 6px rgba(233,77,53,0.22);
}
.bubble.tutor .b-content{
    background:var(--side);border:1px solid var(--bdr);
    padding:12px 16px;border-radius:4px 16px 16px 16px;
    font-size:0.96rem;line-height:1.7;color:var(--ink);
    max-width:calc(100% - 50px);
    white-space:pre-wrap;word-break:break-word;
    box-shadow:var(--shadow-sm);
}
.bubble.student{justify-content:flex-end}
.bubble.student .body{
    background:var(--orange);color:#fff;
    padding:11px 16px;border-radius:16px 16px 4px 16px;
    font-size:0.96rem;line-height:1.65;
    max-width:78%;white-space:pre-wrap;word-break:break-word;
    box-shadow:0 2px 8px rgba(233,77,53,0.22);
}
.bubble.system{
    justify-content:center;
    margin:18px 0;
}
.bubble.system .body{
    background:var(--amber-bg);color:#92400E;
    border:1px solid #FCD34D;
    padding:7px 14px;border-radius:100px;
    font-size:0.78rem;font-weight:500;
    max-width:90%;text-align:center;
}

.dots{display:inline-flex;gap:4px;align-items:center;height:1em}
.dots span{
    width:6px;height:6px;border-radius:50%;background:var(--ink-fade);
    animation:dot 1.2s infinite;
}
.dots span:nth-child(2){animation-delay:0.15s}
.dots span:nth-child(3){animation-delay:0.30s}
@keyframes dot{0%,60%,100%{opacity:0.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ─── Right rail · 学习面板 ─── */
.rail-r{
    background:var(--side);
    border-left:1px solid var(--bdr);
    overflow-y:auto;
    padding:22px 18px 80px;
}
.rail-r h3{
    font-size:0.7rem;font-weight:700;color:var(--ink-fade);
    letter-spacing:1.5px;text-transform:uppercase;
    margin:8px 0 10px;
}
.panel{
    background:var(--side);border:1px solid var(--bdr);
    border-radius:12px;padding:14px;margin-bottom:12px;
}
.panel.kp-now{border-color:var(--orange);background:var(--orange-bg)}
.panel-label{
    font-size:0.72rem;color:var(--ink-mute);font-weight:600;
    margin-bottom:6px;letter-spacing:0.3px;
}
.panel-val{
    font-size:0.96rem;font-weight:700;color:var(--ink);
    line-height:1.3;
}
.panel.kp-now .panel-val{color:var(--orange)}
.bar-wrap{margin-top:10px}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bar-row .lab{font-size:0.74rem;color:var(--ink-mute)}
.bar-row .num{font-size:0.85rem;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bdr-soft);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));border-radius:100px;transition:width 0.6s}
.weak-list{list-style:none;padding:0;margin:0}
.weak-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-bottom:1px dashed var(--bdr-soft);
    font-size:0.84rem;color:var(--ink-soft);
}
.weak-list li:last-child{border-bottom:none}
.weak-list li .ct{
    font-size:0.72rem;font-weight:700;color:var(--orange);
    background:var(--orange-bg);padding:2px 8px;border-radius:100px;
}
.review-row{
    display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:var(--green-bg);
    border:1px solid #BBF7D0;border-radius:10px;
    font-size:0.85rem;color:var(--green);font-weight:600;
}
.parent-cta{
    display:block;text-align:center;
    padding:12px;margin-top:14px;
    background:var(--ink);color:#fff;
    border-radius:10px;text-decoration:none;
    font-size:0.86rem;font-weight:600;
    transition:all 0.15s;
}
.parent-cta:hover{background:var(--orange)}

/* ─── Input bar ─── */
/* 改成 sticky 不再 absolute · 否则 welcome 内容超出视窗时 input 会盖住 quick chip */
.input-bar{
    position:sticky;bottom:0;left:0;right:0;
    padding:14px 22px 22px;
    background:var(--canvas);
    border-top:1px solid var(--bdr-soft);
    margin-top:auto;
    z-index:10;
}
.paste-warn{
    max-width:760px;margin:0 auto 8px;
    padding:9px 14px;background:var(--amber-bg);
    border:1px solid #FCD34D;border-radius:10px;
    color:#92400E;font-size:0.82rem;font-weight:500;
    display:none;align-items:center;gap:8px;line-height:1.5;
}
.paste-warn.show{display:flex}
.paste-warn .icon{font-size:1rem;flex-shrink:0}
.input-row{
    max-width:760px;margin:0 auto;
    display:flex;gap:8px;
    background:var(--side);border:1.5px solid var(--bdr-strong);
    border-radius:24px;padding:6px 6px 6px 18px;
    align-items:center;
    box-shadow:var(--shadow-md);
    transition:border-color 0.15s, box-shadow 0.15s;
}
.input-row:focus-within{
    border-color:var(--orange);
    box-shadow:0 0 0 3px var(--orange-glow), var(--shadow-md);
}
.input-row.pasted{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(245,166,35,0.10), var(--shadow-md);
}
.input-row input{
    flex:1;border:none;outline:none;background:transparent;
    color:var(--ink);font-size:1rem;font-family:inherit;
    padding:11px 0;min-width:0;
}
.input-row input::placeholder{color:var(--ink-mute)}
.send-btn{
    width:40px;height:40px;background:var(--orange);color:#fff;
    border:none;border-radius:50%;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.15s;
}
.send-btn:hover{background:var(--orange-soft);transform:scale(1.06)}
.send-btn:active{transform:scale(0.94)}
.send-btn:disabled{background:var(--bdr-strong);cursor:not-allowed;transform:none}
.send-btn svg{width:18px;height:18px}

/* ─── Mobile responsive ─── */
.rail-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);
    z-index:80;animation:fadeIn 0.2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rail-overlay.show{display:block}

@media (max-width:1023px){
    .app{grid-template-columns:1fr 280px}
}
@media (max-width:767px){
    .app{grid-template-columns:1fr}
    .rail-r{
        position:fixed;right:0;top:0;bottom:0;width:280px;
        z-index:90;transform:translateX(100%);
        transition:transform 0.25s;
    }
    .rail-r.open{transform:translateX(0)}
    .header-radar{display:none}
    .mobile-r-toggle{display:flex}
    .quick{grid-template-columns:1fr}
    .welcome{padding:18px 8px 4px}
    .welcome .hero-av{width:72px;height:72px;font-size:2rem}
    .welcome h2{font-size:1.2rem}
    .chat{padding:18px 14px 30px}
    .header-row{padding:10px 14px}
    .tutor-id .nm h1{font-size:0.9rem}
}
.mobile-r-toggle{display:none;background:none;border:1px solid var(--bdr);width:36px;height:36px;border-radius:8px;cursor:pointer;align-items:center;justify-content:center;color:var(--ink-soft)}
.mobile-r-toggle svg{width:18px;height:18px}
@media (max-width:767px){.mobile-r-toggle{display:flex}}
</style>
</head>
<body>

<div class="app">
    <header class="app-header">
        <div class="header-row">
            <a href="/" class="header-back" aria-label="回到首页">← 首页</a>
            <div class="tutor-id">
                <div class="av">墨</div>
                <div class="nm">
                    <h1 id="tutor-title">莫小语 · 你的私教</h1>
                    <div class="sub"><span id="b-memory">读取记忆中…</span> · <span id="b-weak">看你最近卡哪</span></div>
                </div>
            </div>
            <a href="/radar" class="header-radar" id="hero-to-radar">家长视角 →</a>
            <button class="mobile-r-toggle" id="mob-r-toggle" aria-label="学习进度">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 6-6"/></svg>
            </button>
        </div>
        <!-- P1-D 学习模式切换 chip：5 模式入口（家庭学习管家定位）-->
        <div class="mode-row" id="mode-row">
            <button class="mode-chip active" data-mode="explain" aria-label="讲题">
                <span class="mode-em">📝</span><span>讲题</span>
            </button>
            <button class="mode-chip" data-mode="recall" aria-label="下课讲一讲" title="把今天课上学的讲给老师听，老师假装听不懂，让你说清楚">
                <span class="mode-em">🎙️</span><span>下课讲讲</span>
            </button>
            <button class="mode-chip" data-mode="diagnose" aria-label="错题归因">
                <span class="mode-em">🔍</span><span>错题归因</span>
            </button>
            <button class="mode-chip" data-mode="cram" aria-label="考前突击">
                <span class="mode-em">⏰</span><span>考前突击</span>
            </button>
            <button class="mode-chip" data-mode="essay" aria-label="作文批改">
                <span class="mode-em">✍️</span><span>作文批改</span>
            </button>
        </div>
    </header>

    <style>
    .mode-row {
        display:flex; gap:8px; padding:8px 22px 12px;
        max-width: none; overflow-x:auto; scrollbar-width:none;
        border-top:1px solid var(--bdr-soft);
    }
    .mode-row::-webkit-scrollbar { display:none; }
    .mode-chip {
        display:inline-flex; align-items:center; gap:6px;
        padding:7px 14px; border-radius:100px;
        background:var(--side); border:1px solid var(--bdr);
        color:var(--ink-soft); font-family:inherit; font-size:0.84rem; font-weight:600;
        cursor:pointer; flex-shrink:0;
        transition: all 0.15s;
    }
    .mode-chip:hover { background:var(--orange-bg); border-color:var(--orange-soft); color:var(--ink); }
    .mode-chip.active {
        background:var(--orange); color:#fff; border-color:var(--orange);
        box-shadow: 0 2px 8px rgba(233,77,53,0.25);
    }
    .mode-chip .mode-em { font-size:0.94rem; }
    @media (max-width: 767px) {
        .mode-row { padding: 6px 14px 10px; gap:6px; }
        .mode-chip { padding:6px 11px; font-size:0.78rem; }
    }
    </style>

    <!-- 中：对话主区（之前左侧学科树已删 · 不是学科目录是学习管家）-->
    <main class="center">
        <div class="chat" id="chat">
            <div class="welcome" id="welcome-block">
                <div class="hero-av">墨</div>
                <h2 id="hero-greet">嗯，咱们继续</h2>
                <div class="greet-sub" id="hero-sub">直接说你想问什么，或者从下面挑一个开始</div>
                <div class="quick">
                    <button data-q="一元一次方程怎么解我老忘"><span class="qicon">📝</span>方程怎么解我老忘</button>
                    <button data-q="分式去分母总忘乘整式项"><span class="qicon">🧮</span>分式去分母总漏乘</button>
                    <button data-q="今天我该练什么"><span class="qicon">🎯</span>今天该练什么</button>
                    <button data-q="你还记得我之前哪里卡过吗"><span class="qicon">🧠</span>你还记得我吗</button>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <div class="paste-warn" id="paste-warn">
                <span class="icon">⚠️</span>
                <span>看到你贴了一段过来，我会先问你的思路再帮你想</span>
            </div>
            <div class="input-row" id="input-row">
                <input id="msg" type="text" placeholder="说说你想学什么，或者卡在哪一步…" autocomplete="off">
                <button id="send-btn" class="send-btn" aria-label="发送">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </div>
    </main>

    <!-- 右：学习面板 -->
    <aside class="rail-r" id="rail-r">
        <h3>当前学习</h3>
        <div class="panel kp-now">
            <div class="panel-label">现在练</div>
            <div class="panel-val" id="now-kp">解方程·移项</div>
            <div class="bar-wrap">
                <div class="bar-row">
                    <span class="lab">掌握度（BKT）</span>
                    <span class="num" id="bkt-num">0.62</span>
                </div>
                <div class="bar"><div class="bar-fill" id="bkt-bar" style="width:62%"></div></div>
            </div>
        </div>

        <h3>最近卡点</h3>
        <div class="panel">
            <ul class="weak-list" id="weak-list">
                <li><span>移项忘记变号</span><span class="ct">3 次</span></li>
                <li><span>分母为字母时去分母</span><span class="ct">2 次</span></li>
                <li><span>含括号去括号符号</span><span class="ct">1 次</span></li>
            </ul>
        </div>

        <h3>下次复习</h3>
        <div class="review-row" id="next-review">
            <span>📅</span>
            <span>明天 19:00 · 移项·变号 复习题 3 道（FSRS 推算）</span>
        </div>

        <h3>遇到搞不定的</h3>
        <div class="mentor-card">
            <div class="mentor-row">
                <div class="mentor-av">清</div>
                <div class="mentor-info">
                    <div class="mentor-name">学长学姐</div>
                    <div class="mentor-sub">概念题 / 情绪 / 长程规划</div>
                </div>
            </div>
            <div class="mentor-eta" id="mentor-eta">平均 30 分钟内回你</div>
            <button class="mentor-btn" id="call-mentor-btn">呼叫学长攻坚 →</button>
            <div class="mentor-recent" id="mentor-recent" style="display:none"></div>
        </div>

        <a href="/radar" class="parent-cta" id="cta-radar">家长视角看一眼 →</a>
    </aside>

    <style>
    .mentor-card {
        background:linear-gradient(135deg,#FFF5F1,#FFFBF0);
        border:1px solid var(--orange);border-radius:12px;
        padding:14px;margin-bottom:12px;
    }

<script>
const params = new URLSearchParams(location.search);
const _urlSid = params.get('student_id');
const _lsSid = localStorage.getItem('yd:my_student_id');
const _urlName = params.get('name');
const _lsName = localStorage.getItem('yd:my_name');
if (_urlSid && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(_urlSid)) {
    localStorage.setItem('yd:my_student_id', _urlSid);
    if (_urlName) localStorage.setItem('yd:my_name', _urlName);
}
const STUDENT_ID = _urlSid || _lsSid || '00000000-0000-0000-0000-000000000001';
const TOPIC_CODE = params.get('topic_code') || 'math.7.ch3.kp3';
const NAME = _urlName || _lsName || '同学';
const SESSION_ID = crypto.randomUUID ? crypto.randomUUID() : null;
const IS_DEMO_USER = STUDENT_ID === '00000000-0000-0000-0000-000000000001';

const KP_NAME_HINT = {
    'math.7.ch3.kp1': '一元一次方程概念',
    'math.7.ch3.kp2': '等式性质',
    'math.7.ch3.kp3': '解方程·移项',
    'math.7.ch3.kp4': '解方程·去分母',
    'math.7.ch3.kp5': '应用题·行程',
    'math.7.ch3.kp6': '应用题·工程',
    'math.7.ch3.kp7': '应用题·浓度',
    'math.7.ch2.kp3': '合并同类项',
    'math.7.ch2.kp4': '去括号',
};

const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send-btn');
const inputRow = document.getElementById('input-row');
const welcomeBlock = document.getElementById('welcome-block');
const pasteWarn = document.getElementById('paste-warn');
// railL 已删（学科树左栏移除）
const railR = document.getElementById('rail-r');
const overlay = document.getElementById('rail-overlay');
const history = [];

// P1-D 学习模式：默认 explain（讲题），切换会改 send body 的 mode 字段 + 输入框 placeholder
let currentMode = 'explain';
const MODE_HINT = {
    explain: { ph: '说说你想学什么，或者卡在哪一步…', sys: '你刚切到讲题模式 · 直接说题目或卡点' },
    recall: { ph: '今天课上学了啥？挑一道你做的题给我讲讲…', sys: '🎙️ 切到下课讲一讲 · 老师假装没去上课，你给老师讲今天学的。讲清楚说明你真懂了；卡的地方就是该补的地方（费曼学习法）' },
    diagnose: { ph: '把你的错题贴过来，老师 64 类归因找根因…', sys: '🔍 切到错题归因 · 贴上你刚错的那道，老师会找出错在哪一步、为什么错、下次怎么避免' },
    cram: { ph: '说考试时间和范围，比如「下周三月考，第 1-3 章」…', sys: '⏰ 切到考前突击 · 告诉我考试时间 + 范围，老师按 BKT 推算给你 5-7 天计划' },
    essay: { ph: '把你的作文粘过来（不要怕脏，老师不评分只指方向）…', sys: '✍️ 切到作文批改 · 粘进来一段，老师会标 3 个具体可改的点，不空泛说「立意好」' },
};
function switchMode(mode) {
    if (mode === currentMode) return;
    currentMode = mode;
    document.querySelectorAll('.mode-chip').forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
    const meta = MODE_HINT[mode];
    if (meta) {
        document.getElementById('msg').placeholder = meta.ph;
        addSystemHint(meta.sys);
    }
    document.getElementById('msg').focus();
}
document.querySelectorAll('.mode-chip').forEach(chip => {
    chip.addEventListener('click', () => switchMode(chip.dataset.mode));
});

// 顶部副标题
if (NAME && NAME !== '同学') {
    document.getElementById('tutor-title').textContent = `莫小语 · ${NAME} 的私教`;
}
// 雷达带身份
const radarHref = `/radar?student_id=${encodeURIComponent(STUDENT_ID)}&name=${encodeURIComponent(NAME)}`;
document.getElementById('hero-to-radar').href = radarHref;
document.getElementById('cta-radar').href = radarHref;

// 当前 KP 同步右栏
const kpDisplay = KP_NAME_HINT[TOPIC_CODE] || '解方程·移项';
document.getElementById('now-kp').textContent = kpDisplay;

// 个性化欢迎语（不灌鸡汤，引用具体卡点）
function buildGreeting() {
    if (NAME !== '同学') {
        return {
            h2: `${NAME}，咱们继续`,
            sub: `上次卡在「移项忘记变号」第 3 步。今天接着这个，还是先看新题？`
        };
    }
    return {
        h2: '嗯，咱们继续',
        sub: '直接说你想问什么，或者从下面挑一个开始'
    };
}
const g = buildGreeting();
document.getElementById('hero-greet').textContent = g.h2;
document.getElementById('hero-sub').textContent = g.sub;

// ─── 粘贴检测 ───
const PASTE_THRESHOLD = 15;
let pasteState = { flagged: false, len: 0 };
function updatePasteUI() {
    if (pasteState.flagged) {
        pasteWarn.classList.add('show');
        inputRow.classList.add('pasted');
    } else {
        pasteWarn.classList.remove('show');
        inputRow.classList.remove('pasted');
    }
}
input.addEventListener('paste', e => {
    const data = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (data.length >= PASTE_THRESHOLD) {
        pasteState = { flagged: true, len: data.length };
        updatePasteUI();
    }
});
input.addEventListener('input', () => {
    if (pasteState.flagged && input.value.length < Math.floor(pasteState.len / 2)) {
        pasteState = { flagged: false, len: 0 };
        updatePasteUI();
    }
});

function scrollToBottom() {
    const center = document.querySelector('.center');
    requestAnimationFrame(() => {
        center.scrollTo({ top: center.scrollHeight, behavior: 'smooth' });
    });
}

function addBubble(role, text) {
    if (welcomeBlock) welcomeBlock.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'bubble ' + role;
    if (role === 'tutor') {
        const av = document.createElement('div');
        av.className = 'b-avatar';
        av.textContent = '墨';
        const c = document.createElement('div');
        c.className = 'b-content';
        c.textContent = text;
        wrap.appendChild(av);
        wrap.appendChild(c);
    } else {
        const b = document.createElement('div');
        b.className = 'body';
        b.textContent = text;
        wrap.appendChild(b);
    }
    chat.appendChild(wrap);
    scrollToBottom();
    return role === 'tutor' ? wrap.querySelector('.b-content') : wrap;
}

function addSystemHint(text) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble system';
    const b = document.createElement('div');
    b.className = 'body';
    b.textContent = text;
    wrap.appendChild(b);
    chat.appendChild(wrap);
    scrollToBottom();
}

function makeDots() {
    const dots = document.createElement('span');
    dots.className = 'dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    return dots;
}

async function send(message) {
    if (!message || !message.trim()) return;
    if (welcomeBlock) welcomeBlock.style.display = 'none';
    const isPasted = pasteState.flagged && message.length >= PASTE_THRESHOLD;
    addBubble('student', message);
    history.push({ role: 'user', content: message });
    input.value = '';
    pasteState = { flagged: false, len: 0 };
    updatePasteUI();
    sendBtn.disabled = true;

    const tutorContent = addBubble('tutor', '');
    const dots = makeDots();
    tutorContent.appendChild(dots);

    let accumulated = '';
    try {
        const resp = await fetch('/api/tutor-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                student_id: STUDENT_ID,
                message,
                session_id: SESSION_ID,
                topic_code: TOPIC_CODE,
                history: history.slice(0, -1),
                is_pasted: isPasted,
                mode: currentMode,  // P1-D 学习模式
                prompt_version: 'v3',  // 家庭学习运营官版（学校互补 + 苏格拉底+费曼）
                client_hour: new Date().getHours(),  // 让 AI 根据放学时段决定开场（17-19 点起「下课讲讲」话头）
            }),
        });
        if (!resp.ok) {
            let friendly;
            if (resp.status === 429) friendly = '稍等一下，喘口气再问哦（30 秒后再发）';
            else if (resp.status === 503) friendly = '服务暂时离线，等一下再试';
            else if (resp.status === 502) friendly = '上游模型不在状态，先刷新看看';
            else friendly = `[出错 ${resp.status}] ` + (await resp.text().catch(() => '')).slice(0, 120);
            tutorContent.textContent = friendly;
            return;
        }

        const memUsed = resp.headers.get('X-Memory-Used');
        const weakN = resp.headers.get('X-Weak-Kps');
        const pasteHit = resp.headers.get('X-Paste-Detected');
        if (memUsed) document.getElementById('b-memory').textContent = `记得 ${memUsed} 条`;
        if (weakN) document.getElementById('b-weak').textContent = `最弱 ${weakN} 处`;
        if (pasteHit === '1') addSystemHint('🔍 老师识到你这条是粘贴的 · 它会先问你的思路再开讲');

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = line.slice(6).trim();
                if (!data || data === '[DONE]') continue;
                try {
                    const j = JSON.parse(data);
                    const delta = j.choices?.[0]?.delta?.content;
                    if (delta) {
                        accumulated += delta;
                        tutorContent.textContent = accumulated;
                        scrollToBottom();
                    }
                } catch (e) { /* skip */ }
            }
        }
        if (accumulated) history.push({ role: 'assistant', content: accumulated });
    } catch (e) {
        tutorContent.textContent = '[网络异常] ' + e.message;
    } finally {
        if (dots && dots.parentNode) dots.remove();
        sendBtn.disabled = false;
        input.focus();
    }
}

sendBtn.addEventListener('click', () => send(input.value));
input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(input.value);
    }
});

document.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => send(btn.dataset.q));
});

// 移动端右栏抽屉（左栏已删，只剩右栏切换）
function closeRails() {
    if (railR) railR.classList.remove('open');
    if (overlay) overlay.classList.remove('show');
}
document.getElementById('mob-r-toggle')?.addEventListener('click', () => {
    if (railR) railR.classList.add('open');
    if (overlay) overlay.classList.add('show');
});
overlay?.addEventListener('click', closeRails);

// 启动 hint
if (IS_DEMO_USER) {
    addSystemHint('👋 你正在用演示账号 · 想用自己的档案？← 回首页填 30 秒');
}
if (TOPIC_CODE && TOPIC_CODE !== 'math.7.ch3.kp3') {
    addSystemHint(`📍 你刚做完「${kpDisplay}」练习 · 直接说卡哪儿就行`);
    input.placeholder = `比如：${kpDisplay} 那一题我没看懂为什么...`;
}

// ─── 学科 hub 错题切片 "🤖 讲讲" 入口: ?q=err_id&topic=keyword 自动 prefill ───
(function () {
    const qid = params.get('q');
    const topicKw = params.get('topic');
    if (!qid && !topicKw) return;
    let errPool = [];
    try { errPool = JSON.parse(localStorage.getItem('ydzx_errors_pool') || '[]') || []; } catch(_){}
    const e = qid ? errPool.find(x => x.id === qid) : null;
    if (e) {
        const tag = e.keyword || (e.mistakeTags && e.mistakeTags[0]) || topicKw || '错题';
        addSystemHint(`📕 带着这道错题来的 · 「${tag}」 · 阶段 ${e.reviewCount || 0}/3`);
        input.placeholder = `就这道题:「${(e.question || '').slice(0, 40).replace(/[\n\r]/g,' ')}…」 我做的时候卡在...`;
        input.value = `老师，这道${tag}的题我没做对，你能讲讲吗？\n\n题目：${(e.question || '').slice(0, 200)}\n我答的：${e.studentAnswer || '(未记录)'}\n正解：${e.correctAnswer || '(未记录)'}`;
    } else if (topicKw) {
        addSystemHint(`📍 你想问「${topicKw}」 · 直接说卡在哪一步`);
        input.placeholder = `比如：${topicKw} 那一题我没看懂为什么...`;
    }
})();
input.focus();

// ─── 呼叫学长（P0 第二件 escalation）─────────
const KIND_LABELS = {
    concept: { em: '🧠', label: '概念性问题' },
    emotion: { em: '💙', label: '情绪/状态' },
    streak_3_wrong: { em: '🔁', label: '同型连错 3 次' },
    planning: { em: '🗺️', label: '长程规划' },
    manual: { em: '✋', label: '其他/直接呼叫' },
};

function openEscalateDialog(presetKind = 'manual') {
    let overlay = document.getElementById('esc-overlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'esc-overlay';
        overlay.className = 'esc-overlay';
        overlay.innerHTML = `
            <div class="esc-panel">
                <h3>呼叫学长学姐</h3>
                <p class="esc-sub">他们 30 分钟内异步回。等的时候你可以接着做别的题。</p>
                <div class="esc-kind-row" id="esc-kind-row">
                    ${Object.entries(KIND_LABELS).map(([k, v]) =>
                        `<button class="esc-kind" data-kind="${k}"><span class="em">${v.em}</span>${v.label}</button>`
                    ).join('')}
                </div>
                <textarea class="esc-textarea" id="esc-msg" placeholder="说说你卡在哪儿，越具体学长越能帮你（贴题、贴你写的过程都行）..."></textarea>
                <div class="esc-actions">
                    <button class="esc-btn cancel" id="esc-cancel">取消</button>
                    <button class="esc-btn submit" id="esc-submit">发出 →</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        let selectedKind = presetKind;
        const kindRow = overlay.querySelector('#esc-kind-row');
        const textarea = overlay.querySelector('#esc-msg');
        kindRow.querySelectorAll('.esc-kind').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedKind = btn.dataset.kind;
                kindRow.querySelectorAll('.esc-kind').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        overlay.querySelector('#esc-cancel').addEventListener('click', () => {
            overlay.classList.remove('show');
        });
        overlay.addEventListener('click', e => {
            if (e.target === overlay) overlay.classList.remove('show');
        });
        overlay.querySelector('#esc-submit').addEventListener('click', async () => {
            const msg = textarea.value.trim();
            if (!msg) { textarea.focus(); return; }
            const submitBtn = overlay.querySelector('#esc-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = '发出中...';
            try {
                const r = await fetch('/api/escalate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: STUDENT_ID,
                        kind: selectedKind,
                        student_message: msg,
                        topic_code: TOPIC_CODE,
                        ai_summary: `${NAME} 在「${KP_NAME_HINT[TOPIC_CODE] || TOPIC_CODE}」呼叫学长 · ${KIND_LABELS[selectedKind].label}`,
                        context: {
                            recent_chat_summary: history.slice(-4).map(h => h.role + ': ' + (h.content || '').slice(0, 150)).join('\n'),
                            current_kp: TOPIC_CODE,
                        },
                    }),
                });
                const data = await r.json();
                if (data.ok) {
                    addSystemHint(data.message || '已发出，等学长学姐回你');
                    overlay.classList.remove('show');
                    textarea.value = '';
                    submitBtn.textContent = '发出 →';
                    submitBtn.disabled = false;
                    loadEscalateHistory();
                } else {
                    submitBtn.textContent = '失败重试';
                    submitBtn.disabled = false;
                    addSystemHint(`呼叫失败 · ${data.message || data.error}`);
                }
            } catch (e) {
                submitBtn.textContent = '失败重试';
                submitBtn.disabled = false;
            }
        });
    }
    // 默认 active 第一个 kind
    overlay.querySelectorAll('.esc-kind').forEach(b => b.classList.toggle('active', b.dataset.kind === presetKind));
    overlay.classList.add('show');
    setTimeout(() => overlay.querySelector('#esc-msg')?.focus(), 100);
}

document.getElementById('call-mentor-btn')?.addEventListener('click', () => openEscalateDialog('manual'));

// P1-4 · 检查最近 1 小时内学长回复，弹 banner 给孩子
async function checkMentorResolved() {
    try {
        const r = await fetch(`/api/escalate?student_id=${encodeURIComponent(STUDENT_ID)}&status=resolved&limit=5`);
        if (!r.ok) return;
        const data = await r.json();
        if (!data.ok || !Array.isArray(data.escalations)) return;
        const oneHourAgo = Date.now() - 60 * 60 * 1000;
        const fresh = data.escalations.filter(e => {
            if (!e.resolved_at) return false;
            return new Date(e.resolved_at).getTime() > oneHourAgo;
        });
        // 已读追踪：sessionStorage 'yd:read_esc' 是 id 数组 JSON
        let read = [];
        try { read = JSON.parse(sessionStorage.getItem('yd:read_esc') || '[]'); } catch(e) {}
        const unread = fresh.filter(e => !read.includes(e.id));
        if (unread.length === 0) return;
        // 取最新一条弹 hint
        const e = unread[0];
        const lab = KIND_LABELS[e.kind]?.label || '回复';
        addSystemHint(`📩 学长回复了你的「${lab}」（${e.created_at_rel}）· 点右栏「呼叫记录」看完整回复`);
        // 标记已读
        read.push(e.id);
        sessionStorage.setItem('yd:read_esc', JSON.stringify(read.slice(-30)));
        // 同步刷新右栏列表
        loadEscalateHistory();
    } catch (e) { /* silent */ }
}
checkMentorResolved();
setInterval(checkMentorResolved, 60 * 1000);  // 每 60 秒拉一次

// 点开 resolved 看完整回复
window.showMentorReply = async function(escId, kindLabel) {
    try {
        const r = await fetch(`/api/escalate?student_id=${encodeURIComponent(STUDENT_ID)}&limit=20`);
        if (!r.ok) return;
        const data = await r.json();
        const e = (data.escalations || []).find(x => x.id === escId);
        if (!e || !e.resolution_content) {
            addSystemHint('回复还没拉到，稍后看看');
            return;
        }
        // 把回复以 tutor 气泡形式追加到对话区（视觉上像老师在线讲解）
        if (welcomeBlock) welcomeBlock.style.display = 'none';
        const wrap = document.createElement('div');
        wrap.className = 'bubble tutor';
        const av = document.createElement('div');
        av.className = 'b-avatar';
        av.textContent = '学';
        av.style.background = 'linear-gradient(135deg,#5B8DBF,#8FB4D9)';
        const c = document.createElement('div');
        c.className = 'b-content';
        c.style.borderLeftColor = '#5B8DBF';
        c.innerHTML = `<div style="font-size:0.74rem;color:#5B8DBF;font-weight:700;margin-bottom:4px">学长回复 · ${escapeHtml(kindLabel)}</div>${escapeHtml(e.resolution_content)}`;
        wrap.appendChild(av);
        wrap.appendChild(c);
        chat.appendChild(wrap);
        scrollToBottom();
    } catch (e) {
        addSystemHint('打不开回复，再点一次试试');
    }
};
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function loadEscalateHistory() {
    try {
        const r = await fetch(`/api/escalate?student_id=${encodeURIComponent(STUDENT_ID)}&limit=5`);
        if (!r.ok) return;
        const data = await r.json();
        if (!data.ok || !Array.isArray(data.escalations) || data.escalations.length === 0) return;
        const recent = document.getElementById('mentor-recent');
        if (!recent) return;
        recent.style.display = 'block';
        recent.innerHTML = data.escalations.slice(0, 3).map(e => {
            const lab = KIND_LABELS[e.kind]?.label || e.kind;
            const cls = e.status === 'resolved' ? 'resolved' : (e.status === 'pending' ? 'pending' : '');
            const stat = e.status === 'pending' ? '等回复' : (e.status === 'resolved' ? '✓ 已回 · 点开' : (e.status === 'claimed' ? '处理中' : ''));
            const clickAttr = e.status === 'resolved' && e.resolution_content
                ? `style="cursor:pointer" onclick="showMentorReply('${e.id}', ${JSON.stringify(lab).replace(/"/g,'&quot;')})"` : '';
            return `<div class="item ${cls}" ${clickAttr}><span>${lab} · ${e.created_at_rel}</span><span>${stat}</span></div>`;
        }).join('');
        // ETA：算 pending 平均，没 pending 就算 resolved 平均
        const pending = data.escalations.filter(e => e.status === 'pending');
        const resolved = data.escalations.filter(e => e.status === 'resolved' && e.resolution_minutes);
        const eta = document.getElementById('mentor-eta');
        if (eta) {
            if (resolved.length) {
                const avg = Math.round(resolved.reduce((s, e) => s + e.resolution_minutes, 0) / resolved.length);
                eta.textContent = `平均 ${avg} 分钟回你（实测 ${resolved.length} 次）`;
            } else if (pending.length) {
                eta.textContent = `${pending.length} 条等回复中`;
            }
        }
    } catch (e) { /* silent */ }
}
loadEscalateHistory();

// ─── 右栏接真数据 · loadKpStates ───
// 替换 hardcode 0.62 / 明天 19:00 / 移项忘记变号 3 次 这些字面量
// fetch 失败保留占位文案不让页面残废（network/cold-start 兜底）
async function loadKpStates() {
    try {
        const r = await fetch(`/api/student-kp-states?student_id=${encodeURIComponent(STUDENT_ID)}&subject=math`);
        if (!r.ok) {
            console.warn('[kp-states] fetch failed', r.status);
            return;
        }
        const data = await r.json();
        if (!data || !data.ok || !Array.isArray(data.states)) return;

        // 1. 「现在练」+ BKT 进度
        // 优先 URL 指定的 TOPIC_CODE；其次 summary.next_focus；fallback 第一个非已掌握
        let focus = data.states.find(s => s.code === TOPIC_CODE)
                 || data.summary?.next_focus
                 || data.states.find(s => s.stage !== '已掌握')
                 || data.states[0];
        if (focus) {
            document.getElementById('now-kp').textContent = focus.name || focus.code;
            const score = Number(focus.mastery_score) || 0;
            document.getElementById('bkt-num').textContent = score.toFixed(2);
            document.getElementById('bkt-bar').style.width = Math.round(score * 100) + '%';
        }

        // 2. 最近卡点：取 stage 不是「已掌握」的，按 mastery 升序前 4 个
        const weak = data.states
            .filter(s => s.stage !== '已掌握')
            .sort((a, b) => a.mastery_score - b.mastery_score)
            .slice(0, 4);
        const ul = document.getElementById('weak-list');
        if (weak.length) {
            ul.innerHTML = weak.map(s => {
                const wrong = (s.attempts_count || 0) - (s.correct_count || 0);
                const tag = wrong > 0 ? `${wrong} 次错` : `掌握 ${(s.mastery_score * 100).toFixed(0)}%`;
                return `<li><span>${s.name || s.code}</span><span class="ct">${tag}</span></li>`;
            }).join('');
        } else if (data.states.length === 0) {
            ul.innerHTML = `<li><span style="color:var(--ink-mute)">还没练过题，先做几道老师就摸到底了</span></li>`;
        }

        // 3. 下次复习：取最快到期的 KP（不论是否已过期）
        const withReview = data.states.filter(s => s.next_review_at);
        if (withReview.length) {
            const soonest = withReview.sort((a, b) =>
                new Date(a.next_review_at) - new Date(b.next_review_at))[0];
            const isDue = new Date(soonest.next_review_at).getTime() <= Date.now();
            const review = document.getElementById('next-review');
            review.innerHTML = `<span>${isDue ? '🔥' : '📅'}</span>` +
                `<span>${soonest.next_review_rel} · ${soonest.name} 复习题（FSRS 推算）</span>`;
            if (isDue) review.style.background = 'var(--orange-bg)';
        }

        // 4. 左栏学科树：根据真 stage 给 .kp 加 .done/.active class
        // demo 默认右栏选中 TOPIC_CODE → active；其余按 mastery 重新着色
        document.querySelectorAll('.kp').forEach(el => {
            const code = el.dataset.kp;
            const state = data.states.find(s => s.code === code);
            if (!state) return;
            // 不动 active（用户点击切换的，不重写），只刷 done
            if (state.stage === '已掌握') {
                el.classList.add('done');
                el.classList.remove('active');
                el.querySelector('.ic').textContent = '✓';
            } else if (state.stage === '攻克中' && code === (focus?.code || TOPIC_CODE)) {
                el.classList.add('active');
                el.classList.remove('done');
                el.querySelector('.ic').textContent = '●';
            }
        });

        // 5. 顶部副标题更新
        const summary = data.summary || {};
        const memEl = document.getElementById('b-memory');
        const weakEl = document.getElementById('b-weak');
        if (memEl && summary.total) memEl.textContent = `跟过 ${summary.total} 个知识点`;
        if (weakEl && (summary.weak + summary.active)) {
            weakEl.textContent = `还有 ${summary.weak + summary.active} 处要练`;
        }
    } catch (e) {
        console.warn('[kp-states] error', e);
    }
}
loadKpStates();
</script>
